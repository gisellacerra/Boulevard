standings=function(){const groups=new Map();for(const m of matches.filter(completed)){if(category!=='Todas'&&m.cat!==category)continue;const key=m.cat+' · '+(m.zona?'Zona '+m.zona:'General');if(!groups.has(key))groups.set(key,new Map());const group=groups.get(key);for(const name of [m.a,m.b])if(!group.has(name))group.set(name,{name,pj:0,pts:0});const a=Number(m.resultado.setsLocal),b=Number(m.resultado.setsVisitante);if(!Number.isFinite(a)||!Number.isFinite(b)||a===b)continue;const local=group.get(m.a),away=group.get(m.b);local.pj++;away.pj++;local.pts+=a>b?(b===0?3:2):(a===0?0:1);away.pts+=b>a?(a===0?3:2):(b===0?0:1);}
return groups.size?[...groups].map(([label,g])=>`<div class="section-title"><h2>${safe(label)}</h2><span class="tiny muted">PJ · PTS</span></div>${[...g.values()].sort((a,b)=>b.pts-a.pts||a.name.localeCompare(b.name)).map(t=>`<div class="statline"><div>${safe(t.name)}</div><div>${t.pj} &nbsp; <span class="chip">${t.pts}</span></div></div>`).join('')}`).join('')+'<p class="notice">Puntos según resultados publicados (3–2–1–0). Igualdad de puntos: consultar la clasificación oficial.</p>':`<div class="empty">${ncEmptyData('Las posiciones aparecerán cuando se publiquen resultados.')}</div>`;};
navRender=function(){const active=page==='inicio'?'inicio':['partidos','fixture','resultados'].includes(page)?'partidos':page==='posiciones'?'posiciones':'mas';$('#nav').innerHTML=routes.map(([p,t,i])=>`<button class="${p===active?'active':''}" onclick="go('${p}')" ${p===active?'aria-current="page"':''}>${icon(i)}<span>${t}</span></button>`).join('');$('#menuSports').innerHTML=[['equipos','Equipos','users'],...sports].map(([p,t,i])=>`<button class="menuitem" onclick="go('${p}')">${icon(i)}${t}</button>`).join('');$('#menuOther').innerHTML=others.map(([p,t,i])=>`<button class="menuitem" onclick="go('${p}')">${icon(i)}${t}</button>`).join('');};
render();

// Carga participativa: sin sesiones, sin título, publicación inmediata.
const PHOTO_ENDPOINT=NC_FOTOS_API;
let photoBusy=false,photoRequest='',photoInputFile=null,photoPayload=null;
const uploadId=()=>crypto.randomUUID?crypto.randomUUID().replaceAll('-',''):Array.from(crypto.getRandomValues(new Uint8Array(20)),v=>v.toString(16).padStart(2,'0')).join('');
function photoClient(){try{let id=localStorage.getItem('newcom_photo_browser');if(!id){id=uploadId();localStorage.setItem('newcom_photo_browser',id);}return id;}catch(e){throw Error('Habilitá el almacenamiento del navegador para subir fotos.');}}
function photoDay(){return new Date().toLocaleDateString('en-CA',{timeZone:'America/Argentina/Buenos_Aires'});}
function photoUsed(){try{const q=JSON.parse(localStorage.getItem('newcom_photo_daily')||'{}');return q.day===photoDay()?Number(q.used)||0:0;}catch(e){return 0;}}
function photoQuota(left){try{localStorage.setItem('newcom_photo_daily',JSON.stringify({day:photoDay(),used:5-left}));}catch(e){}}
function photoStatus(text){document.getElementById('photo-upload-status').textContent=text;}
function openPhotoUpload(){const modal=document.getElementById('photo-upload');modal.showModal();photoStatus(!PHOTO_ENDPOINT?'La carga de fotos todavía no está habilitada.':photoUsed()>=5?'Ya subiste las 5 fotos permitidas por hoy.':'');document.getElementById('photo-send').disabled=!PHOTO_ENDPOINT||photoUsed()>=5||photoBusy;}
function closePhotoUpload(){document.getElementById('photo-upload').close();}
async function optimizePhoto(file){
 if(file.size>3*1024*1024)throw Error('La foto supera los 3 MB. Elegí una más liviana.');
 if(!file.size||!/^image\/(jpeg|png|webp)$/i.test(file.type))throw Error('Elegí una foto JPG, PNG o WebP.');
 const bitmap=await createImageBitmap(file,{imageOrientation:'from-image'});
 try{let scale=Math.min(1,1600/Math.max(bitmap.width,bitmap.height));const canvas=document.createElement('canvas');
 for(let attempt=0;attempt<5;attempt++){
  canvas.width=Math.max(1,Math.round(bitmap.width*scale));canvas.height=Math.max(1,Math.round(bitmap.height*scale));const ctx=canvas.getContext('2d');ctx.fillStyle='#ffffff';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.drawImage(bitmap,0,0,canvas.width,canvas.height);
  for(const quality of [.84,.72,.60,.48]){const blob=await new Promise(resolve=>canvas.toBlob(resolve,'image/jpeg',quality));if(blob&&blob.size<=300*1024){const image=await new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.onerror=reject;reader.readAsDataURL(blob);});return {image,width:canvas.width,height:canvas.height,originalSize:file.size};}}
  scale*=.75;
 }
 throw Error('No se pudo reducir la foto. Probá con otra.');
 }finally{bitmap.close();}
}
// Confirmación por consulta al servidor, independiente de iframes y cookies de terceros.
function photoServerStatus(payload){return new Promise((resolve,reject)=>{
 const cb='ncReceipt_'+uploadId(),tag=document.createElement('script');let timer;
 function cleanup(){clearTimeout(timer);tag.remove();delete window[cb];}
 window[cb]=data=>{cleanup();resolve(data);};
 tag.onerror=()=>{cleanup();reject(Error('No se pudo consultar NEWCOM FOTOS. Revisá el acceso público de la implementación.'));};
 timer=setTimeout(()=>{cleanup();reject(Error('NEWCOM FOTOS no respondió. Revisá la implementación de Apps Script.'));},20000);
 const params=new URLSearchParams({api:'estado',client:payload.client,request:payload.request,callback:cb,t:String(Date.now())});
 tag.src=PHOTO_ENDPOINT+(PHOTO_ENDPOINT.includes('?')?'&':'?')+params;document.head.appendChild(tag);
 });}
async function submitPhotoForm(payload){
 const before=await photoServerStatus(payload);
 if(!before||!before.state)throw Error('Actualizá Fotos.gs y publicá una nueva versión de NEWCOM FOTOS.');
 if(before.state==='saved')return before;
 if(!before.ok&&before.state!=='error')return before;
 photoStatus('Enviando foto…');
 // La respuesta POST es opaca entre dominios. El éxito se confirma únicamente con el recibo.
 fetch(PHOTO_ENDPOINT,{method:'POST',mode:'no-cors',credentials:'omit',redirect:'follow',body:new URLSearchParams({payload:JSON.stringify(payload)})}).catch(()=>{});
 const deadline=Date.now()+90000;
 while(Date.now()<deadline){
  await new Promise(resolve=>setTimeout(resolve,2500));
  try{const result=await photoServerStatus(payload);if(result.state==='saved'||result.state==='error')return result;if(!result.ok)return result;}
  catch(error){if(Date.now()>=deadline)throw error;}
  photoStatus('Esperando confirmación de publicación…');
 }
 throw Error('No recibimos confirmación. Reintentá con la misma foto seleccionada para evitar duplicados.');
}

async function sendPhoto(event){event.preventDefault();if(photoBusy)return;const input=document.getElementById('photo-file'),file=input.files[0];if(!file){photoStatus('Elegí una foto.');return;}if(!PHOTO_ENDPOINT){photoStatus('La carga de fotos todavía no está habilitada.');return;}if(photoUsed()>=5){photoStatus('Ya subiste las 5 fotos permitidas por hoy.');return;}photoBusy=true;const button=document.getElementById('photo-send');button.disabled=true;
 try{photoStatus('Preparando foto…');if(file!==photoInputFile||!photoPayload){photoPayload={...await optimizePhoto(file),client:photoClient(),request:uploadId()};photoInputFile=file;}const payload={...photoPayload,nonce:uploadId()};photoStatus('Subiendo foto…');const result=await submitPhotoForm(payload);if(!result.ok)throw Error(result.error||'No se pudo publicar la foto.');photoQuota(result.restantes);if(result.foto){ncFotosPublicas=ncFotosPublicas.filter(p=>p.id!==result.foto.id);ncFotosPublicas.unshift(result.foto);}photoIndex=0;photoLoadState='ready';ncFotosPintar();input.value='';photoPayload=null;photoInputFile=null;document.getElementById('photo-preview').replaceChildren();photoStatus('¡Tu foto ya está publicada!');}
 catch(error){photoStatus(error.message||'No se pudo subir la foto. Intentá nuevamente.');}finally{photoBusy=false;button.disabled=photoUsed()>=5;}
}
function galleryImages(){return ncFotosPublicas.filter(p=>typeof p.url==='string'&&/^https:\/\//i.test(p.url));}
ncCarouselPaint=function(){const target=document.getElementById('somos-carousel');if(!target)return;const photos=galleryImages();if(!photos.length){target.innerHTML=`<div class="carousel-photo"><div class="gallery-empty">${icon('users')}<p>${PHOTO_ENDPOINT?(photoLoadState==='loading'?'Cargando fotos…':'¡Compartí la primera foto del torneo!'):'Las fotos del torneo aparecerán acá.'}</p></div></div>`;return;}photoIndex=((photoIndex%photos.length)+photos.length)%photos.length;const p=photos[photoIndex];target.innerHTML=`<div class="carousel-photo" id="carousel-touch"><img src="${safe(p.url)}" alt="Foto compartida del torneo" decoding="async">${photos.length>1?`<button class="prev" aria-label="Fotografía anterior" onclick="photoMove(-1)">${icon('left')}</button><button class="next" aria-label="Fotografía siguiente" onclick="photoMove(1)">${icon('chevron')}</button>`:''}</div>${photos.length>1?`<div class="photo-counter">${photoIndex+1} / ${photos.length}</div>`:''}`;let start;const touch=$('#carousel-touch');touch.addEventListener('touchstart',e=>start=e.changedTouches[0].clientX,{passive:true});touch.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-start;if(Math.abs(dx)>45)photoMove(dx<0?1:-1);},{passive:true});};
const galleryGeneric=generic;generic=function(){if(page==='galeria')return `<div class="photo-bar"><button class="link" onclick="go('inicio')">‹ Inicio</button><button class="upload-photo" onclick="openPhotoUpload()">Subí tu foto</button></div><div class="photo-grid photo-full">${galleryImages().map(p=>`<figure><img loading="lazy" src="${safe(p.url)}" alt="Foto compartida del torneo"></figure>`).join('')||'<p class="empty">Todavía no hay fotos compartidas.</p>'}</div>`;return galleryGeneric();};
ncFotosCargar=function(){if(!PHOTO_ENDPOINT){photoLoadState='unavailable';ncFotosPintar();return;}const cb='ncPhotos_'+Date.now()+Math.floor(Math.random()*1000),tag=document.createElement('script');let timer;const clean=()=>{clearTimeout(timer);tag.remove();delete window[cb];};const fail=()=>{clean();photoLoadState='unavailable';ncFotosPintar();};window[cb]=d=>{clean();if(d?.ok&&Array.isArray(d.fotos)){ncFotosPublicas=d.fotos;photoLoadState='ready';}else photoLoadState='unavailable';ncFotosPintar();};tag.onerror=fail;timer=setTimeout(fail,15000);tag.src=PHOTO_ENDPOINT+'?api=fotos&callback='+cb;document.head.appendChild(tag);};
document.getElementById('photo-upload-form').addEventListener('submit',sendPhoto);
document.getElementById('photo-file').addEventListener('change',async function(){photoInputFile=null;photoPayload=null;photoStatus('');const preview=document.getElementById('photo-preview');preview.replaceChildren();const f=this.files[0];if(!f)return;if(f.size>3*1024*1024){photoStatus('La foto supera los 3 MB. Elegí una más liviana.');this.value='';return;}if(!/^image\/(jpeg|png|webp)$/i.test(f.type)){photoStatus('Elegí una foto JPG, PNG o WebP.');this.value='';return;}const url=URL.createObjectURL(f),img=new Image();img.alt='Vista previa de tu foto';img.onload=img.onerror=()=>URL.revokeObjectURL(url);img.src=url;preview.append(img);});
setInterval(()=>{if(!document.hidden&&!photoBusy)ncFotosCargar();},60000);
render();

const ncRenderWithDataStatus=render;
render=function(){ncRenderWithDataStatus();if(ncDataPhase==='error'){const box=document.createElement('div');box.className='data-status';box.setAttribute('role','status');box.innerHTML=`<span>${safe(ncDataMessage)}</span><button class="link" onclick="ncDatosCargar()">Reintentar</button>`;document.getElementById('view').prepend(box);}};
ncFotosCargar();ncDatosCargar();
</script></body></html>
