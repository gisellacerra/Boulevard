<header class="top"><button aria-label="Abrir menú" onclick="drawer(true)"><svg class="ic"><use href="#i-menu"/></svg></button><div class="brand">NEWCOM LIVE<small>TORNEO NACIONAL</small></div><button aria-label="Avisos" onclick="go('avisos')"><svg class="ic"><use href="#i-bell"/></svg></button></header><main class="app"><div class="view" id="view"></div></main><div class="bottom"><nav id="nav"></nav></div><div class="drawer" id="drawer" onclick="if(event.target===this)drawer(false)"><aside><div class="head"><span class="brand">NEWCOM LIVE</span><button class="iconbtn" aria-label="Cerrar menú" onclick="drawer(false)"><svg class="ic"><use href="#i-close"/></svg></button></div><h3>COMPETENCIA</h3><div id="menuSports"></div><h3>SERVICIOS Y NOVEDADES</h3><div id="menuOther"></div></aside></div>
<script>
const $=s=>document.querySelector(s);const icon=n=>`<svg class="ic" aria-hidden="true"><use href="#i-${n}"/></svg>`;let page='inicio',category='Todas',teamPage=0,search='',day='Hoy',subtab='Posiciones';const cats=['Todas','+50','+60','+68'];let teams=[];let matches=[];let ncCruces=[];const ncFechaHoy=()=>new Date().toLocaleDateString('en-CA');const routes=[['inicio','Inicio','home'],['partidos','Partidos','calendar'],['torneo','Torneo','trophy'],['equipos','Equipos','users']];const sports=[['fixture','Fixture','calendar'],['resultados','Resultados','list'],['zonas','Zonas','grid'],['posiciones','Posiciones','trophy'],['cruces','Cruces y finales','flag'],['historial','Historial','clock']];const others=[['avisos','Avisos','bell'],['streaming','Transmisiones','radio'],['alojamiento','Alojamiento','bed'],['bufet','Bufet','coffee'],['sedes','Sedes','pin'],['informacion','Información','info']];const title={inicio:'Inicio',partidos:'Partidos',torneo:'Torneo',equipos:'Equipos',...Object.fromEntries([...sports,...others].map(x=>[x[0],x[1]]))};function drawer(open){$('#drawer').classList.toggle('open',open)}function go(p){page=p;teamPage=0;search='';drawer(false);render();window.scrollTo(0,0)}function navRender(){let active=routes.some(r=>r[0]===page)?page:['fixture','resultados'].includes(page)?'partidos':['equipos'].includes(page)?'equipos':'torneo';$('#nav').innerHTML=routes.map(([p,t,i])=>`<button class="${active===p?'active':''}" onclick="go('${p}')" aria-label="${t}" ${active===p?'aria-current="page"':''}>${icon(i)}<span>${t}</span></button>`).join('');$('#menuSports').innerHTML=sports.map(([p,t,i])=>`<button class="menuitem" onclick="go('${p}')">${icon(i)}${t}</button>`).join('');$('#menuOther').innerHTML=others.map(([p,t,i])=>`<button class="menuitem" onclick="go('${p}')">${icon(i)}${t}</button>`).join('')}
function head(t,tag='CENTRO DEL TORNEO'){return `<div class="pagehead"><div><div class="eyebrow">${tag}</div><h1>${t}</h1></div><span class="tiny muted">${new Date().getFullYear()}</span></div>`}function tabs(arr,active,fn){return `<div class="strip">${arr.map(v=>`<button class="${v===active?'active':''}" onclick="${fn}('${v}')">${v}</button>`).join('')}</div>`}function catTabs(){return tabs(cats,category,'setCat')}function setCat(v){category=v;teamPage=0;render()}function setDay(v){day=v;render()}function setSub(v){subtab=v;render()}function filterMatches(){return matches.filter(m=>category==='Todas'||m.cat===category)}function matchRows(arr){return arr.length?arr.map(m=>`<div class="match"><div class="when">${m.time}<br>Cancha ${m.court}<br><span class="chip">${m.cat}</span></div><div class="teams">${m.a}<br>${m.b}</div><div class="score">${m.score}<small>${m.status}</small></div></div>`).join(''):`<div class="empty">No hay partidos en esta selección.</div>`}function simpleRows(items){return items.map(([t,detail,p])=>`<button class="rowline" onclick="go('${p}')"><span class="grow">${t}<small>${detail}</small></span>${icon('chevron')}</button>`).join('')}function home(){return `<div class="hero"><img src="https://images.unsplash.com/photo-1592656094267-764a45160876?auto=format&fit=crop&w=1300&q=80" alt="Cancha de voleibol"><div class="over"><span>COMPETENCIA · NEWCOM</span><strong>Viví el torneo</strong></div></div>${head('Partidos de hoy')}${tabs(['Todas','+50','+60','+68'],category,'setCat')}${matchRows(filterMatches().slice(0,3))}<div style="text-align:right"><button class="link" onclick="go('partidos')">Ver todos los partidos →</button></div><div class="quick"><button onclick="go('fixture')">${icon('calendar')}Fixture</button><button onclick="go('posiciones')">${icon('trophy')}Posiciones</button><button onclick="go('streaming')">${icon('radio')}En vivo</button></div><div class="section-title"><h2>El torneo en imágenes</h2><button class="link" onclick="go('galeria')">Ver galería →</button></div><div id="nc-photo-home" class="photo-grid"></div><div class="photo-cta"><div><strong>¡Compartí tu momento!</strong><p>Muy pronto vas a poder enviar tus fotografías para que la organización las publique.</p></div><button onclick="go('galeria')">Ver fotos</button></div><div class="section-title"><h2>Novedades</h2><button class="link" onclick="go('avisos')">Ver avisos →</button></div><div class="rowline"><div class="grow">Información del torneo<small>Comunicados y novedades oficiales</small></div>${icon('chevron')}</div>`}function partidos(){return `${head('Partidos','COMPETENCIA')}${tabs(['Ayer','Hoy','Mañana'],day,'setDay')}${catTabs()}<div class="section-title"><h2>${day==='Hoy'?'Partidos de hoy':'Programación · '+day.toLowerCase()}</h2><span class="tiny muted">${day==='Hoy'?filterMatches().length+' partidos':'Demostración'}</span></div>${day==='Hoy'?matchRows(filterMatches()):`<div class="empty">La programación de ${day.toLowerCase()} se mostrará cuando esté disponible.</div>`}`}function equipos(){let found=teams.filter(t=>(category==='Todas'||t.cat===category)&&(`${t.name} ${t.city}`).toLowerCase().includes(search.toLowerCase()));let count=Math.ceil(found.length/6),shown=found.slice(teamPage*6,(teamPage+1)*6);return `${head('Equipos','PARTICIPANTES')}${catTabs()}<label class="search">${icon('search')}<input id="teamSearch" type="search" placeholder="Buscar equipo o localidad" value="${search.replaceAll('"','&quot;')}" oninput="findTeams(this.value)" autocomplete="off"></label><div class="section-title"><h2>Participantes</h2><span class="tiny muted">${found.length} equipos</span></div><div id="teamList">${teamRows(shown,found.length,count)}</div>`}function teamRows(shown,total,count){return `${shown.map((t,i)=>`<div class="rowline"><span class="number">${String(teamPage*6+i+1).padStart(2,'0')}</span><span class="grow">${t.name}<small>${t.city}</small></span><span class="chip">${t.cat}</span></div>`).join('')||'<div class="empty">No se encontraron equipos.</div>'}<div class="pager"><button onclick="changeTeamPage(-1)" ${teamPage===0?'disabled':''}>Anterior</button><span>${total?`Página ${teamPage+1} de ${count}`:'Sin resultados'}</span><button onclick="changeTeamPage(1)" ${teamPage>=count-1?'disabled':''}>Siguiente</button></div>`}function findTeams(v){search=v;teamPage=0;let found=teams.filter(t=>(category==='Todas'||t.cat===category)&&(`${t.name} ${t.city}`).toLowerCase().includes(search.toLowerCase()));$('#teamList').innerHTML=teamRows(found.slice(0,6),found.length,Math.ceil(found.length/6))}function changeTeamPage(d){teamPage+=d;let found=teams.filter(t=>(category==='Todas'||t.cat===category)&&(`${t.name} ${t.city}`).toLowerCase().includes(search.toLowerCase()));$('#teamList').innerHTML=teamRows(found.slice(teamPage*6,(teamPage+1)*6),found.length,Math.ceil(found.length/6))}function torneo(){return `${head('Torneo','COMPETENCIA')}${catTabs()}<div class="section-title"><h2>Competencia</h2></div>${simpleRows([['Zonas','Distribución de equipos por grupo','zonas'],['Posiciones','Tablas y clasificación','posiciones'],['Cruces y finales','Definición del campeonato','cruces'],['Fixture completo','Cronograma por cancha','fixture'],['Resultados','Partidos disputados','resultados'],['Historial','Ediciones anteriores','historial']])}`}function standings(){let arr=teams.filter(t=>category==='Todas'||t.cat===category).slice(0,6);return `<div class="section-title"><h2>Tabla de posiciones</h2><span class="tiny muted">PJ · PTS</span></div>${arr.map((t,i)=>`<div class="statline"><div><span class="muted tiny">${i+1}.</span> &nbsp;${t.name}<small>${t.cat}</small></div><div style="text-align:right">${Math.max(0,5-i)} &nbsp; <span class="chip">${Math.max(0,10-i*2)}</span></div></div>`).join('')}`}function generic(){if(page==='galeria')return `${head('El torneo en imágenes','FOTOGRAFÍAS')}<p class="muted">Fotografías aprobadas por la organización.</p><div id="nc-photo-all" class="photo-grid photo-full"></div>`;let back=`<button class="back" onclick="go('torneo')">${icon('left')} Volver al torneo</button>`;if(page==='fixture'||page==='resultados')return `${back}${head(title[page],'COMPETENCIA')}${catTabs()}${matchRows(filterMatches().filter(m=>page==='fixture'||m.status!=='Próximo'))}`;if(page==='posiciones')return `${back}${head('Posiciones','COMPETENCIA')}${catTabs()}${standings()}`;if(page==='zonas')return `${back}${head('Zonas','COMPETENCIA')}${catTabs()}${['Zona A','Zona B','Zona C'].map((z,j)=>`<div class="section-title"><h2>${z}</h2></div>${teams.filter(t=>category==='Todas'||t.cat===category).slice(j*4,j*4+4).map((t,i)=>`<div class="rowline"><span class="number">${i+1}</span><span class="grow">${t.name}<small>${t.cat}</small></span></div>`).join('')}`).join('')}`;if(page==='cruces')return `${back}${head('Cruces y finales','COMPETENCIA')}${catTabs()}${ncCruces.length?ncCruces.filter(x=>category==='Todas'||ncNormalCat(x.categoria)===category).map(x=>`<div class="statline"><div>${ncFotosEsc(x.instancia)}<small>${ncFotosEsc(x.local)} vs ${ncFotosEsc(x.visitante)}</small></div><span class="chip">${ncFotosEsc(ncNormalCat(x.categoria))}</span></div>`).join(''):'<div class="empty">Todavía no hay cruces publicados.</div>'}`;if(page==='avisos')return `${head('Avisos','NOVEDADES')}${['Comunicados oficiales','Cambios de programación','Información para delegaciones'].map(t=>`<div class="rowline"><span class="grow">${t}<small>Se actualizará desde la organización</small></span>${icon('chevron')}</div>`).join('')}`;if(page==='streaming')return `${head('Transmisiones','EN VIVO')}<div class="empty">Los enlaces a las transmisiones aparecerán aquí cuando sean publicados.</div>`;if(page==='alojamiento')return `${head('Alojamiento','SERVICIOS')}<div class="empty">Opciones y contactos de alojamiento, administrados por la organización.</div>`;if(page==='bufet')return `${head('Bufet','SERVICIOS')}<div class="empty">Menú, precios y horarios disponibles durante el torneo.</div>`;if(page==='sedes')return `${head('Sedes','INFORMACIÓN')}<div class="empty">Direcciones y ubicación de las canchas del torneo.</div>`;if(page==='historial')return `${back}${head('Historial','COMPETENCIA')}<div class="empty">Ediciones anteriores y resultados históricos.</div>`;return `${head('Información general','TORNEO')}<div class="statline"><div>Reglamento<small>Información de competencia</small></div></div><div class="statline"><div>Organización<small>Datos y contactos oficiales</small></div></div>`}function render(){navRender();$('#view').innerHTML=({inicio:home,partidos,equipos,torneo}[page]||generic)()+`<div class="footer">NEWCOM LIVE · Información publicada por la organización</div>`}render();
</script><script>

const NC_FOTOS_API=''; // Pegar aquí la URL /exec del despliegue Apps Script después de actualizar Código.gs.
let ncFotosPublicas=[];
function ncFotosEsc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function ncFotosPintar(){for(const id of ['nc-photo-home','nc-photo-all']){const el=document.getElementById(id);if(!el)continue;const fotos=id==='nc-photo-home'?ncFotosPublicas.slice(0,3):ncFotosPublicas;el.innerHTML=fotos.length?fotos.map(p=>`<figure><img loading="lazy" src="${ncFotosEsc(p.url)}" alt="${ncFotosEsc(p.titulo)}"><figcaption>${ncFotosEsc(p.titulo)}</figcaption></figure>`).join(''):'<p class="photo-message">Todavía no hay fotografías publicadas.</p>';}}
function ncFotosCargar(){ncFotosPintar();if(!NC_FOTOS_API)return;const callback='ncFotosCallback_'+Date.now();const tag=document.createElement('script');const clean=()=>{delete window[callback];tag.remove();};window[callback]=data=>{ncFotosPublicas=Array.isArray(data?.fotos)?data.fotos:[];ncFotosPintar();clean();};tag.onerror=()=>{clean();};tag.src=NC_FOTOS_API+(NC_FOTOS_API.includes('?')?'&':'?')+'api=fotos&callback='+callback;document.head.appendChild(tag);}
const NC_DATOS_API='https://script.google.com/macros/s/AKfycbzuNp6cYlhi6cAn-dqoxMiArsKU5AbvAQkLes1wRRdI5ieb3YP7qd-jewsVuTU2Wx2VTg/exec'; // Pegá aquí la URL /exec del proyecto NEWCOM_LIVE_API_PUBLICA.gs.
function ncNormalCat(v){const s=String(v||'').trim();return s?(s.startsWith('+')?s:'+'+s):'';}
function ncDatosCargar(){
 if(!NC_DATOS_API){ncEstado('Para mostrar datos reales, configurá la URL de la API pública.');return;}
 const cb='ncDatosCallback_'+Date.now(),tag=document.createElement('script');
 const timeout=setTimeout(()=>{clean();ncEstado('No se pudo conectar con la planilla.');},15000);
 function clean(){clearTimeout(timeout);delete window[cb];tag.remove();}
 window[cb]=d=>{clean();if(!d||!d.ok){ncEstado('No se pudieron cargar los datos del torneo.');return;}
 teams=(d.equipos||[]).map(t=>({name:t.nombre,cat:ncNormalCat(t.categoria),city:t.ciudad||t.provincia||''}));
 matches=(d.partidos||[]).map(p=>({a:p.local,b:p.visitante,cat:ncNormalCat(p.categoria),court:p.cancha||'—',time:p.hora||'—',fecha:p.fecha||'',status:p.resultado?'Finalizado':'Programado',score:p.resultado?`${p.resultado.setsLocal} – ${p.resultado.setsVisitante}`:'–',zona:p.zona||'',genero:p.genero||'',resultado:p.resultado||null}));
 ncCruces=d.cruces||[];const catsReal=[...new Set([...teams.map(x=>x.cat),...matches.map(x=>x.cat)].filter(Boolean))].sort((a,b)=>Number(a.slice(1))-Number(b.slice(1)));
 cats.splice(0,cats.length,'Todas',...catsReal);render();};
 tag.onerror=()=>{clean();ncEstado('No se pudo conectar con la planilla.');};
 tag.src=NC_DATOS_API+(NC_DATOS_API.includes('?')?'&':'?')+'api=datos&callback='+cb;document.head.appendChild(tag);
}
function ncEstado(msg){let e=document.getElementById('nc-api-status');if(!e){e=document.createElement('div');e.id='nc-api-status';e.style.cssText='padding:12px;color:#c4ef68;text-align:center;font-size:12px';document.getElementById('view').prepend(e);}e.textContent=msg;}
const ncRenderAnterior=render;render=function(){ncRenderAnterior();ncFotosPintar();};
ncFotosCargar();ncDatosCargar();
</script></body></html>
