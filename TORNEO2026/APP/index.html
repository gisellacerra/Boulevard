'posiciones')">${icon('trophy')}Posiciones</button><button onclick="go('streaming')">${icon('radio')}En vivo</button></div><div class="section-title"><h2>El torneo en imágenes</h2><button class="link" onclick="go('galeria')">Ver galería →</button></div><div id="nc-photo-home" class="photo-grid"></div><div class="photo-cta"><div><strong>¡Compartí tu momento!</strong><p>Muy pronto vas a poder enviar tus fotografías para que la organización las publique.</p></div><button onclick="go('galeria')">Subí tu foto!</button></div><div class="section-title"><h2>Novedades</h2><button class="link" onclick="go('avisos')">Ver avisos →</button></div><div class="rowline"><div class="grow">Información del torneo<small>Comunicados y novedades oficiales</small></div>${icon('chevron')}</div>`}function partidos(){return `${head('Partidos','COMPETENCIA')}${tabs(['Ayer','Hoy','Mañana'],day,'setDay')}${catTabs()}<div class="section-title"><h2>${day==='Hoy'?'Partidos de hoy':'Programación · '+day.toLowerCase()}</h2><span class="tiny muted">${day==='Hoy'?filterMatches().length+' partidos':'Demostración'}</span></div>${day==='Hoy'?matchRows(filterMatches()):`<div class="empty">La programación de ${day.toLowerCase()} se mostrará cuando esté disponible.</div>`}`}function equipos(){let found=teams.filter(t=>(category==='Todas'||t.cat===category)&&(`${t.name} ${t.city}`).toLowerCase().includes(search.toLowerCase()));let count=Math.ceil(found.length/6),shown=found.slice(teamPage*6,(teamPage+1)*6);return `${head('Equipos','PARTICIPANTES')}${catTabs()}<label class="search">${icon('search')}<input id="teamSearch" type="search" placeholder="Buscar equipo o localidad" value="${search.replaceAll('"','&quot;')}" oninput="findTeams(this.value)" autocomplete="off"></label><div class="section-title"><h2>Participantes</h2><span class="tiny muted">${found.length} equipos</span></div><div id="teamList">${teamRows(shown,found.length,count)}</div>`}function teamRows(shown,total,count){return `${shown.map((t,i)=>`<div class="rowline"><span class="number">${String(teamPage*6+i+1).padStart(2,'0')}</span><span class="grow">${t.name}<small>${t.city}</small></span><span class="chip">${t.cat}</span></div>`).join('')||`<div class="empty">${ncEmptyData('No se encontraron equipos.')}</div>`}<div class="pager"><button onclick="changeTeamPage(-1)" ${teamPage===0?'disabled':''}>Anterior</button><span>${total?`Página ${teamPage+1} de ${count}`:'Sin resultados'}</span><button onclick="changeTeamPage(1)" ${teamPage>=count-1?'disabled':''}>Siguiente</button></div>`}function findTeams(v){search=v;teamPage=0;let found=teams.filter(t=>(category==='Todas'||t.cat===category)&&(`${t.name} ${t.city}`).toLowerCase().includes(search.toLowerCase()));$('#teamList').innerHTML=teamRows(found.slice(0,6),found.length,Math.ceil(found.length/6))}function changeTeamPage(d){teamPage+=d;let found=teams.filter(t=>(category==='Todas'||t.cat===category)&&(`${t.name} ${t.city}`).toLowerCase().includes(search.toLowerCase()));$('#teamList').innerHTML=teamRows(found.slice(teamPage*6,(teamPage+1)*6),found.length,Math.ceil(found.length/6))}function torneo(){return `${head('Torneo','COMPETENCIA')}${catTabs()}<div class="section-title"><h2>Competencia</h2></div>${simpleRows([['Zonas','Distribución de equipos por grupo','zonas'],['Posiciones','Tablas y clasificación','posiciones'],['Cruces y finales','Definición del campeonato','cruces'],['Fixture completo','Cronograma por cancha','fixture'],['Resultados','Partidos disputados','resultados'],['Historial','Ediciones anteriores','historial']])}`}function standings(){let arr=teams.filter(t=>category==='Todas'||t.cat===category).slice(0,6);return `<div class="section-title"><h2>Tabla de posiciones</h2><span class="tiny muted">PJ · PTS</span></div>${arr.map((t,i)=>`<div class="statline"><div><span class="muted tiny">${i+1}.</span> &nbsp;${t.name}<small>${t.cat}</small></div><div style="text-align:right">${Math.max(0,5-i)} &nbsp; <span class="chip">${Math.max(0,10-i*2)}</span></div></div>`).join('')}`}function generic(){if(page==='galeria')return `${head('Somos Newcom','FOTOGRAFÍAS')}<p class="muted">Fotografías aprobadas por la organización.</p><div id="nc-photo-all" class="photo-grid photo-full"></div>`;let back=`<button class="back" onclick="go('torneo')">${icon('left')} Volver al torneo</button>`;if(page==='fixture'||page==='resultados')return `${back}${head(title[page],'COMPETENCIA')}${catTabs()}${matchRows(filterMatches().filter(m=>page==='fixture'||m.status!=='Próximo'))}`;if(page==='posiciones')return `${back}${head('Posiciones','COMPETENCIA')}${catTabs()}${standings()}`;if(page==='zonas')return `${back}${head('Zonas','COMPETENCIA')}${catTabs()}${['Zona A','Zona B','Zona C'].map((z,j)=>`<div class="section-title"><h2>${z}</h2></div>${teams.filter(t=>category==='Todas'||t.cat===category).slice(j*4,j*4+4).map((t,i)=>`<div class="rowline"><span class="number">${i+1}</span><span class="grow">${t.name}<small>${t.cat}</small></span></div>`).join('')}`).join('')}`;if(page==='cruces')return `${back}${head('Cruces y finales','COMPETENCIA')}${catTabs()}${ncCruces.length?ncCruces.filter(x=>category==='Todas'||ncNormalCat(x.categoria)===category).map(x=>`<div class="statline"><div>${ncFotosEsc(x.instancia)}<small>${ncFotosEsc(x.local)} vs ${ncFotosEsc(x.visitante)}</small></div><span class="chip">${ncFotosEsc(ncNormalCat(x.categoria))}</span></div>`).join(''):'<div class="empty">Todavía no hay cruces publicados.</div>'}`;if(page==='avisos')return `${`<div class="nc-notifications-nav"><button type="button" class="nc-back-notifications" onclick="ncVolverAvisos()" aria-label="Volver a la pantalla anterior" title="Volver"><svg viewBox="0 0 24 24" width="25" height="25" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg></button><h1>Notificaciones</h1><button type="button" class="nc-close-notifications" onclick="go('inicio')" aria-label="Cerrar notificaciones" title="Cerrar">×</button></div>`}${ncNotificaciones.length?ncNotificaciones.map((n,indice)=>{const id=ncAvisoId(n),unread=!ncAvisoLeido(id),destacado=indice===0&&unread;return `<div class="rowline nc-notice ${destacado?'nc-unread':''}" onclick="ncMarcarAviso('${id}')" role="button" tabindex="0" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();ncMarcarAviso('${id}')}" ><span class="grow"><strong>${ncFotosEsc(n.titulo)}</strong>${destacado?'<span class="nc-notice-status">NUEVO</span>':''}<small>${ncFotosEsc(n.mensaje)}</small><small class="nc-notice-date">${ncFotosEsc(n.fecha)}</small>${n.enlace&&/^https?:\/\//i.test(n.enlace)?`<a class="nc-aviso-boton" href="${ncFotosEsc(n.enlace)}" target="_blank" rel="noopener noreferrer" onclick="event.stopPropagation();ncMarcarAvisoSinRender('${id}')">Abrir enlace</a>`:''}</span></div>`}).join(''):`<div class="empty">${ncEmptyData('Todavía no hay notificaciones publicadas.')}</div>`}`;if(page==='streaming')return `${head('Transmisiones','EN VIVO')}<div class="empty">Los enlaces a las transmisiones aparecerán aquí cuando sean publicados.</div>`;if(page==='alojamiento')return `${head('Alojamiento','SERVICIOS')}<div class="empty">Opciones y contactos de alojamiento, administrados por la organización.</div>`;if(page==='bufet')return `${head('Bufet','SERVICIOS')}<div class="empty">Menú, precios y horarios disponibles durante el torneo.</div>`;if(page==='sedes')return `${head('Sedes','INFORMACIÓN')}<div class="empty">Direcciones y ubicación de las canchas del torneo.</div>`;if(page==='historial')return `${back}${head('Historial','COMPETENCIA')}<div class="empty">Ediciones anteriores y resultados históricos.</div>`;return `${head('Información general','TORNEO')}<div class="statline"><div>Reglamento<small>Información de competencia</small></div></div><div class="statline"><div>Organización<small>Datos y contactos oficiales</small></div></div>`}function render(){navRender();$('#view').innerHTML=({inicio:home,partidos,equi function ncDatosCargar(silencioso=false){

 const close=document.createElement('button');close.className='nc-lightbox-close';close.type='button';close.setAttribute('aria-label','Cerrar fotografía');close.textContent='×';close.onclick=ncCerrarFoto;
 overlay.onclick=e=>{if(e.target===overlay)ncCerrarFoto()};overlay.append(img,close);if(p.titulo){const caption=document.createElement('div');caption.className='nc-lightbox-title';caption.textContent=p.titulo;overlay.append(caption);}document.body.append(overlay);
 document.body.dataset.ncPhotoOpen='1';document.body.style.overflow='hidden';close.focus();
}

<script id="nc-category-palette-script">
(function(){
const palette={'+40':'#d64da7','+50':'#48c438','+60':'#348bef','+68':'#ff6555','+70':'#e5f13c','+75':'#f7a139'};
let scheduled=false;
function paint(){scheduled=false;
  document.querySelectorAll('#view button,#view span,#view strong,#view small,#view label,#view div').forEach(el=>{
    if(el.children.length)return;
    const category=(el.getAttribute('data-nc-cat')||el.textContent||'').trim();
    if(!Object.prototype.hasOwnProperty.call(palette,category))return;
    const color=palette[category];
    const cs=getComputedStyle(el);
    const isFilter=el.tagName==='BUTTON';
    const isBadge=el.matches('.chip,.badge,[class*="cat"],[class*="pill"],[class*="tag"]') || (cs.borderRadius!=='0px' && cs.backgroundColor!=='rgba(0, 0, 0, 0)' && cs.backgroundColor!=='transparent');
    if(!isFilter&&!isBadge)return;
    if(el.style.getPropertyValue('background-color')!==color)el.style.setProperty('background-color',color,'important');
    if(el.style.getPropertyValue('color')!=='#101410')el.style.setProperty('color','#101410','important');
    if(isFilter && el.style.getPropertyValue('border-color')!=='transparent')el.style.setProperty('border-color','transparent','important');
  });
}
function queue(){if(!scheduled){scheduled=true;requestAnimationFrame(paint)}}
function start(){const root=document.getElementById('view');if(!root)return;new MutationObserver(queue).observe(root,{childList:true,subtree:true,characterData:true});queue()}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',start);else start();
})();
</script>

<script id="nc-resultados-modal-script">
(function(){
 const oldMatchRows=matchRows;
 function resultSets(r){
   if(!r)return [];
   const keys=['puntosPorSet','detalleSets','parciales','resultadosSets','sets','detalle','puntos','marcadores'];
   const parsePair=(v,i)=>{
     if(Array.isArray(v))return {label:'Set '+(i+1),a:v[0],b:v[1]};
     if(typeof v==='string'){const m=v.match(/(\d+)\s*[-–:]\s*(\d+)/);return m?{label:'Set '+(i+1),a:m[1],b:m[2]}:null;}
     if(v&&typeof v==='object')return {label:'Set '+(i+1),a:v.local??v.puntosLocal??v.puntosA??v.a??v.equipoLocal??v.localPuntos??v.p1,b:v.visitante??v.puntosVisitante??v.puntosB??v.b??v.equipoVisitante??v.visitantePuntos??v.p2};
     return null;
   };
   for(const key of keys){let raw=r[key];
     if(typeof raw==='string'){
       try{raw=JSON.parse(raw)}catch(e){raw=(raw.match(/\d+\s*[-–:]\s*\d+/g)||[])}
     }
     if(raw&&typeof raw==='object'&&!Array.isArray(raw))raw=Object.values(raw);
     if(Array.isArray(raw)){
       const parsed=raw.map(parsePair).filter(x=>x&&x.a!=null&&x.b!=null&&Number.isFinite(Number(x.a))&&Number.isFinite(Number(x.b)));
       if(parsed.length)return parsed;
     }
   }
   const parsed=[];
   for(let i=1;i<=3;i++){
     const obj=r['set'+i]??r['set_'+i]??r['set'+i+'Puntos']??r['parcial'+i];
     let item=parsePair(obj,i-1);
     if(!item||item.a==null||item.b==null)item={label:'Set '+i,a:r['set'+i+'Local']??r['puntosLocal'+i]??r['set'+i+'A']??r['localSet'+i],b:r['set'+i+'Visitante']??r['puntosVisitante'+i]??r['set'+i+'B']??r['visitanteSet'+i]};
     if(item.a!=null&&item.b!=null)parsed.push(item);
   }
   // La API publica el tercer set bajo la clave "tiebreak", no "set3".
   // Mostrarlo únicamente si existe un tercer set jugado.
   const tb=r.tiebreak??r.tieBreak??r.tie_break??r.desempate;
   let third=parsePair(tb,2);
   if((!third||third.a==null||third.b==null)&&r.tiebreak_local!=null&&r.tiebreak_visitante!=null){
     third={label:'Set 3 · Tie-break',a:r.tiebreak_local,b:r.tiebreak_visitante};
   }
   if(third&&third.a!=null&&third.b!=null&&Number.isFinite(Number(third.a))&&Number.isFinite(Number(third.b))&&
      (Number(third.a)>0||Number(third.b)>0)&&!parsed.some(x=>x.label==='Set 3')){
     third.label='Set 3 · Tie-break';parsed.push(third);
   }
   return parsed;
 }
 function winner(m){if(!completed(m))return 0;const a=Number(m.resultado.setsLocal),b=Number(m.resultado.setsVisitante);return Number.isFinite(a)&&Number.isFinite(b)?Math.sign(a-b):0;}
 function ncCategoryColor(cat){const c=String(cat||'').match(/\+?(40|50|60|68|70|75)/);return c?({40:'#d64da7',50:'#48c438',60:'#348bef',68:'#ff6555',70:'#e5f13c',75:'#f7a139'}[c[1]]):'#a5eb37';}
 function ncLogo(url){const u=String(url||'');return /^(https?:\/\/|data:image\/(?:png|jpeg|jpg|webp|gif);base64,)/i.test(u)?`<img class="nc-team-crest" src="${safe(u)}" alt="" loading="lazy" onerror="this.style.visibility='hidden'">`:'<span class="nc-team-crest nc-crest-slot" aria-hidden="true"></span>';}
 matchRows=function(arr){return arr.length?arr.map(m=>{const done=completed(m),win=winner(m),idx=matches.indexOf(m);return `<article class="sports-card nc-category-card ${done?'nc-finished':''}" style="--nc-category-color:${ncCategoryColor(m.cat)}" ${done?`role="button" tabindex="0" aria-label="Ver resultado de ${safe(m.a)} y ${safe(m.b)}" onclick="ncAbrirResultado(${idx})" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();ncAbrirResultado(${idx})}"`:''}><div class="when ${done?'final':''}">${safe(m.time)}</div><div><div class="versus"><span class="nc-team-label ${win>0?'nc-winner':''}"><span>${safe(m.a)}</span>${ncLogo(m.escudoLocal)}</span><span class="${done?'final-score':'vs'}">${done?safe(m.score):'vs'}</span><span class="nc-team-label nc-team-away ${win<0?'nc-winner':''}">${ncLogo(m.escudoVisitante)}<span>${safe(m.b)}</span></span></div><div class="meta">${safe(courtLabel(m.court))} · ${safe(m.genero||'')} ${safe(m.cat)}${m.zona?' · Zona '+safe(m.zona):''}${done?' · Ver resultado':''}</div></div></article>`;}).join(''):`<div class="empty">${ncEmptyData('No hay partidos en esta selección.')}</div>`;};
 window.ncAbrirResultado=function(idx){const m=matches[idx];if(!m||!completed(m))return;ncCerrarResultado();const win=winner(m),sets=resultSets(m.resultado),safeUrl=u=>/^(https?:\/\/|data:image\/(?:png|jpeg|jpg|webp|gif);base64,)/i.test(String(u||''))?safe(u):'';
 const logoA=safeUrl(m.escudoLocal),logoB=safeUrl(m.escudoVisitante);
 const el=document.createElement('div');el.className='nc-result-modal';el.id='nc-result-modal';el.setAttribute('role','presentation');el.innerHTML=`<section class="nc-result-dialog" style="--nc-category-color:${ncCategoryColor(m.cat)}" role="dialog" aria-modal="true" aria-label="Resultado del partido"><div class="nc-result-top"><span>${safe(m.genero||'')} ${safe(m.cat)} ${m.zona?'· Zona '+safe(m.zona):''}</span><button class="nc-result-close" aria-label="Cerrar resultado" onclick="ncCerrarResultado()">×</button></div><div class="nc-result-teams"><div class="nc-result-team ${win>0?'nc-winner':''}">${logoA?`<img src="${logoA}" alt="">`:''}<strong>${safe(m.a)}</strong><b>${safe(m.resultado.setsLocal)}</b>${win>0?'<div class="nc-result-winner-tag">GANADOR</div>':''}</div><div class="nc-result-vs">–</div><div class="nc-result-team ${win<0?'nc-winner':''}">${logoB?`<img src="${logoB}" alt="">`:''}<strong>${safe(m.b)}</strong><b>${safe(m.resultado.setsVisitante)}</b>${win<0?'<div class="nc-result-winner-tag">GANADOR</div>':''}</div></div><div class="nc-result-divider" aria-hidden="true"></div><div class="nc-result-detail-title">Puntos por set</div>${sets.length?sets.map(x=>`<div class="nc-result-set"><strong>${safe(x.a)}</strong><span>${safe(x.label)}</span><strong>${safe(x.b)}</strong></div>`).join(''):'<div class="nc-result-no-points">El detalle de puntos no está disponible en los datos publicados.</div>'}<div class="nc-result-foot">${safe(courtLabel(m.court))} · Resultado confirmado</div></section>`;
 el.addEventListener('click',e=>{if(e.target===el)ncCerrarResultado()});document.body.appendChild(el);document.body.style.overflow='hidden';el.querySelector('button').focus();};
 window.ncCerrarResultado=function(){document.getElementById('nc-result-modal')?.remove();document.body.style.overflow='';};
 document.addEventListener('keydown',e=>{if(e.key==='Escape'&&document.getElementById('nc-result-modal'))ncCerrarResultado()});
 // Reconsulta la API pública para reflejar los resultados confirmados por la organización.
 setInterval(()=>{if(!document.hidden&&typeof ncDatosCargar==='function')ncDatosCargar(true);},60000);
})();
</script>
