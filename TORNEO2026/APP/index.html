class="rowline"><span class="number">${String(teamPage*6+i+1).padStart(2,'0')}</span><span class="grow">${t.name}<small>${t.city}</small></span><span class="chip">${t.cat}</span></div>`).join('')||`<div class="empty">${ncEmptyData('No se encontraron equipos.')}</div>`}<div class="pager"><button onclick="changeTeamPage(-1)" ${teamPage===0?'disabled':''}>Anterior</button><span>${total?`Página ${teamPage+1} de ${count}`:'Sin resultados'}</span><button onclick="changeTeamPage(1)" ${teamPage>=count-1?'disabled':''}>Siguiente</button></div>`}function findTeams(v){search=v;teamPage=0;let found=teams.filter(t=>(category==='Todas'||t.cat===category)&&(`${t.name} ${t.city}`).toLowerCase().includes(search.toLowerCase()));$('#teamList').innerHTML=teamRows(found.slice(0,6),found.length,Math.ceil(found.length/6))}function changeTeamPage(d){teamPage+=d;let found=teams.filter(t=>(category==='Todas'||t.cat===category)&&(`${t.name} ${t.city}`).toLowerCase().includes(search.toLowerCase()));$('#teamList').innerHTML=teamRows(found.slice(teamPage*6,(teamPage+1)*6),found.length,Math.ceil(found.length/6))}function torneo(){return `${head('Torneo','COMPETENCIA')}${catTabs()}<div class="section-title"><h2>Competencia</h2></div>${simpleRows([['Zonas','Distribución de equipos por grupo','zonas'],['Posiciones','Tablas y clasificación','posiciones'],['Cruces y finales','Definición del campeonato','cruces'],['Fixture completo','Cronograma por cancha','fixture'],['Resultados','Partidos disputados','resultados'],['Historial','Ediciones anteriores','historial']])}`}function standings(){let arr=teams.filter(t=>category==='Todas'||t.cat===category).slice(0,6);return `<div class="section-title"><h2>Tabla de posiciones</h2><span class="tiny muted">PJ · PTS</span></div>${arr.map((t,i)=>`<div class="statline"><div><span class="muted tiny">${i+1}.</span> &nbsp;${t.name}<small>${t.cat}</small></div><div style="text-align:right">${Math.max(0,5-i)} &nbsp; <span class="chip">${Math.max(0,10-i*2)}</span></div></div>`).join('')}`}function generic(){if(page==='galeria')return `${head('Somos Newcom','FOTOGRAFÍAS')}<p class="muted">Fotografías aprobadas por la organización.</p><div id="nc-photo-all" class="photo-grid photo-full"></div>`;let back=`<button class="back" onclick="go('torneo')">${icon('left')} Volver al torneo</button>`;if(page==='fixture'||page==='resultados')return `${back}${head(title[page],'COMPETENCIA')}${catTabs()}${matchRows(filterMatches().filter(m=>page==='fixture'||m.status!=='Próximo'))}`;if(page==='posiciones')return `${back}${head('Posiciones','COMPETENCIA')}${catTabs()}${standings()}`;if(page==='zonas')return `${back}${head('Zonas','COMPETENCIA')}${catTabs()}${['Zona A','Zona B','Zona C'].map((z,j)=>`<div class="section-title"><h2>${z}</h2></div>${teams.filter(t=>category==='Todas'||t.cat===category).slice(j*4,j*4+4).map((t,i)=>`<div class="rowline"><span class="number">${i+1}</span><span class="grow">${t.name}<small>${t.cat}</small></span></div>`).join('')}`).join('')}`;if(page==='cruces')return `${back}${head('Cruces y finales','COMPETENCIA')}${catTabs()}${ncCruces.length?ncCruces.filter(x=>category==='Todas'||ncNormalCat(x.categoria)===category).map(x=>`<div class="statline"><div>${ncFotosEsc(x.instancia)}<small>${ncFotosEsc(x.local)} vs ${ncFotosEsc(x.visitante)}</small></div><span class="chip">${ncFotosEsc(ncNormalCat(x.categoria))}</span></div>`).join(''):'<div class="empty">Todavía no hay cruces publicados.</div>'}`;if(page==='avisos')return `${`<div class="nc-notifications-nav"><button type="button" class="nc-back-notifications" onclick="ncVolverAvisos()" aria-label="Volver a la pantalla anterior" title="Volver"><svg viewBox="0 0 24 24" width="25" height="25" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg></button><h1>Notificaciones</h1><button type="button" class="nc-close-notifications" onclick="go('inicio')" aria-label="Cerrar notificaciones" title="Cerrar">&times;</button></div>`}${ncNotificaciones.length?ncNotificaciones.map((n,indice)=>{const id=ncAvisoId(n),unread=!ncAvisoLeido(id),destacado=indice===0&&unread;return `<div class="rowline nc-notice ${destacado?'nc-unread':''}" onclick="ncMarcarAviso('${id}')" role="button" tabindex="0" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();ncMarcarAviso('${id}')}" ><span class="grow"><strong>${ncFotosEsc(n.titulo)}</strong>${destacado?'<span class="nc-notice-status">NUEVO</span>':''}<small>${ncFotosEsc(n.mensaje)}</small><small class="nc-notice-date">${ncFotosEsc(n.fecha)}</small>${n.enlace&&/^https?:\/\//i.test(n.enlace)?`<a class="nc-aviso-boton" href="${ncFotosEsc(n.enlace)}" target="_blank" rel="noopener noreferrer" onclick="event.stopPropagation();ncMarcarAvisoSinRender('${id}')">Abrir enlace</a>`:''}</span></div>`}).join(''):`<div class="empty">${ncEmptyData('Todavía no hay notificaciones publicadas.')}</div>`}`;if(page==='streaming')return `${head('Transmisiones','EN VIVO')}<div class="empty">Los enlaces a las transmisiones aparecerán aquí cuando sean publicados.</div>`;if(page==='alojamiento')return `${head('Alojamiento','SERVICIOS')}<div class="empty">Opciones y contactos de alojamiento, administrados por la organización.</div>`;if(page==='bufet')return `${head('Bufet','SERVICIOS')}<div class="empty">Menú, precios y horarios disponibles durante el torneo.</div>`;if(page==='sedes')return `${head('Sedes','INFORMACIÓN')}<div class="empty">Direcciones y ubicación de las canchas del torneo.</div>`;if(page==='historial')return `${back}${head('Historial','COMPETENCIA')}<div class="empty">Ediciones anteriores y resultados históricos.</div>`;return `${head('Información general','TORNEO')}<div class="statline"><div>Reglamento<small>Información de competencia</small></div></div><div class="statline"><div>Organización<small>Datos y contactos oficiales</small></div></div>`}function render(){navRender();$('#view').innerHTML=({inicio:home,partidos,equipos,torneo}[page]||generic)();if(typeof ncActualizarCampana==='function')ncActualizarCampana()}

let ncDataPhase='loading',ncDataMessage='';

 ncCruces=d.cruces||[];ncNotificaciones=Array.isArray(d.notificaciones)?[...d.notificaciones].reverse():[];const catsReal=[...new Set([...teams.map(x=>x.cat),...matches.map(x=>x.cat)].filter(Boolean))].sort((a,b)=>Number(a.slice(1))-Number(b.slice(1)));
 cats.splice(0,cats.length,'Todas',...catsReal);if(!cats.includes(category))category='Todas';ncDataPhase='ready';ncDataMessage='';render();};

}

const ncRenderAnterior=render;render=function(){ncRenderAnterior();ncFotosPintar();};
// Diseño público Somos Newcom. Solo lectura de los datos de la organización.
let photoIndex=0,selectedDate='',photoLoadState='loading';
const safe=ncFotosEsc;
function normalizedDate(v){const s=String(v||'').trim();if(/^\d{4}-\d{2}-\d{2}/.test(s))return s.slice(0,10);const m=s.match(/^(\d{1,2})[/-](\d{1,2})[/-](\d{4})$/);return m?`${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`:'';}

function daySelector(){const dates=tournamentDates();if(!dates.length)return `<div class="notice">${ncEmptyData('Las fechas aparecerán cuando se publique el fixture.')}</div>`;if(!dates.includes(selectedDate)){const today=new Date().toLocaleDateString('en-CA',{timeZone:'America/Argentina/Buenos_Aires'});selectedDate=dates.includes(today)?today:dates.find(d=>d>=today)||dates[dates.length-1];}return `<div class="days" aria-label="Jornada">${dates.map(d=>{const label=new Date(d+'T12:00:00').toLocaleDateString('es-AR',{weekday:'short',day:'numeric'}).replace('.','');return `<button class="${d===selectedDate?'active':''}" aria-pressed="${d===selectedDate}" onclick="chooseDate('${d}')">${safe(label)}</button>`}).join('')}</div>`;}
function chooseDate(d){selectedDate=d;render();}
filterMatches=function(){return matches.filter(m=>(category==='Todas'||m.cat===category)&&(!selectedDate||normalizedDate(m.fecha)===selectedDate));};
function completed(m){return m.status==='Finalizado'&&m.resultado!=null;}
function courtLabel(v){return /^cancha\b/i.test(String(v))?String(v):'Cancha '+v;}
matchRows=function(arr){return arr.length?arr.map(m=>{const done=completed(m);return `<article class="sports-card"><div class="when ${done?'final':''}">${safe(m.time)}</div><div><div class="versus"><span>${safe(m.a)}</span><span class="${done?'final-score':'vs'}">${done?safe(m.score):'vs'}</span><span>${safe(m.b)}</span></div><div class="meta">${safe(courtLabel(m.court))} · ${safe(m.genero||'')} ${safe(m.cat)}${m.zona?' · Zona '+safe(m.zona):''}</div></div></article>`;}).join(''):`<div class="empty">${ncEmptyData('No hay partidos en esta selección.')}</div>`;};
function carouselPhotos(){return ncFotosPublicas.map(p=>({url:p.url||p.imagen||p.foto||'',titulo:p.titulo||p.nombre||'',detalle:p.ciudad||p.localidad||''})).filter(p=>/^(https?:\/\/|data:image\/(jpeg|png|webp);base64,)/i.test(p.url));}
function ncCarouselPaint(){const target=document.getElementById('somos-carousel');if(!target)return;const photos=carouselPhotos();if(!photos.length){target.innerHTML=`<div class="carousel-photo"><div class="gallery-empty">${icon('users')}<strong>Somos Newcom</strong><p>${photoLoadState==='loading'?'Cargando fotografías…':'Las fotografías aparecerán cuando estén disponibles desde el asistente.'}</p></div></div>`;return;}photoIndex=((photoIndex%photos.length)+photos.length)%photos.length;const p=photos[photoIndex];target.innerHTML=`<div class="carousel-photo" id="carousel-touch"><img src="${safe(p.url)}" alt="${safe(p.titulo||'Fotografía del torneo')}" decoding="async">${photos.length>1?`<button class="prev" aria-label="Fotografía anterior" onclick="photoMove(-1)">${icon('left')}</button><button class="next" aria-label="Fotografía siguiente" onclick="photoMove(1)">${icon('chevron')}</button>`:''}</div><div class="carousel-caption"><div class="dots">${photos.map((_,i)=>`<button class="${i===photoIndex?'active':''}" aria-label="Ver fotografía ${i+1}" aria-pressed="${i===photoIndex}" onclick="photoGo(${i})"></button>`).join('')}</div><strong>${safe(p.titulo)}</strong>${p.detalle?`<p>${safe(p.detalle)}</p>`:''}</div>`;let start;const touch=$('#carousel-touch');touch.addEventListener('touchstart',e=>{start=e.changedTouches[0].clientX},{passive:true});touch.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-start;if(Math.abs(dx)>45)photoMove(dx<0?1:-1)},{passive:true});}

const originalGeneric=generic;generic=function(){if(page==='mas')return `${head('Más','TORNEO')}<div class="more-menu">${simpleRows([['Equipos','Participantes del torneo','equipos'],['Fotos','Compartidas por participantes','galeria'],['Torneo','Zonas y cruces','torneo'],...others.map(([id,name])=>[name,'',id])])}</div>`;if(page==='resultados')return `${head('Resultados','PARTIDOS FINALIZADOS')}${daySelector()}${catTabs()}${matchRows(filterMatches().filter(completed))}`;if(page==='fixture')return partidos();return originalGeneric();};

standings=function(){const groups=new Map();for(const m of matches.filter(completed)){if(category!=='Todas'&&m.cat!==category)continue;const key=m.cat+' · '+(m.zona?'Zona '+m.zona:'General');if(!groups.has(key))groups.set(key,new Map());const group=groups.get(key);for(const name of [m.a,m.b])if(!group.has(name))group.set(name,{name,pj:0,pts:0});const a=Number(m.resultado.setsLocal),b=Number(m.resultado.setsVisitante);if(!Number.isFinite(a)||!Number.isFinite(b)||a===b)continue;const local=group.get(m.a),away=group.get(m.b);local.pj++;away.pj++;local.pts+=a>b?(b===0?3:2):(a===0?0:1);away.pts+=b>a?(a===0?3:2):(b===0?0:1);}

const PHOTO_ENDPOINT=NC_FOTOS_API;

const uploadId=()=>crypto.randomUUID?crypto.randomUUID().replaceAll('-',''):Array.from(crypto.getRandomValues(new Uint8Array(20)),v=>v.toString(16).padStart(2,'0')).join('');

async function optimizePhoto(file){
 if(file.size>3*1024*1024)throw Error('La foto supera los 3 MB. Elegí una más liviana.');
 if(!file.size||!/^image\/(jpeg|png|webp)$/i.test(file.type))throw Error('Elegí una foto JPG, PNG o WebP.');
 const bitmap=await createImageBitmap(file,{imageOrientation:'from-image'});
 try{let scale=Math.min(1,1600/Math.max(bitmap.width,bitmap.height));const canvas=document.createElement('canvas');
 for(let attempt=0;attempt<5;attempt++){
  canvas.width=Math.max(1,Math.round(bitmap.width*scale));canvas.height=Math.max(1,Math.round(bitmap.height*scale));const ctx=canvas.getContext('2d');ctx.fillStyle='#ffffff';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.drawImage(bitmap,0,0,canvas.width,canvas.height);
  for(const quality of [.84,.72,.60,.48]){const blob=await new Promise(resolve=>canvas.toBlob(resolve,'image/jpeg',quality));if(blob&&blob.size<=300*1024){const image=await new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.onerror=reject;reader.readAsDataURL(blob);});return {image,width:canvas.width,height:canvas.height,originalSize:file.size};}}
  scale*=.75;
 }
 throw Error('No se pudo reducir la foto. Probá con otra.');
 }finally{bitmap.close();}
}
// Confirmación por consulta al servidor, independiente de iframes y cookies de terceros.
function photoServerStatus(payload){return new Promise((resolve,reject)=>{
 const cb='ncReceipt_'+uploadId(),tag=document.createElement('script');let timer;
 function cleanup(){clearTimeout(timer);tag.remove();delete window[cb];}
 window[cb]=data=>{cleanup();resolve(data);};
 tag.onerror=()=>{cleanup();reject(Error('No se pudo consultar NEWCOM FOTOS. Revisá el acceso público de la implementación.'));};
 timer=setTimeout(()=>{cleanup();reject(Error('NEWCOM FOTOS no respondió. Revisá la implementación de Apps Script.'));},20000);
 const params=new URLSearchParams({api:'estado',client:payload.client,request:payload.request,callback:cb,t:String(Date.now())});
 tag.src=PHOTO_ENDPOINT+(PHOTO_ENDPOINT.includes('?')?'&':'?')+params;document.head.appendChild(tag);
 });}
async function submitPhotoForm(payload){
 const before=await photoServerStatus(payload);
 if(!before||!before.state)throw Error('Actualizá Fotos.gs y publicá una nueva versión de NEWCOM FOTOS.');
 if(before.state==='saved')return before;
 if(!before.ok&&before.state!=='error')return before;
 photoStatus('Enviando foto…');
 // La respuesta POST es opaca entre dominios. El éxito se confirma únicamente con el recibo.
 fetch(PHOTO_ENDPOINT,{method:'POST',mode:'no-cors',credentials:'omit',redirect:'follow',body:new URLSearchParams({payload:JSON.stringify(payload)})}).catch(()=>{});
 const deadline=Date.now()+90000;
 while(Date.now()<deadline){
  await new Promise(resolve=>setTimeout(resolve,2500));
  try{const result=await photoServerStatus(payload);if(result.state==='saved'||result.state==='error')return result;if(!result.ok)return result;}
  catch(error){if(Date.now()>=deadline)throw error;}
  photoStatus('Esperando confirmación de publicación…');
 }
 throw Error('No recibimos confirmación. Reintentá con la misma foto seleccionada para evitar duplicados.');
}

async function sendPhoto(event){event.preventDefault();if(photoBusy)return;const input=document.getElementById('photo-file'),file=input.files[0];if(!file){photoStatus('Elegí una foto.');return;}if(!PHOTO_ENDPOINT){photoStatus('La carga de fotos todavía no está habilitada.');return;}if(photoUsed()>=5){photoStatus('Ya subiste las 5 fotos permitidas por hoy.');return;}photoBusy=true;const button=document.getElementById('photo-send');button.disabled=true;

 const track=document.getElementById('photo-track');if(!track)return;track.scrollLeft=photoIndex*track.clientWidth;
 let settle;track.addEventListener('scroll',()=>{const raw=Math.round(track.scrollLeft/Math.max(1,track.clientWidth));photoIndex=raw%photos.length;photoCountUpdate(photoIndex);clearTimeout(settle);settle=setTimeout(()=>{if(raw===photos.length){track.scrollTo({left:0,behavior:'instant'});photoIndex=0;}},180);},{passive:true});

<script id="nc-category-palette-script">
(function(){
const palette={'+40':'#d64da7','+50':'#48c438','+60':'#348bef','+68':'#ff6555','+70':'#e5f13c','+75':'#f7a139'};
let scheduled=false;
function paint(){scheduled=false;
  document.querySelectorAll('#view button,#view span,#view strong,#view small,#view label,#view div').forEach(el=>{
    if(el.children.length)return;
    const category=(el.getAttribute('data-nc-cat')||el.textContent||'').trim();
    if(!Object.prototype.hasOwnProperty.call(palette,category))return;
    const color=palette[category];
    const cs=getComputedStyle(el);
    const isFilter=el.tagName==='BUTTON';
    const isBadge=el.matches('.chip,.badge,[class*="cat"],[class*="pill"],[class*="tag"]') || (cs.borderRadius!=='0px' && cs.backgroundColor!=='rgba(0, 0, 0, 0)' && cs.backgroundColor!=='transparent');
    if(!isFilter&&!isBadge)return;
    if(el.style.getPropertyValue('background-color')!==color)el.style.setProperty('background-color',color,'important');
    if(el.style.getPropertyValue('color')!=='#101410')el.style.setProperty('color','#101410','important');
    if(isFilter && el.style.getPropertyValue('border-color')!=='transparent')el.style.setProperty('border-color','transparent','important');
  });
}
function queue(){if(!scheduled){scheduled=true;requestAnimationFrame(paint)}}
function start(){const root=document.getElementById('view');if(!root)return;new MutationObserver(queue).observe(root,{childList:true,subtree:true,characterData:true});queue()}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',start);else start();
})();
</script>

<script id="nc-resultados-modal-script">
(function(){

   }}
   return raw.map((v,i)=>{if(Array.isArray(v))return {label:'Set '+(i+1),a:v[0],b:v[1]};if(typeof v==='string'){const m=v.match(/(\d+)\s*[-–:]\s*(\d+)/);return m?{label:'Set '+(i+1),a:m[1],b:m[2]}:null;}return {label:'Set '+(i+1),a:v.local??v.puntosLocal??v.a??v.equipoLocal,b:v.visitante??v.puntosVisitante??v.b??v.equipoVisitante};}).filter(x=>x&&x.a!=null&&x.b!=null);

 function ncCategoryColor(cat){const c=String(cat||'').match(/\+?(40|50|60|68|70|75)/);return c?({40:'#d64da7',50:'#48c438',60:'#348bef',68:'#ff6555',70:'#e5f13c',75:'#f7a139'}[c[1]]):'#a5eb37';}
 function ncLogo(url){const u=String(url||'');return /^(https?:\/\/|data:image\/(?:png|jpeg|jpg|webp|gif);base64,)/i.test(u)?`<img class="nc-team-crest" src="${safe(u)}" alt="" loading="lazy" onerror="this.style.display='none'">`:'';}
 matchRows=function(arr){return arr.length?arr.map(m=>{const done=completed(m),win=winner(m),idx=matches.indexOf(m);return `<article class="sports-card nc-category-card ${done?'nc-finished':''}" style="--nc-category-color:${ncCategoryColor(m.cat)}" ${done?`role="button" tabindex="0" aria-label="Ver resultado de ${safe(m.a)} y ${safe(m.b)}" onclick="ncAbrirResultado(${idx})" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();ncAbrirResultado(${idx})}"`:''}><div class="when ${done?'final':''}">${safe(m.time)}</div><div><div class="versus"><span class="nc-team-label ${win>0?'nc-winner':''}">${ncLogo(m.escudoLocal)}<span>${safe(m.a)}</span></span><span class="${done?'final-score':'vs'}">${done?safe(m.score):'vs'}</span><span class="nc-team-label nc-team-away ${win<0?'nc-winner':''}">${ncLogo(m.escudoVisitante)}<span>${safe(m.b)}</span></span></div><div class="meta">${safe(courtLabel(m.court))} · ${safe(m.genero||'')} ${safe(m.cat)}${m.zona?' · Zona '+safe(m.zona):''}${done?' · Ver resultado':''}</div></div></article>`;}).join(''):`<div class="empty">${ncEmptyData('No hay partidos en esta selección.')}</div>`;};
 window.ncAbrirResultado=function(idx){const m=matches[idx];if(!m||!completed(m))return;ncCerrarResultado();const win=winner(m),sets=resultSets(m.resultado),safeUrl=u=>/^(https?:\/\/|data:image\/(?:png|jpeg|jpg|webp|gif);base64,)/i.test(String(u||''))?safe(u):'';
 const logoA=safeUrl(m.escudoLocal),logoB=safeUrl(m.escudoVisitante);
 const el=document.createElement('div');el.className='nc-result-modal';el.id='nc-result-modal';el.setAttribute('role','presentation');el.innerHTML=`<section class="nc-result-dialog" role="dialog" aria-modal="true" aria-label="Resultado del partido"><div class="nc-result-top"><span>${safe(m.genero||'')} ${safe(m.cat)} ${m.zona?'· Zona '+safe(m.zona):''}</span><button class="nc-result-close" aria-label="Cerrar resultado" onclick="ncCerrarResultado()">×</button></div><div class="nc-result-teams"><div class="nc-result-team ${win>0?'nc-winner':''}">${logoA?`<img src="${logoA}" alt="">`:''}<strong>${safe(m.a)}</strong><b>${safe(m.resultado.setsLocal)}</b>${win>0?'<div class="nc-result-winner-tag">GANADOR</div>':''}</div><div class="nc-result-vs">–</div><div class="nc-result-team ${win<0?'nc-winner':''}">${logoB?`<img src="${logoB}" alt="">`:''}<strong>${safe(m.b)}</strong><b>${safe(m.resultado.setsVisitante)}</b>${win<0?'<div class="nc-result-winner-tag">GANADOR</div>':''}</div></div>${sets.length?'<div class="nc-result-divider" aria-hidden="true"></div>':''}${sets.length?sets.map(x=>`<div class="nc-result-set"><strong>${safe(x.a)}</strong><span>${safe(x.label)}</span><strong>${safe(x.b)}</strong></div>`).join(''):''}<div class="nc-result-foot">${safe(courtLabel(m.court))} · Resultado confirmado</div></section>`;
 el.addEventListener('click',e=>{if(e.target===el)ncCerrarResultado()});document.body.appendChild(el);document.body.style.overflow='hidden';el.querySelector('button').focus();};
 window.ncCerrarResultado=function(){document.getElementById('nc-result-modal')?.remove();document.body.style.overflow='';};
 document.addEventListener('keydown',e=>{if(e.key==='Escape'&&document.getElementById('nc-result-modal'))ncCerrarResultado()});
 // Reconsulta la API pública para reflejar los resultados confirmados por la organización.
 setInterval(()=>{if(!document.hidden&&typeof ncDatosCargar==='function')ncDatosCargar(true);},60000);
})();
</script>
</body></html>
