<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ASISTENTE DE TORNEOS · Prueba de acceso</title><style>body{margin:0;font:16px Arial,sans-serif;background:#f4f6f3;color:#18372c;display:grid;place-items:center;min-height:100vh}main{width:min(430px,calc(100% - 40px));background:white;padding:32px;border-radius:16px;box-shadow:0 10px 30px #0001}h1{font-size:25px}label{display:block;margin:16px 0 5px}input,button{box-sizing:border-box;width:100%;padding:13px;border-radius:8px;font:inherit}input{border:1px solid #a9b8b0}button{border:0;background:#136c45;color:white;cursor:pointer;margin-top:20px}button:disabled{opacity:.5}small{color:#63776d}#error{color:#ad3030}#panel{display:none}#salir{background:#eee;color:#234}</style></head><body><main><h1>ASISTENTE DE TORNEOS</h1><small>Prueba de acceso · VI Torneo Nacional de Newcom 2026</small><section id="login"><form id="form"><label for="email">Correo electrónico</label><input id="email" type="email" autocomplete="username" required><label for="password">Contraseña</label><input id="password" type="password" autocomplete="current-password" required><button id="entrar">Ingresar</button></form><p id="error" role="alert"></p></section><section id="panel"><p id="bienvenida"></p><p>Inicio de sesión verificado por Firebase.</p><p><strong>Esta página de prueba no accede a Google Sheets ni permite modificar el torneo.</strong></p><button id="salir">Cerrar sesión</button></section></main><script type="module">import{initializeApp}from'https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js';import{getAuth,signInWithEmailAndPassword,onAuthStateChanged,signOut}from'https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js';const app=initializeApp({apiKey:'AIzaSyBM6a8sA-5HaY7U0VVRh4jThChGuGrC4_Q',authDomain:'torneo-newcom-2026.firebaseapp.com',projectId:'torneo-newcom-2026',storageBucket:'torneo-newcom-2026.firebasestorage.app',messagingSenderId:'158432822961',appId:'1:158432822961:web:aef0c08974477598948490'});const auth=getAuth(app),$=id=>document.getElementById(id);onAuthStateChanged(auth,user=>{$('login').style.display=user?'none':'block';$('panel').style.display=user?'block':'none';$('bienvenida').textContent=user?'Acceso reconocido: '+user.email:''});$('form').onsubmit=async e=>{e.preventDefault();$('error').textContent='';$('entrar').disabled=true;try{await signInWithEmailAndPassword(auth,$('email').value,$('password').value);$('password').value=''}catch(err){$('error').textContent='No se pudo iniciar sesión. Revisá correo y contraseña.'}finally{$('entrar').disabled=false}};$('salir').onclick=()=>signOut(auth);</script></body></html>
