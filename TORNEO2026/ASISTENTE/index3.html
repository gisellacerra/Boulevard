/* Confirmación propia del Asistente */
.as-modal-overlay{position:fixed;inset:0;background:rgba(9,31,23,.58);z-index:99999;display:flex;align-items:center;justify-content:center;padding:20px}

.as-modal button{min-width:110px}.as-modal button:focus-visible{outline:3px solid #b6d7c6;outline-offset:2px}

.zone-entry{display:flex;align-items:center;gap:20px;background:white;border:1px solid #e0e9e2;border-radius:9px;padding:9px;margin:9px 0;cursor:grab}

.zone-entry select{width:100px;padding:7px;font-size:12px}
.zone-entry .grip{color:#8a9f91;flex:0;font-size:18px}
button:disabled{opacity:.5;cursor:not-allowed}
.nombre-torneo{font-size:20px;font-weight:600;color:#a52f2f;line-height:1.35;margin-top:7px}.nombre-torneo .torneo-edicion{display:inline}.nombre-torneo .torneo-nombre{display:inline;margin-top:0}.newcom-equipo-icon{display:inline-flex;align-items:center;justify-content:center;font-size:20px;line-height:1;flex:none}
.p13-categoria{display:inline-flex;align-items:center;gap:9px;font-size:13px;font-weight:600;white-space:nowrap}.p13-categoria select{width:auto;min-width:95px}.toolbar:has(#p13Filtro){align-items:center}

/* Campos de edición: tipografía regular, sin heredar negritas de etiquetas o paneles. */

.fx-edicion input, .fx-edicion select, .field input, .field select, .field textarea {
  font-family: Inter, Arial, sans-serif;
  font-weight: 400 !important;
  font-style: normal;
}

}

/* Escudos en línea, sin ampliar tarjetas ni filas */
.nc-escudo-linea{display:inline-flex;align-items:center;gap:6px;max-width:100%;min-width:0;vertical-align:middle}

.nc-escudo-texto{min-width:0;overflow-wrap:anywhere}
.nc-escudo-cargar{cursor:pointer;display:inline-flex;align-items:center;flex:none}
 
/* Ajustes de formularios: botones compactos y archivos legibles */
.form .field.full:has(>button.primary){display:flex;justify-content:center;align-items:center}
.form .field.full>button.primary{width:auto!important;min-width:190px;max-width:100%;justify-self:center;flex:0 0 auto}

.as-modal{max-width:calc(100vw - 32px)}

/* Revisión visual de escritorio */
.nav-icon{display:inline-block;width:18px;height:18px;vertical-align:-4px;flex:none}
.fechas-torneo-grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.fechas-torneo-grid .field{min-width:0}

/* TABLA DE EQUIPOS MÁS COMPACTA */

/* Menos altura entre filas */
#view table:has([data-edit-team]) th,
#view table:has([data-edit-team]) td {
  padding: 7px 8px;
  vertical-align: middle;
  line-height: 1.25;
}

/* Escudos compactos */
.nc-escudo-icono {
  width: 22px;
  height: 22px;
}

 input[type="radio"] {
  accent-color: #bbf04a;
  cursor: pointer;

 const canchas=Number(settings.canchas);if(!Number.isInteger(canchas)||canchas<1){avisoIntegrado('Revisá la cantidad de canchas.');return}
 const comps=[...new Set(partidos.map(fxComp))];const reservaError=fxEvaluarReservas(comps,canchas);if(reservaError){avisoIntegrado(reservaError);return}
 const horarios=[];
 for(let d=0;d<3;d++){
  const desde=minutosHora(ventanasTorneo()[d][0]),hasta=minutosHora(ventanasTorneo()[d][1]);
  if(!Number.isFinite(desde)||!Number.isFinite(hasta)||hasta<=desde){avisoIntegrado('Revisá los horarios de la jornada '+(d+1)+'.');return}

 for(let intento=0;intento<24;intento++){
  const propuesta=fxCalcularPropuesta(partidos,horarios,turno,canchas,fxNumeroPropuesta*29+intento+1);

 saveDraft();render();
 if(mejor.faltantes)avisoIntegrado('Se programaron '+(partidos.length-mejor.faltantes)+' partidos; '+mejor.faltantes+' quedaron pendientes. Revisá las reservas o ampliá los horarios. No se puede confirmar hasta completarlos.');

function validarFixtureEtapa10(){
 const errores=[];const turno=Number(settings.duracion)+Number(settings.intervalo),f=programaFechas();
 const detalle=(p,i)=>'Partido N.º '+(i+1)+': '+p.local+' vs '+p.visitante+' — '+(p.fecha||'sin fecha')+' · '+(p.hora||'sin hora')+' · Cancha '+(p.cancha||'sin asignar');
 fixture.forEach((p,i)=>{
  if(!p.fecha||!p.hora||!p.cancha){errores.push(detalle(p,i)+': faltan fecha, hora o cancha');return}
  const d=f.indexOf(p.fecha),m=minutosHora(p.hora);
  if(d<0||!Number.isFinite(m)||m<minutosHora(ventanasTorneo()[d][0])||m+turno>minutosHora(ventanasTorneo()[d][1]))errores.push(detalle(p,i)+': fuera del horario habilitado');
  if(Number(p.cancha)<1||Number(p.cancha)>Number(settings.canchas))errores.push(detalle(p,i)+': cancha inválida');
  for(let j=0;j<i;j++){
   const q=fixture[j];if(q.fecha!==p.fecha||!q.hora)continue;
   const mq=minutosHora(q.hora);
   if(!Number.isFinite(mq)||!Number.isFinite(m)||!(m<mq+turno&&mq<m+turno))continue;
   if(String(p.cancha)===String(q.cancha))errores.push('Conflicto de cancha y horario. '+detalle(q,j)+' | '+detalle(p,i));
   if(p.categoria===q.categoria&&p.genero===q.genero){
    const compartidos=[p.local,p.visitante].filter(n=>n===q.local||n===q.visitante);
    if(compartidos.length)errores.push('Equipo que juega simultáneamente: '+[...new Set(compartidos)].join(', ')+'. '+detalle(q,j)+' | '+detalle(p,i));
   }
  }
 });
 return errores;
}

function fxColorCategoria(categoria){

 if(typeof elegido==='string'&&/^#[0-9a-fA-F]{6}$/.test(elegido))return elegido;

function minutesOf(h){const m=/^(\d{2}):(\d{2})$/.exec(h||'');return m?Number(m[1])*60+Number(m[2]):NaN}







function validateFixture(){const issues=[];const slots=new Map();const duration=Number(settings.duracion)+Number(settings.intervalo);fixture.forEach((p,i)=>{const tag=`Partido ${i+1} (${p.local} vs ${p.visitante})`;if(!p.fecha||!p.hora||!p.cancha){issues.push({type:'pending',text:tag+': falta fecha, hora o cancha.'});return}const start=minutesOf(p.hora);if(!Number.isFinite(start)){issues.push({type:'error',text:tag+': hora inválida.'});return}if(start+duration>1440){issues.push({type:'error',text:tag+': excede el final del día.'})}const day=slots.get(p.fecha)||[];for(const other of day){if(start<other.end&&other.start<start+duration){if(String(p.cancha)===String(other.p.cancha))issues.push({type:'error',text:`Conflicto de cancha ${p.cancha}: partidos ${other.i+1} y ${i+1} (${p.fecha}).`});const shared=[p.local,p.visitante].filter(t=>t===other.p.local||t===other.p.visitante);if(shared.length)issues.push({type:'error',text:`Equipo duplicado (${shared.join(', ')}): partidos ${other.i+1} y ${i+1} (${p.fecha}).`})}}day.push({p,i,start,end:start+duration});slots.set(p.fecha,day)});return issues}

function leerEquiposPrivados(){

  const status=document.getElementById('estadoEquipos');

  if(!window.google?.script?.run){if(status)status.textContent='Abrí el panel de administración privado para actualizar los datos.';return}

  if(lecturaEquiposEnCurso)return;

  lecturaEquiposEnCurso=true;

  if(status)status.textContent='Actualizando los 8 campos desde los datos guardados...';

  google.script.run.withSuccessHandler(async data=>{

    lecturaEquiposEnCurso=false;

    const lista=Array.isArray(data)?data:(data&&Array.isArray(data.equipos)?data.equipos:null);

    if(!lista){if(status)status.textContent='Respuesta inválida del servidor.';return}

    equiposDeBaja=lista.filter(t=>String(t.estado||'ACTIVO').toUpperCase()==='BAJA');
    const nuevos=lista.filter(t=>String(t.estado||'ACTIVO').toUpperCase()!=='BAJA').map(t=>({

      id:String(t.id??'').trim(),nombre:String(t.equipo??'').trim(),

      categoria:'+'+String(t.categoria??'').trim().replace(/^\+/,''),

      localidad:String(t.ciudad??''),provincia:String(t.provincia??''),dt:String(t.dt??''),telefono:String(t.telefono??''),

      hombres:Number(t.hombres)||0,mujeres:Number(t.mujeres)||0,genero:String(t.genero||'Mixto'),escudo:String(t.escudo||'')

    })).filter(t=>t.nombre&&categoriasInscripcion.includes(t.categoria));

    if(lista.length!==nuevos.length+equiposDeBaja.length){if(status)status.textContent='Hay registros con categorías inválidas. No se reemplazaron los datos.';return}

    const antes=new Map(teams.filter(t=>t.id).map(t=>[String(t.id),t]));

    const despues=new Map(nuevos.map(t=>[String(t.id),t]));

    const estructuraCambio=antes.size!==despues.size||

      [...antes].some(([id,t])=>!despues.has(id)||

        despues.get(id).nombre!==t.nombre||(despues.get(id).categoria!==t.categoria||despues.get(id).genero!==t.genero));

    // DT, teléfono, localidad y jugadores no modifican la programación.

    if(estructuraCambio&&!([...antes].every(([id,t])=>despues.has(id)&&despues.get(id).nombre===t.nombre&&despues.get(id).categoria===t.categoria))&&(fixture.length||Object.keys(zones).length)){

      if(!await dialogoEquipo('Confirmación','Cambió la lista de equipos o sus categorías. Actualizarla requiere descartar los sorteos y fixture del borrador local. ¿Continuar?',true)){

        if(status)status.textContent='Se conservó el borrador; los cambios guardados no se aplicaron.';

        return;

      }

    }

    // Si hay registros locales sin ID, evitar que una sincronización silenciosa los borre.

    if(teams.some(t=>!t.id)&&!await dialogoEquipo('Confirmación','Hay equipos locales sin vincular a Sheets. Actualizar descartará esos registros locales. ¿Continuar?',true)){

      if(status)status.textContent='Se conservó el borrador local.';return;

    }

    // Si solo se agregaron equipos, conservar las zonas: aparecen como pendientes.
    const soloAltas=[...antes].every(([id,t])=>despues.has(id)&&despues.get(id).nombre===t.nombre&&despues.get(id).categoria===t.categoria);
    teams=nuevos;

    if(estructuraCambio&&!soloAltas){zones={};fixture=[]}

    equiposCargadosDesdeSheets=true;equiposFuenteSheets=true;

    saveDraft();if(active!=='fixture')render();

    const target=document.getElementById('estadoEquipos');

    if(target)target.textContent='Datos actualizados: '+nuevos.length+' activos y '+equiposDeBaja.length+' bajas.';

  }).withFailureHandler(e=>{

    lecturaEquiposEnCurso=false;

    const target=document.getElementById('estadoEquipos');

    if(target)target.textContent='Error de lectura: '+(e.message||e);

  }).adminListarEquiposEditables();

}

 function etapa14Semis(d){

   if(d.grupos.some(g=>!g.ranking.length))return {semis:[],aviso:'Hay zonas sin equipos clasificados.'};

async function prepararFotoBufet(file){
 if(!file||!/^image\/(png|jpeg|webp)$/.test(file.type))throw Error('Elegí una foto JPG, PNG o WebP.');

 // Se reduce progresivamente la resolución interna si la imagen PNG supera el límite de Google Sheets.
 // En el administrador y en la página pública se mantiene el espacio visual de 120 × 120 px.
 for(const n of [120,104,88,72,60,48,40,32]){
  const escala=Math.min(n/img.width,n/img.height),w=Math.max(1,Math.round(img.width*escala)),h=Math.max(1,Math.round(img.height*escala));
  const c=document.createElement('canvas');c.width=n;c.height=n;const ctx=c.getContext('2d',{willReadFrequently:true});
  ctx.drawImage(img,Math.floor((n-w)/2),Math.floor((n-h)/2),w,h);

  const puntos=[[Math.floor((n-w)/2),Math.floor((n-h)/2)],[Math.floor((n-w)/2)+w-1,Math.floor((n-h)/2)],[Math.floor((n-w)/2),Math.floor((n-h)/2)+h-1],[Math.floor((n-w)/2)+w-1,Math.floor((n-h)/2)+h-1]];
  const rgb=(x,y)=>{const j=(y*n+x)*4;return[d[j],d[j+1],d[j+2]]};

   const add=k=>{if(seen[k])return;seen[k]=1;const j=k*4;if(d[j+3]&&dist([d[j],d[j+1],d[j+2]],base)<=28)queue[tail++]=k};
   for(let x=0;x<n;x++){add(x);add((n-1)*n+x)}for(let y=0;y<n;y++){add(y*n);add(y*n+n-1)}
   while(head<tail){const k=queue[head++],j=k*4;d[j+3]=0;const x=k%n,y=Math.floor(k/n);if(x)add(k-1);if(x<n-1)add(k+1);if(y)add(k-n);if(y<n-1)add(k+n)}

  }

}
async function prepararEscudo(file){
 if(!file||!/^image\/(png|jpeg|webp)$/.test(file.type))throw Error('Elegí una imagen JPG, PNG o WebP.');

 // Solo se vuelve transparente el fondo conectado a los bordes y parecido al color de las esquinas.
 // Así se evita borrar el blanco o cualquier otro color dentro del escudo.
 for(const limite of [256,224,192,160,128,96,80,64]){
  const escala=Math.min(1,limite/img.width,limite/img.height);
  const w=Math.max(1,Math.round(img.width*escala)),h=Math.max(1,Math.round(img.height*escala));
  const c=document.createElement('canvas');c.width=w;c.height=h;
  const ctx=c.getContext('2d',{willReadFrequently:true});ctx.drawImage(img,0,0,w,h);
  const pixels=ctx.getImageData(0,0,w,h),d=pixels.data;
  const esquinas=[0,w-1,(h-1)*w,(h*w)-1].map(k=>k*4);

   const agregar=k=>{if(vistos[k])return;vistos[k]=1;const j=k*4;if(d[j+3]>0&&distancia([d[j],d[j+1],d[j+2]],color)<=28)cola[fin++]=k};
   for(let x=0;x<w;x++){agregar(x);agregar((h-1)*w+x)}
   for(let y=0;y<h;y++){agregar(y*w);agregar(y*w+w-1)}
   while(ini<fin){const k=cola[ini++],j=k*4;d[j+3]=0;const x=k%w,y=Math.floor(k/w);if(x>0)agregar(k-1);if(x<w-1)agregar(k+1);if(y>0)agregar(k-w);if(y<h-1)agregar(k+w)}

}

ed=false;dialogoEquipo('No se pudo guardar',String(err.message||err))}).adminArbitrosGuardar(d)};document.querySelectorAll('[data-arb-edit]').forEach(b=>b.onclick=()=>{arbEdicion=arbRegistros.find(a=>a.id===b.dataset.arbEdit);arbFotoNueva='';arbQuitarFoto=false;render()});document.querySelectorAll('[data-arb-del]').forEach(b=>b.onclick=async()=>{if(!await dialogoEquipo('Eliminar árbitro','¿Confirmás la eliminación?',true))return;google.script.run.withSuccessHandler(()=>{arbEdicion=null;arbLeer()}).withFailureHandler(e=>dialogoEquipo('Error',String(e.message||e))).adminArbitrosEliminar(b.dataset.arbDel)})}

<script>
/* Presentación: las claves internas +60|Mixto permanecen intactas.
   Solo se normalizan los textos que ve el administrador. */
(function () {
  const patron = /(\+\d{2,3})\s*\|\s*(Mixto|Femenino|Masculino)\b/gi;
  function limpiarTexto(texto) {
    return texto.replace(patron, '$1 $2');
  }
  function revisar(nodo) {
    if (nodo.nodeType === Node.TEXT_NODE) {
      const padre = nodo.parentElement;
      if (!padre || /^(SCRIPT|STYLE|TEXTAREA|OPTION)$/i.test(padre.tagName)) return;
      const corregido = limpiarTexto(nodo.nodeValue);
      if (corregido !== nodo.nodeValue) nodo.nodeValue = corregido;
      return;
    }
    if (nodo.nodeType !== Node.ELEMENT_NODE) return;
    if (/^(SCRIPT|STYLE|TEXTAREA|SELECT)$/i.test(nodo.tagName)) return;
    const walker = document.createTreeWalker(nodo, NodeFilter.SHOW_TEXT);
    const textos = [];
    while (walker.nextNode()) textos.push(walker.currentNode);
    textos.forEach(revisar);
  }
  function iniciar() {
    revisar(document.body);
    new MutationObserver(cambios => {
      for (const cambio of cambios) {
        if (cambio.type === 'characterData') revisar(cambio.target);
        else cambio.addedNodes.forEach(revisar);
      }
    }).observe(document.body, {childList:true, characterData:true, subtree:true});
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', iniciar);
  else iniciar();
})();
</script>
