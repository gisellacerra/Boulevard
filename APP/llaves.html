<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#086518">
<title>Llaves | Club Boulevard</title>

<style>
:root{
  --verde:#007d35;
  --verde2:#005a27;
  --negro:#111;
  --amarillo:#F3DF00;
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  min-height:100dvh;
  font-family:Arial,Helvetica,sans-serif;
  background:#f4f4f4;
  color:#111;
}

a{
  -webkit-tap-highlight-color:transparent;
}

.app{
  width:100%;
  max-width:760px;
  min-height:100dvh;
  margin:auto;
  padding-bottom:116px;
}

/* HEADER */

header{
  position:sticky;
  top:0;
  z-index:20;

  display:grid;
  grid-template-columns:48px 1fr 48px;
  align-items:center;
  gap:12px;

  min-height:92px;

  padding:
    calc(14px + env(safe-area-inset-top))
    18px
    14px;

  background:rgba(255,255,255,.95);
  border-bottom:1px solid rgba(0,0,0,.06);

  backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);
}

.icon-btn{
  width:46px;
  height:46px;

  display:flex;
  align-items:center;
  justify-content:center;

  border-radius:15px;

  color:#111;
  text-decoration:none;
}

.icon-btn svg{
  width:30px;
  height:30px;
}

.marca{
  display:flex;
  align-items:center;
  justify-content:center;
  min-width:0;
}

.marca a{
  max-width:100%;
  display:flex;
  align-items:center;
  justify-content:center;
}

.marca img{
  display:block;
  width:auto;
  height:58px;
  max-width:100%;
  object-fit:contain;
}

/* CONTENIDO */

main{
  min-height:calc(100dvh - 208px);
  padding:40px 20px;

  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;

  gap:22px;
}

.boton{
  display:flex;
  align-items:center;
  justify-content:center;

  width:min(100%,200px);
  height:58px;

  border-radius:14px;

  background:linear-gradient(180deg,#0a7a2a,#086518);

  color:#fff;
  text-decoration:none;

  font-size:21px;
  font-weight:500;
  letter-spacing:.3px;

  box-shadow:
    0 10px 22px rgba(0,0,0,.18),
    0 3px 8px rgba(0,0,0,.14);

  transition:.20s ease;
}

.boton:hover{
  transform:translateY(-2px);

  box-shadow:
    0 14px 28px rgba(0,0,0,.22),
    0 5px 12px rgba(0,0,0,.16);
}

.boton:active{
  transform:translateY(1px);

  box-shadow:
    0 6px 12px rgba(0,0,0,.18);
}

/* NAVEGACIÓN INFERIOR — IGUAL A ALOJAMIENTO.HTML */

.nav-item{
  transition:.25s;
}

.nav-item img{
  filter:brightness(0) invert(1);
}

.nav-item span{
  color:#fff;
}

/* BOTÓN ACTIVO */

.nav-item.activo img{
  filter:
    brightness(0)
    saturate(100%)
    invert(83%)
    sepia(91%)
    saturate(1128%)
    hue-rotate(8deg)
    brightness(104%)
    contrast(102%);
}

.nav-item.activo span{
  color:#F3DF00;
}

nav{
  position:fixed;
  left:50%;
  bottom:0;

  transform:translateX(-50%);

  z-index:30;

  width:min(100%,760px);

  display:grid;
  grid-template-columns:repeat(5,1fr);

  padding:
    10px 0
    calc(8px + env(safe-area-inset-bottom));

  background:#086518;
}

.nav-item{
  min-width:0;
  min-height:68px;

  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;

  gap:8px;

  padding:4px 2px;

  color:#fff;

  text-decoration:none;
  text-align:center;
  text-transform:uppercase;

  font-size:13px;
  font-weight:700;
}

.nav-item img{
  width:40px;
  height:40px;

  object-fit:contain;
  filter:brightness(0) invert(1);
}

.nav-item span{
  width:100%;

  color:#fff;

  white-space:nowrap;

  font-size:9px;
}

/* CELULAR */

@media(max-width:430px){

  header{
    grid-template-columns:43px 1fr 43px;

    padding-left:12px;
    padding-right:12px;
  }

  .nav-item img{
    width:36px;
    height:36px;
  }
}
</style>
</head>

<body>
<div class="app">

  <header>

    <a
      class="icon-btn"
      href="index.html"
      aria-label="Volver al inicio">

      <svg
    viewBox="0 0 24 24"
    width="28"
    height="28"
    fill="none"
    xmlns="http://www.w3.org/2000/svg">

    <path
        d="M15.5 5L8.5 12L15.5 19"
        stroke="#1F1F1F"
        stroke-width="2.8"
        stroke-linecap="round"
        stroke-linejoin="round"/>

</svg>

    </a>

    <div class="marca">

      <a
        href="index.html"
        aria-label="Ir al inicio">

        <img
          src="assets/logos/logo-torneo.png"
          alt="VI Torneo Nacional de Newcom 2026">

      </a>

    </div>

    <div aria-hidden="true"></div>

  </header>

  <main>

    <a
      class="boton"
      href="llave50.html">
      Llave +50
    </a>

    <a
      class="boton"
      href="llave60.html">
      Llave +60
    </a>

  </main>

  <nav aria-label="Navegación principal">

    <a
      class="nav-item"
      href="bufet.html">

      <img
        src="assets/iconos/menu.png"
        alt="">

      <span>BUFET</span>

    </a>

    <a
      class="nav-item"
      href="horarios.html">

      <img
        src="assets/iconos/horario.png"
        alt="">

      <span>HORARIOS</span>

    </a>

    <a
      class="nav-item activo"
      href="llaves.html">

      <img
        src="assets/iconos/llaves.png"
        alt="">

      <span>LLAVES</span>

    </a>

    <a
      class="nav-item"
      href="https://www.youtube.com/@flumediaTV">

      <img
        src="assets/iconos/streaming.png"
        alt="">

      <span>STREAMING</span>

    </a>

    <a
      class="nav-item"
      href="alojamiento.html">

      <img
        src="assets/iconos/hotel.png"
        alt="">

      <span>ALOJAMIENTO</span>

    </a>

  </nav>

</div>
</body>
</html>
