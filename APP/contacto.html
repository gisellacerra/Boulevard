<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>Contacto | Club Boulevard</title>
<style>
:root{--verde:#086518;--verde2:#005a27;--amarillo:#F3DF00;--negro:#111;}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%;background:#fff}
body{min-height:100dvh;font-family:Arial,Helvetica,sans-serif;color:#171717}
a{-webkit-tap-highlight-color:transparent}
.app{width:100%;max-width:760px;min-height:100dvh;margin:auto;padding-bottom:116px;background:#fff}
header{position:sticky;top:0;z-index:20;display:grid;grid-template-columns:48px 1fr 48px;align-items:center;gap:12px;min-height:92px;padding:calc(14px + env(safe-area-inset-top)) 18px 14px;background:rgba(255,255,255,.96);border-bottom:1px solid rgba(0,0,0,.06);backdrop-filter:blur(14px)}
.icon-btn{width:46px;height:46px;display:flex;align-items:center;justify-content:center;color:#111;text-decoration:none}
.icon-btn svg{width:30px;height:30px;display:block}
.marca{min-width:0;display:flex;align-items:center;justify-content:center}.marca a{display:flex;align-items:center;justify-content:center}.marca img{display:block;width:min(100%,305px);max-height:65px;object-fit:contain}.header-espacio{width:46px;height:46px}
main{padding:30px 18px 36px}.pagina{max-width:590px;margin:0 auto}.pagina h1{text-align:center;font-size:clamp(28px,7vw,40px);line-height:1;text-transform:uppercase;margin-bottom:24px}.pagina p{font-size:17px;line-height:1.6;color:#333;margin:0 0 18px}.pagina strong{color:#111}.intro{text-align:center;color:#555!important;margin-bottom:28px!important}
.contactos{display:grid;gap:12px}.contacto-card{padding:18px;border:1px solid #e5e5e5;border-radius:16px;background:#fff}.contacto-nombre{font-size:18px;font-weight:600;margin-bottom:5px}.contacto-card a{color:#ff0707;font-size:18px;font-weight:500;text-decoration:none}.contacto-nota{display:block;margin-top:5px;color:#666;font-size:14px;line-height:1.35}
.desarrollo-destacado{padding:18px 18px 4px;border-left:5px solid var(--verde);background:#f6f8f6;border-radius:0 14px 14px 0;margin-bottom:22px}.cta{margin-top:26px;padding:20px;border-radius:16px;background:#f3f7f4;text-align:center}.cta a{color:var(--verde);font-size:20px;font-weight:800;text-decoration:none}.firma{font-weight:800}.cierre{text-align:center;font-weight:800;margin-top:28px!important}
nav{position:fixed;left:50%;bottom:0;transform:translateX(-50%);z-index:30;width:min(100%,760px);display:grid;grid-template-columns:repeat(6,minmax(0,1fr));padding:10px 0 calc(8px + env(safe-area-inset-bottom));background:#086518}.nav-item{min-width:0;min-height:68px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:4px 2px;color:#fff;text-decoration:none;text-align:center;text-transform:uppercase;font-size:13px;font-weight:700}.nav-item img,.nav-svg{width:40px;height:40px;display:block;object-fit:contain;flex:none}.nav-item img{filter:brightness(0) invert(1)}.nav-svg{color:#fff;fill:none}.nav-item span{width:100%;color:#fff;white-space:nowrap;font-size:9px}.nav-item.activo span,.nav-item.activo .nav-svg{color:var(--amarillo)}
@media(max-width:430px){header{grid-template-columns:43px 1fr 43px;padding-left:12px;padding-right:12px}.nav-item img,.nav-item .nav-svg{width:30px;height:30px}.pagina p{font-size:16px}}
/* Iconos del menú inferior: tamaño unificado */
nav .nav-item img,
nav .nav-item .nav-svg{width:30px !important;height:30px !important;}
</style>
</head>
