<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#086518">
<title>Bufet | Club Boulevard</title>

<style>
:root{
  --verde:#086518;
  --blanco:#ffffff;
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,
body{
  min-height:100%;
  background:#fff;
}

html{
  scroll-behavior:smooth;
}

body{
  min-height:100dvh;
  font-family:Arial,Helvetica,sans-serif;
  color:#171717;
  overflow-x:hidden;
}

button,
a{
  -webkit-tap-highlight-color:transparent;
}

.app{
  width:100%;
  max-width:760px;
  min-height:100dvh;
  margin:auto;
  padding-bottom:104px;
  background:#fff;
}


/* CABECERA */

header{
  position:relative;
  z-index:20;

  display:grid;
  grid-template-columns:48px 1fr 48px;
  align-items:center;
  gap:12px;

  min-height:92px;

  padding:
    calc(14px + env(safe-area-inset-top))
    18px
    14px;

  background:rgba(255,255,255,.97);
  border-bottom:1px solid rgba(0,0,0,.06);
}

.icon-btn{
  width:46px;
  height:46px;

  display:flex;
  align-items:center;
  justify-content:center;

  color:#111;
  text-decoration:none;
}

.icon-btn svg{
  width:30px;
  height:40px;
  display:block;
}

.marca{
  min-width:0;
  display:flex;
  align-items:center;
  justify-content:center;
}

.marca a{
  display:flex;
  align-items:center;
  justify-content:center;
  text-decoration:none;
}

.marca img{
  width:min(100%,305px);
  max-height:65px;
  display:block;
  object-fit:contain;
}


/* SLIDER */


.menu-slider{
    position:relative;
    overflow:hidden;
}

.menu-slider::after{
    content:"";
    position:absolute;
    left:0;
    right:0;
    bottom:0;
    height:110px;
    pointer-events:none;
    background:linear-gradient(
        to top,
        rgba(0,0,0,.65) 0%,
        rgba(0,0,0,.35) 35%,
        rgba(0,0,0,.10) 70%,
        rgba(0,0,0,0) 100%
    );
    z-index:3;
}



main{background:#fff;}



.menu-slider{
  position:relative;
  width:100%;
  /* La placa ocupa toda la pantalla disponible hasta el menú verde inferior */
  height:calc(100dvh - 92px - 86px - env(safe-area-inset-top) - env(safe-area-inset-bottom));
  overflow:hidden;
  background:#111;
  touch-action:pan-y;
}

.menu-track{
  width:100%;
  height:100%;
  display:flex;
  transition:transform .55s cubic-bezier(.22,.72,.24,1);
}

.menu-slide{
  position:relative;
  min-width:100%;
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  background:#111;
}

.menu-slide img{
  width:100%;
  height:100%;
  display:block;
  object-fit:contain;
  object-position:center;
}


.puntos{
  position:absolute;
  left:0;
  right:0;
  bottom:20px;
  z-index:8;
  display:flex;
  justify-content:center;
  align-items:center;
  gap:9px;
}

.punto{
  width:13px;
  height:13px;

  padding:0;
  border:1px solid rgba(255,255,255,.95);
  border-radius:50%;

  background:rgba(255,255,255,.92);
  box-shadow:0 1px 5px rgba(0,0,0,.35);

  cursor:pointer;
  transition:transform .2s ease,background .2s ease;
}

.punto.activo{
  background:#ffd400;
  border-color:#ffd400;
  transform:scale(1.12);
}


.slider-indicadores{
    position:absolute;
    left:50%;
    bottom:18px;
    transform:translateX(-50%);
    display:flex;
    gap:10px;
    z-index:5;
}

.slider-indicadores span{
    width:11px;
    height:11px;
    border-radius:50%;
    background:#fff;
    opacity:.55;
    transition:.3s;
}

.slider-indicadores span.activo{
    opacity:1;
}



/* BOTÓN PRECIOS SOBRE EL SLIDER */
.btn-precios{
  position:absolute;
  left:50%;
  bottom:52px;
  transform:translateX(-50%);
  z-index:9;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  padding:10px 18px;
  color:#111;
  background:#fff;
  border-radius:12px;
    font-size:19px;
    font-weight:600;
  text-decoration:none;
  text-transform:uppercase;
  box-shadow:0 5px 16px rgba(0,0,0,.28);
  white-space:nowrap;
      margin-bottom: 80px;
}

/* PRECIOS BUFET */
.precios-bufet{padding:24px 14px 34px;background:#fff}
.precios-titulo{text-align:center;margin-bottom:18px}
.precios-titulo h2{font-size:23px;line-height:1.05;text-transform:uppercase;color:#111}
.precios-titulo p{margin-top:6px;font-size:13px;color:#666}
.lista-precios{display:grid;gap:18px}
.grupo-precios{overflow:hidden;border:1px solid #e8e8e8;border-radius:16px;background:#fff;box-shadow:0 5px 18px rgba(0,0,0,.06)}
.grupo-precios h3{padding:11px 15px;background:var(--verde);color:#fff;font-size:14px;text-transform:uppercase;letter-spacing:.4px}
.item-precio{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;padding:13px 15px;border-bottom:1px solid #ededed}
.item-precio:last-child{border-bottom:0}
.item-nombre{font-size:17px;font-weight:500;line-height:1.2}
.item-detalle{margin-top:3px;color:#6b6b6b;font-size:13px;line-height:1.3}
.item-valor{color:var(--verde);font-size:18px;font-weight:700;white-space:nowrap}
.estado-precios{padding:20px;text-align:center;background:#f5f5f5;border-radius:14px;color:#666;font-size:14px}

/* MENÚ INFERIOR */

nav{
  position:fixed;
  left:50%;
  bottom:0;
  transform:translateX(-50%);
  z-index:30;

  width:min(100%,760px);

  display:grid;
  grid-template-columns:repeat(5,minmax(0,1fr));

  padding:
    10px 0
    calc(8px + env(safe-area-inset-bottom));

  background:var(--verde);
}

.nav-item{
  min-width:0;
  min-height:68px;

  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;

  gap:8px;
  padding:4px 2px;

  color:#fff;
  text-decoration:none;
  text-align:center;
  text-transform:uppercase;

  font-size:13px;
  line-height:1;
  font-weight:700;
}

.nav-item img{
  width:40px;
  height:40px;

  display:block;
  object-fit:contain;

  filter:brightness(0) invert(1);
}

.nav-item span{
  width:100%;
  color:#fff;
  white-space:nowrap;
  font-size:9px;
}

.nav-item.activo img{
    filter:brightness(0) saturate(100%)
           invert(83%) sepia(91%) saturate(1128%)
           hue-rotate(8deg) brightness(104%) contrast(102%);
}

.nav-item.activo span{
    color:#F3DF00;
}


/* CELULAR */

@media(max-width:430px){

  header{
    grid-template-columns:43px 1fr 43px;
    padding-left:12px;
    padding-right:12px;
  }

  .nav-item img{
    width:36px;
    height:36px;
  }
}

</style>
</head>

<body>

<div class="app">

  <header>

    <a
      class="icon-btn"
      href="index.html"
      aria-label="Volver al inicio">

        <svg
    viewBox="0 0 24 24"
    width="28"
    height="28"
    fill="none"
    xmlns="http://www.w3.org/2000/svg">

    <path
        d="M15.5 5L8.5 12L15.5 19"
        stroke="#1F1F1F"
        stroke-width="2.8"
        stroke-linecap="round"
        stroke-linejoin="round"/>

</svg>

    </a>

    <div class="marca">
      <a href="index.html" aria-label="Ir al inicio">
        <img
          src="assets/logos/logo-torneo.png"
          alt="VI Torneo Nacional de Newcom 2026">
      </a>
    </div>

    <div aria-hidden="true"></div>

  </header>


  <main>

    <section
      id="menuSlider"
      class="menu-slider"
      aria-label="Placas del bufet">

      <div
        id="menuTrack"
        class="menu-track">

        <article class="menu-slide">
          <img
            src="assets/imagenes/bufet2.jpg"
            alt="Sándwich de milanesa con lechuga y tomate">
        </article>

        <article class="menu-slide">
          <img
            src="assets/imagenes/bufet3.jpg"
            alt="Pizza por porción">
        </article>

        <article class="menu-slide">
          <img
            src="assets/imagenes/bufet4.jpg"
            alt="Ensaladas variadas">
        </article>

        <article class="menu-slide">
          <img
            src="assets/imagenes/bufet5.jpg"
            alt="Guiso de lentejas">
        </article>

        <article class="menu-slide">
          <img
            src="assets/imagenes/bufet6.jpg"
            alt="Choripán">
        </article>

      </div>

      <a href="#preciosBufet" class="btn-precios" aria-label="Ver precios del bufet">
        PRECIOS
      </a>

      <div
        class="puntos"
        aria-label="Seleccionar placa">

        <button
          class="punto activo"
          type="button"
          data-slide="0"
          aria-label="Mostrar primera placa">
        </button>

        <button
          class="punto"
          type="button"
          data-slide="1"
          aria-label="Mostrar segunda placa">
        </button>

        <button
          class="punto"
          type="button"
          data-slide="2"
          aria-label="Mostrar tercera placa">
        </button>

        <button
          class="punto"
          type="button"
          data-slide="3"
          aria-label="Mostrar cuarta placa">
        </button>

           <button
          class="punto"
          type="button"
          data-slide="4"
          aria-label="Mostrar quinta placa">
        </button>

      </div>

    </section>

    <section id="preciosBufet" class="precios-bufet" aria-labelledby="tituloPrecios">
      <div class="precios-titulo">
        <h2 id="tituloPrecios">Precios de nuestro Bufet</h2>
        <p>Productos disponibles durante el torneo</p>
      </div>
      <div id="listaPrecios" class="lista-precios">
        <div class="estado-precios">Cargando precios…</div>
      </div>
    </section>

  </main>


  <nav aria-label="Navegación principal">

    <a
      class="nav-item activo"
      href="bufet.html">

      <img
        src="assets/iconos/menu.png"
        alt="">

      <span>BUFET</span>

    </a>

    <a
      class="nav-item"
      href="horarios.html">

      <img
        src="assets/iconos/horario.png"
        alt="">

      <span>HORARIOS</span>

    </a>

    <a
      class="nav-item"
      href="llaves.html">

      <img
        src="assets/iconos/llaves.png"
        alt="">

      <span>LLAVES</span>

    </a>

    <a
      class="nav-item"
      href="https://www.youtube.com/@flumediaTV"
      target="_blank"
      rel="noopener">

      <img
        src="assets/iconos/streaming.png"
        alt="">

      <span>STREAMING</span>

    </a>

    <a
      class="nav-item"
      href="alojamiento.html">

      <img
        src="assets/iconos/hotel.png"
        alt="">

      <span>ALOJAMIENTO</span>

    </a>

  </nav>

</div>


<script>

const URL_DATOS =
  "https://script.google.com/macros/s/AKfycbydaB86Z3ByT8aSrmiznBOYx9FtFOF7yjplD3zzEK7jIvHAIHbjx1YZl1v4O3YcudUK/exec";

const hero = document.getElementById("menuSlider");
const heroTrack = document.getElementById("menuTrack");
const listaPrecios = document.getElementById("listaPrecios");

const slides = Array.from(
  document.querySelectorAll(".menu-slide")
);

const puntos = Array.from(
  document.querySelectorAll(".punto")
);

let slideActual = 0;
let temporizadorSlider;

function mostrarSlide(indice){

  const total = slides.length;

  slideActual =
    (indice + total) % total;

  heroTrack.style.transform =
    `translateX(-${slideActual * 100}%)`;

  puntos.forEach((punto, indicePunto) => {
    punto.classList.toggle(
      "activo",
      indicePunto === slideActual
    );
  });
}

function siguienteSlide(){
  mostrarSlide(slideActual + 1);
}

function iniciarAutomatico(){
  clearInterval(temporizadorSlider);

  temporizadorSlider =
    setInterval(siguienteSlide,10000);
}

puntos.forEach(punto => {

  punto.addEventListener("click",() => {

    mostrarSlide(
      Number(punto.dataset.slide)
    );

    iniciarAutomatico();
  });

});

hero.addEventListener(
  "touchstart",
  evento => {

    // No cambiar si se toca un botón o enlace
    if (evento.target.closest("a, button")) return;

    const rect = hero.getBoundingClientRect();
    const x = evento.touches[0].clientX - rect.left;

    if (x < rect.width / 2) {
      mostrarSlide(slideActual - 1);
    } else {
      mostrarSlide(slideActual + 1);
    }

    iniciarAutomatico();

  },
  { passive: true }
);


function escaparHTML(v=""){
  return String(v).replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;");
}
function formatearPrecio(v){
  const t=String(v??"").trim();
  if(!t) return "";
  if(t.startsWith("$")) return t;
  const n=Number(t.replace(/\./g,"").replace(",","."));
  return Number.isFinite(n) ? "$ "+n.toLocaleString("es-AR",{maximumFractionDigits:0}) : t;
}
function renderizarBufet(datos){
  const items=Array.isArray(datos?.bufet)?datos.bufet:[];
  if(!items.length){
    listaPrecios.innerHTML='<div class="estado-precios">No hay productos cargados por el momento.</div>';
    return;
  }
  const grupos=new Map();
  [...items].sort((a,b)=>(Number(a.orden)||999)-(Number(b.orden)||999)).forEach(p=>{
    const cat=String(p.categoria||"Otros").trim()||"Otros";
    if(!grupos.has(cat)) grupos.set(cat,[]);
    grupos.get(cat).push(p);
  });
  listaPrecios.innerHTML=[...grupos.entries()].map(([cat,productos])=>`
    <section class="grupo-precios">
      <h3>${escaparHTML(cat)}</h3>
      ${productos.map(p=>`
        <div class="item-precio">
          <div>
            <div class="item-nombre">${escaparHTML(p.item||"Producto")}</div>
            ${p.detalle?`<div class="item-detalle">${escaparHTML(p.detalle)}</div>`:""}
          </div>
          <div class="item-valor">${escaparHTML(formatearPrecio(p.precio))}</div>
        </div>`).join("")}
    </section>`).join("");
}
async function cargarBufet(){
  try{
    const r=await fetch(`${URL_DATOS}?t=${Date.now()}`,{cache:"no-store"});
    if(!r.ok) throw new Error(`HTTP ${r.status}`);
    renderizarBufet(await r.json());
  }catch(e){
    console.error(e);
    listaPrecios.innerHTML='<div class="estado-precios">No se pudieron cargar los precios del bufet.</div>';
  }
}

window.addEventListener("load",() => {
  iniciarAutomatico();
  cargarBufet();
});

setInterval(cargarBufet,60000);

</script>

</body>
</html>
