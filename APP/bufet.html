<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#086518">
<title>Bufet | Club Boulevard</title>

<style>
:root{
  --verde:#086518;
  --blanco:#ffffff;
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,
body{
  min-height:100%;
  background:#fff;
}

html{
  scroll-behavior:smooth;
}

body{
  min-height:100dvh;
  font-family:Arial,Helvetica,sans-serif;
  color:#171717;
  overflow-x:hidden;
}

button,
a{
  -webkit-tap-highlight-color:transparent;
}

.app{
  width:100%;
  max-width:760px;
  min-height:100dvh;
  margin:auto;
  padding-bottom:104px;
  background:#fff;
}


/* CABECERA */

header{
  position:relative;
  z-index:20;

  display:grid;
  grid-template-columns:48px 1fr 48px;
  align-items:center;
  gap:12px;

  min-height:92px;

  padding:
    calc(14px + env(safe-area-inset-top))
    18px
    14px;

  background:rgba(255,255,255,.97);
  border-bottom:1px solid rgba(0,0,0,.06);
}

.icon-btn{
  width:46px;
  height:46px;

  display:flex;
  align-items:center;
  justify-content:center;

  color:#111;
  text-decoration:none;
}

.icon-btn svg{
  width:30px;
  height:40px;
  display:block;
}

.marca{
  min-width:0;
  display:flex;
  align-items:center;
  justify-content:center;
}

.marca a{
  display:flex;
  align-items:center;
  justify-content:center;
  text-decoration:none;
}

.marca img{
  width:min(100%,305px);
  max-height:65px;
  display:block;
  object-fit:contain;
}


/* SLIDER */


.menu-slider{
    position:relative;
    overflow:hidden;
}

.menu-slider::after{
    content:"";
    position:absolute;
    left:0;
    right:0;
    bottom:0;
    height:110px;
    pointer-events:none;
    background:linear-gradient(
        to top,
        rgba(0,0,0,.65) 0%,
        rgba(0,0,0,.35) 35%,
        rgba(0,0,0,.10) 70%,
        rgba(0,0,0,0) 100%
    );
    z-index:3;
}



main{background:#fff;}



.menu-slider{
  position:relative;
  width:100%;
  /* La placa ocupa toda la pantalla disponible hasta el menú verde inferior */
  height:calc(100dvh - 92px - 86px - env(safe-area-inset-top) - env(safe-area-inset-bottom));
  overflow:hidden;
  background:#111;
  touch-action:pan-y;
}

.menu-track{
  width:100%;
  height:100%;
  display:flex;
  transition:transform .55s cubic-bezier(.22,.72,.24,1);
}

.menu-slide{
  position:relative;
  min-width:100%;
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  background:#111;
}

.menu-slide img{
  width:100%;
  height:100%;
  display:block;
  object-fit:contain;
  object-position:center;
}


.puntos{
  position:absolute;
  left:0;
  right:0;
  bottom:20px;
  z-index:8;
  display:flex;
  justify-content:center;
  align-items:center;
  gap:9px;
}

.punto{
  width:13px;
  height:13px;

  padding:0;
  border:1px solid rgba(255,255,255,.95);
  border-radius:50%;

  background:rgba(255,255,255,.92);
  box-shadow:0 1px 5px rgba(0,0,0,.35);

  cursor:pointer;
  transition:transform .2s ease,background .2s ease;
}

.punto.activo{
  background:#ffd400;
  border-color:#ffd400;
  transform:scale(1.12);
}


.slider-indicadores{
    position:absolute;
    left:50%;
    bottom:18px;
    transform:translateX(-50%);
    display:flex;
    gap:10px;
    z-index:5;
}

.slider-indicadores span{
    width:11px;
    height:11px;
    border-radius:50%;
    background:#fff;
    opacity:.55;
    transition:.3s;
}

.slider-indicadores span.activo{
    opacity:1;
}



/* BOTÓN PRECIOS SOBRE EL SLIDER */
.btn-precios{
  position:absolute;
  left:50%;
  bottom:52px;
  transform:translateX(-50%);
  z-index:9;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  padding:10px 18px;
  color:#111;
  background:#fff;
  border-radius:12px;
    font-size:19px;
    font-weight:600;
  text-decoration:none;
  text-transform:uppercase;
  box-shadow:0 5px 16px rgba(0,0,0,.28);
  white-space:nowrap;
      margin-bottom: 80px;
}

/* PRECIOS BUFET */
.precios-bufet{padding:24px 14px 34px;background:#fff}
.precios-titulo{text-align:center;margin-bottom:18px}
.precios-titulo h2{font-size:21px;line-height:1.05;color:#111}
.precios-titulo p{margin-top:6px;font-size:13px;color:#666}
.lista-precios{display:grid;gap:18px}
.grupo-precios{overflow:hidden;border:1px solid #e8e8e8;border-radius:16px;background:#fff;box-shadow:0 5px 18px rgba(0,0,0,.06)}
.grupo-precios h3{padding:11px 15px;background:var(--verde);color:#fff;font-size:14px;text-transform:uppercase;letter-spacing:.4px}
.item-precio{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;padding:13px 15px;border-bottom:1px solid #ededed}
.item-precio:last-child{border-bottom:0}
.item-nombre{font-size:17px;font-weight:500;line-height:1.2}
.item-detalle{margin-top:3px;color:#6b6b6b;font-size:13px;line-height:1.3}
.item-valor{color:var(--verde);font-size:18px;font-weight:700;white-space:nowrap}
.estado-precios{padding:20px;text-align:center;background:#f5f5f5;border-radius:14px;color:#666;font-size:14px}

/* MENÚ INFERIOR */

nav{
  position:fixed;
  left:50%;
  bottom:0;
  transform:translateX(-50%);
  z-index:30;

  width:min(100%,760px);

  display:grid;
  grid-template-columns:repeat(6,minmax(0,1fr));

  padding:
    10px 0
    calc(8px + env(safe-area-inset-bottom));

  background:var(--verde);
}

.nav-item{
  min-width:0;
  min-height:68px;

  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;

  gap:8px;
  padding:4px 2px;

  color:#fff;
  text-decoration:none;
  text-align:center;
  text-transform:uppercase;

  font-size:13px;
  line-height:1;
  font-weight:700;
}

.nav-item img{
  width:40px;
  height:40px;

  display:block;
  object-fit:contain;

  filter:brightness(0) invert(1);
}

.nav-item span{
  width:100%;
  color:#fff;
  white-space:nowrap;
  font-size:9px;
}

.nav-item.activo img{
    filter:brightness(0) saturate(100%)
           invert(83%) sepia(91%) saturate(1128%)
           hue-rotate(8deg) brightness(104%) contrast(102%);
}

.nav-item.activo span{
    color:#F3DF00;
}


/* CELULAR */

@media(max-width:430px){

  header{
    grid-template-columns:43px 1fr 43px;
    padding-left:12px;
    padding-right:12px;
  }

  .nav-item img{
    width:30px;
    height:30px;
  }
}



/* NOTIFICACIONES */
.notificaciones-btn{position:relative}
.contador-notificaciones{
  position:absolute;
  top:3px;
  right:1px;
  min-width:20px;
  height:20px;
  padding:0 5px;
  display:flex;
  align-items:center;
  justify-content:center;
  border:2px solid #fff;
  border-radius:999px;
  color:#fff;
  background:#d71920;
  font-family:Arial,Helvetica,sans-serif;
  font-size:11px;
  line-height:1;
  font-weight:600;
}
.contador-notificaciones.oculto{display:none}

.panel-notificaciones{
  position:fixed;
  inset:0;
  z-index:120;
  visibility:hidden;
  opacity:0;
  background:rgba(0,0,0,.46);
  transition:.25s ease;
  font-family:Arial,Helvetica,sans-serif;
}
.panel-notificaciones.abierto{
  visibility:visible;
  opacity:1;
}
.notificaciones-contenido{
  position:absolute;
  top:0;
  right:0;
  width:min(92vw,420px);
  height:100%;
  display:flex;
  flex-direction:column;
  color:#171717;
  background:#f2f2f2;
  box-shadow:-12px 0 32px rgba(0,0,0,.22);
  transform:translateX(100%);
  transition:transform .3s ease;
}
.panel-notificaciones.abierto .notificaciones-contenido{
  transform:translateX(0);
}
.notificaciones-cabecera{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:16px;
  padding:calc(18px + env(safe-area-inset-top)) 18px 16px;
  color:#fff;
  background:#007d35;
}
.notificaciones-cabecera h2{
  margin:0;
  color:#fff;
  font-family:Arial,Helvetica,sans-serif;
  font-size:22px;
  line-height:1.2;
  font-weight:700;
  text-transform:none;
}
.cerrar-notificaciones{
  width:42px;
  height:42px;
  border:0;
  border-radius:14px;
  color:#fff;
  background:rgba(255,255,255,.14);
  font-size:30px;
  line-height:1;
  cursor:pointer;
}
.lista-notificaciones{
  flex:1;
  overflow-y:auto;
  padding:16px;
}
.notificacion{
  margin-bottom:12px;
  padding:18px;
  border:1px solid rgba(0,0,0,.07);
  border-radius:18px;
  color:#171717;
  background:#fff;
  box-shadow:0 6px 18px rgba(0,0,0,.06);
}
.notificacion h3{
  margin:0 0 7px;
  color:#111;
  font-family:Arial,Helvetica,sans-serif;
  font-size:20px;
  line-height:1.25;
  font-weight:700;
  text-transform:none;
}
.notificacion p{
  margin:0;
  color:#333;
  font-family:Arial,Helvetica,sans-serif;
  font-size:15px;
  line-height:1.5;
}
.notificacion-fecha{
  display:block;
  margin-top:10px;
  color:#777;
  font-size:12px;
  font-weight:700;
  text-transform:uppercase;
}
.notificacion-enlace{
  display:inline-flex;
  margin-top:13px;
  padding:10px 14px;
  border-radius:10px;
  color:#fff;
  background:#007d35;
  font-size:13px;
  font-weight:700;
  text-decoration:none;
  text-transform:uppercase;
}
.estado-notificaciones{
  padding:28px 18px;

  text-align:center;
  line-height:1.5;
}

<script>

const URL_DATOS =
  "https://script.google.com/macros/s/AKfycbydaB86Z3ByT8aSrmiznBOYx9FtFOF7yjplD3zzEK7jIvHAIHbjx1YZl1v4O3YcudUK/exec";

const hero = document.getElementById("menuSlider");
const heroTrack = document.getElementById("menuTrack");
const listaPrecios = document.getElementById("listaPrecios");

const slides = Array.from(
  document.querySelectorAll(".menu-slide")
);

const puntos = Array.from(
  document.querySelectorAll(".punto")
);

let slideActual = 0;
let temporizadorSlider;

function mostrarSlide(indice){

  const total = slides.length;

  slideActual =
    (indice + total) % total;

  heroTrack.style.transform =
    `translateX(-${slideActual * 100}%)`;

  puntos.forEach((punto, indicePunto) => {
    punto.classList.toggle(
      "activo",
      indicePunto === slideActual
    );
  });
}

function siguienteSlide(){
  mostrarSlide(slideActual + 1);
}

function iniciarAutomatico(){
  clearInterval(temporizadorSlider);

  temporizadorSlider =
    setInterval(siguienteSlide,10000);
}

puntos.forEach(punto => {

  punto.addEventListener("click",() => {

    mostrarSlide(
      Number(punto.dataset.slide)
    );

    iniciarAutomatico();
  });

});

hero.addEventListener(
  "touchstart",
  evento => {

    // No cambiar si se toca un botón o enlace
    if (evento.target.closest("a, button")) return;

    const rect = hero.getBoundingClientRect();
    const x = evento.touches[0].clientX - rect.left;

    if (x < rect.width / 2) {
      mostrarSlide(slideActual - 1);
    } else {
      mostrarSlide(slideActual + 1);
    }

    iniciarAutomatico();

  },
  { passive: true }
);


function escaparHTML(v=""){
  return String(v).replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;");
}
function formatearPrecio(v){
  const t=String(v??"").trim();
  if(!t) return "";
  if(t.startsWith("$")) return t;
  const n=Number(t.replace(/\./g,"").replace(",","."));
  return Number.isFinite(n) ? "$ "+n.toLocaleString("es-AR",{maximumFractionDigits:0}) : t;
}
function renderizarBufet(datos){
  const items=Array.isArray(datos?.bufet)?datos.bufet:[];
  if(!items.length){
    listaPrecios.innerHTML='<div class="estado-precios">No hay productos cargados por el momento.</div>';
    return;
  }
  const grupos=new Map();
  [...items].sort((a,b)=>(Number(a.orden)||999)-(Number(b.orden)||999)).forEach(p=>{
    const cat=String(p.categoria||"Otros").trim()||"Otros";
    if(!grupos.has(cat)) grupos.set(cat,[]);
    grupos.get(cat).push(p);
  });
  listaPrecios.innerHTML=[...grupos.entries()].map(([cat,productos])=>`
    <section class="grupo-precios">
      <h3>${escaparHTML(cat)}</h3>
      ${productos.map(p=>`
        <div class="item-precio">
          <div>
            <div class="item-nombre">${escaparHTML(p.item||"Producto")}</div>
            ${p.detalle?`<div class="item-detalle">${escaparHTML(p.detalle)}</div>`:""}
          </div>
          <div class="item-valor">${escaparHTML(formatearPrecio(p.precio))}</div>
        </div>`).join("")}
    </section>`).join("");
}
async function cargarBufet(){
  try{
    const r=await fetch(`${URL_DATOS}?t=${Date.now()}`,{cache:"no-store"});
    if(!r.ok) throw new Error(`HTTP ${r.status}`);
    renderizarBufet(await r.json());
  }catch(e){
    console.error(e);
    listaPrecios.innerHTML='<div class="estado-precios">No se pudieron cargar los precios del bufet.</div>';
  }
}

window.addEventListener("load",() => {
  iniciarAutomatico();
  cargarBufet();
});

setInterval(cargarBufet,60000);

</script>


<script>
(() => {
  const URL_NOTIFICACIONES =
    "https://script.google.com/macros/s/AKfycbwAZygEDd7if7oeF6jCFZOJeMsyEquTRW4xamKNyIhirIB18VUx034PQ7IJZeAjJWL8/exec";

  const CLAVE_NOTIFICACIONES_LEIDAS =
    "boulevard_notificaciones_leidas_v2";

  const abrir = document.getElementById("abrirNotificaciones");
  const cerrar = document.getElementById("cerrarNotificaciones");
  const panel = document.getElementById("panelNotificaciones");
  const lista = document.getElementById("listaNotificaciones");
  const contador = document.getElementById("contadorNotificaciones");

  if(!abrir || !cerrar || !panel || !lista || !contador) return;

  let notificacionesActuales = [];

  function notifEscaparHTML(valor=""){
    return String(valor)
      .replaceAll("&","&amp;")
      .replaceAll("<","&lt;")
      .replaceAll(">","&gt;")
      .replaceAll('"',"&quot;")
      .replaceAll("'","&#039;");
  }

  function crearIdNotificacion(item){
    if(
      item.idNotificacion !== undefined &&
      item.idNotificacion !== null &&
      String(item.idNotificacion).trim() !== ""
    ){
      return String(item.idNotificacion).trim();
    }

    if(
      item.id !== undefined &&
      item.id !== null &&
      String(item.id).trim() !== ""
    ){
      return String(item.id).trim();
    }

    return [
      item.titulo ?? item.Titulo ?? "",
      item.mensaje ?? item.Mensaje ?? item.descripcion ?? "",
      item.fecha ?? item.Fecha ?? "",
      item.enlace ?? item.Enlace ?? item.url ?? ""
    ].join("|").trim();
  }

  function obtenerIdsLeidos(){
    try{
      const guardados =
        JSON.parse(localStorage.getItem(CLAVE_NOTIFICACIONES_LEIDAS) || "[]");

      return new Set(
        Array.isArray(guardados)
          ? guardados.map(String)
          : []
      );
    }catch(error){
      console.warn("No se pudieron recuperar las notificaciones leídas:",error);
      return new Set();
    }
  }

  function guardarIdsLeidos(ids){
    try{
      localStorage.setItem(
        CLAVE_NOTIFICACIONES_LEIDAS,
        JSON.stringify(Array.from(ids))
      );
    }catch(error){
      console.warn("No se pudieron guardar las notificaciones leídas:",error);
    }
  }

  function actualizarContadorNoLeidas(){
    const idsLeidos = obtenerIdsLeidos();

    const cantidadNoLeidas =
      notificacionesActuales.filter(
        item => !idsLeidos.has(item.idNotificacion)
      ).length;

    contador.textContent = String(cantidadNoLeidas);
    contador.setAttribute(
      "aria-label",
      `${cantidadNoLeidas} notificaciones no leídas`
    );
    contador.classList.toggle("oculto",cantidadNoLeidas === 0);
  }

  function marcarNotificacionesComoLeidas(){
    if(notificacionesActuales.length === 0) return;

    const idsLeidos = obtenerIdsLeidos();

    notificacionesActuales.forEach(item => {
      idsLeidos.add(item.idNotificacion);
    });

    guardarIdsLeidos(idsLeidos);
    actualizarContadorNoLeidas();
  }

  function renderizarNotificaciones(datos){
    const base =
      Array.isArray(datos)
        ? datos
        : Array.isArray(datos.notificaciones)
          ? datos.notificaciones
          : [];

    notificacionesActuales = base
      .map(item => ({
        idNotificacion: crearIdNotificacion(item),
        titulo: item.titulo ?? item.Titulo ?? "Aviso",
        mensaje:
          item.mensaje ??
          item.Mensaje ??
          item.descripcion ??
          "",
        fecha: item.fecha ?? item.Fecha ?? "",
        enlace:
          item.enlace ??
          item.Enlace ??
          item.url ??
          "",
        activa:
          item.activa ??
          item.Activa ??
          item.publicar ??
          true
      }))
      .filter(item => {
        const activa = String(item.activa).trim().toLowerCase();
        return !["no","false","0","inactiva","inactivo"].includes(activa);
      });

    actualizarContadorNoLeidas();

    if(notificacionesActuales.length === 0){
      lista.innerHTML =
        '<p class="estado-notificaciones">No hay notificaciones nuevas.</p>';
      return;
    }

    lista.innerHTML =
      notificacionesActuales.map(item => {
        const enlace = item.enlace
          ? `
            <a class="notificacion-enlace"
              href="${notifEscaparHTML(item.enlace)}"
              target="_blank"
              rel="noopener">Ver más</a>
          `
          : "";

        const fecha = item.fecha
          ? `<span class="notificacion-fecha">${notifEscaparHTML(item.fecha)}</span>`
          : "";

        return `
          <article class="notificacion">
            <h3>${notifEscaparHTML(item.titulo)}</h3>
            <p>${notifEscaparHTML(item.mensaje)}</p>
            ${fecha}
            ${enlace}
          </article>
        `;
      }).join("");
  }

  async function cargarNotificaciones(){
    try{
      const respuesta =
        await fetch(`${URL_NOTIFICACIONES}?t=${Date.now()}`,{cache:"no-store"});

      if(!respuesta.ok){
        throw new Error(`HTTP ${respuesta.status}`);
      }

      renderizarNotificaciones(await respuesta.json());
      return true;

    }catch(error){
      console.error(error);
      lista.innerHTML =
        '<p class="estado-notificaciones">No se pudieron cargar las notificaciones.</p>';
      return false;
    }
  }

  async function abrirPanel(){
    panel.classList.add("abierto");
    abrir.setAttribute("aria-expanded","true");

    const cargaCorrecta = await cargarNotificaciones();

    if(cargaCorrecta){
      marcarNotificacionesComoLeidas();
    }
  }

  function cerrarPanel(){
    marcarNotificacionesComoLeidas();
    panel.classList.remove("abierto");
    abrir.setAttribute("aria-expanded","false");
  }

  abrir.addEventListener("click",abrirPanel);
  cerrar.addEventListener("click",cerrarPanel);

  panel.addEventListener("click",evento => {
    if(evento.target === panel){
      cerrarPanel();
    }
  });

  document.addEventListener("keydown",evento => {
    if(evento.key === "Escape" && panel.classList.contains("abierto")){
      cerrarPanel();
    }
  });

  cargarNotificaciones();
  setInterval(cargarNotificaciones,60000);
})();
</script>

</body>
