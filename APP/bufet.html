<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#086518">
<title>Bufet | Club Boulevard</title>

<style>
:root{
  --verde:#086518;
  --blanco:#ffffff;
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,
body{
  min-height:100%;
  background:#fff;
}

body{
  min-height:100dvh;
  font-family:Arial,Helvetica,sans-serif;
  color:#171717;
  overflow:hidden;
}

button,
a{
  -webkit-tap-highlight-color:transparent;
}

.app{
  width:100%;
  max-width:760px;
  height:100dvh;
  margin:auto;
  display:grid;
  grid-template-rows:auto minmax(0,1fr) auto;
  background:#fff;
}


/* CABECERA */

header{
  position:relative;
  z-index:20;

  display:grid;
  grid-template-columns:48px 1fr 48px;
  align-items:center;
  gap:12px;

  min-height:92px;

  padding:
    calc(14px + env(safe-area-inset-top))
    18px
    14px;

  background:rgba(255,255,255,.97);
  border-bottom:1px solid rgba(0,0,0,.06);
}

.icon-btn{
  width:46px;
  height:46px;

  display:flex;
  align-items:center;
  justify-content:center;

  color:#111;
  text-decoration:none;
}

.icon-btn svg{
  width:30px;
  height:40px;
  display:block;
}

.marca{
  min-width:0;
  display:flex;
  align-items:center;
  justify-content:center;
}

.marca a{
  display:flex;
  align-items:center;
  justify-content:center;
  text-decoration:none;
}

.marca img{
  width:min(100%,305px);
  max-height:65px;
  display:block;
  object-fit:contain;
}


/* SLIDER */


.menu-slider{
    position:relative;
    overflow:hidden;
}

.menu-slider::after{
    content:"";
    position:absolute;
    left:0;
    right:0;
    bottom:0;
    height:110px;
    pointer-events:none;
    background:linear-gradient(
        to top,
        rgba(0,0,0,.65) 0%,
        rgba(0,0,0,.35) 35%,
        rgba(0,0,0,.10) 70%,
        rgba(0,0,0,0) 100%
    );
    z-index:3;
}



main{
  min-height:0;
  overflow:hidden;
  background:#111;
}

.menu-slider{
  position:relative;
  width:100%;
  height:100%;
  min-height:0;
  overflow:hidden;
  background:#111;
  touch-action:pan-y;
}

.menu-track{
  width:100%;
  height:100%;
  display:flex;
  transition:transform .55s cubic-bezier(.22,.72,.24,1);
}

.menu-slide{
  position:relative;
  min-width:100%;
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  background:#111;
}

.menu-slide img{
  width:100%;
  height:100%;
  display:block;
  object-fit:contain;
  object-position:center;
}

.puntos{
  position:absolute;
  left:0;
  right:0;
  bottom:20px;
  z-index:8;
  display:flex;
  justify-content:center;
  align-items:center;
  gap:9px;
}

.punto{
  width:13px;
  height:13px;

  padding:0;
  border:1px solid rgba(255,255,255,.95);
  border-radius:50%;

  background:rgba(255,255,255,.92);
  box-shadow:0 1px 5px rgba(0,0,0,.35);

  cursor:pointer;
  transition:transform .2s ease,background .2s ease;
}

.punto.activo{
  background:#ffd400;
  border-color:#ffd400;
  transform:scale(1.12);
}


.slider-indicadores{
    position:absolute;
    left:50%;
    bottom:18px;
    transform:translateX(-50%);
    display:flex;
    gap:10px;
    z-index:5;
}

.slider-indicadores span{
    width:11px;
    height:11px;
    border-radius:50%;
    background:#fff;
    opacity:.55;
    transition:.3s;
}

.slider-indicadores span.activo{
    opacity:1;
}


/* MENÚ INFERIOR */

nav{
  position:relative;
  z-index:30;

  width:100%;

  display:grid;
  grid-template-columns:repeat(5,minmax(0,1fr));

  padding:
    10px 0
    calc(8px + env(safe-area-inset-bottom));

  background:var(--verde);
}

.nav-item{
  min-width:0;
  min-height:68px;

  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;

  gap:8px;
  padding:4px 2px;

  color:#fff;
  text-decoration:none;
  text-align:center;
  text-transform:uppercase;

  font-size:13px;
  line-height:1;
  font-weight:700;
}

.nav-item img{
  width:40px;
  height:40px;

  display:block;
  object-fit:contain;

  filter:brightness(0) invert(1);
}

.nav-item span{
  width:100%;
  color:#fff;
  white-space:nowrap;
  font-size:9px;
}

.nav-item.activo img{
  filter:brightness(0) invert(1) opacity(.55);
}

.nav-item.activo span{
  color:rgba(255,255,255,.55);
}


/* CELULAR */

@media(max-width:430px){

  header{
    grid-template-columns:43px 1fr 43px;
    padding-left:12px;
    padding-right:12px;
  }

  .nav-item img{
    width:36px;
    height:36px;
  }
}

</style>
</head>

<body>

<div class="app">

  <header>

    <a
      class="icon-btn"
      href="index.html"
      aria-label="Volver al inicio">

      <svg
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="3.5"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true">

        <path d="M15 5L8 12L15 19"/>

      </svg>

    </a>

    <div class="marca">
      <a href="index.html" aria-label="Ir al inicio">
        <img
          src="assets/logos/logo-torneo.png"
          alt="VI Torneo Nacional de Newcom 2026">
      </a>
    </div>

    <div aria-hidden="true"></div>

  </header>


  <main>

    <section
      id="menuSlider"
      class="menu-slider"
      aria-label="Placas del bufet">

      <div
        id="menuTrack"
        class="menu-track">

        <article class="menu-slide">
          <img
            src="assets/imagenes/bufet2.jpg"
            alt="Sándwich de milanesa con lechuga y tomate">
        </article>

        <article class="menu-slide">
          <img
            src="assets/imagenes/bufet3.jpg"
            alt="Pizza por porción">
        </article>

        <article class="menu-slide">
          <img
            src="assets/imagenes/bufet4.jpg"
            alt="Ensaladas variadas">
        </article>

        <article class="menu-slide">
          <img
            src="assets/imagenes/bufet5.jpg"
            alt="Guiso de lentejas">
        </article>

        <article class="menu-slide">
          <img
            src="assets/imagenes/bufet6.jpg"
            alt="Choripán">
        </article>

      </div>

      <div
        class="puntos"
        aria-label="Seleccionar placa">

        <button
          class="punto activo"
          type="button"
          data-slide="0"
          aria-label="Mostrar primera placa">
        </button>

        <button
          class="punto"
          type="button"
          data-slide="1"
          aria-label="Mostrar segunda placa">
        </button>

        <button
          class="punto"
          type="button"
          data-slide="2"
          aria-label="Mostrar tercera placa">
        </button>

        <button
          class="punto"
          type="button"
          data-slide="3"
          aria-label="Mostrar cuarta placa">
        </button>

           <button
          class="punto"
          type="button"
          data-slide="4"
          aria-label="Mostrar quinta placa">
        </button>

      </div>

    </section>

  </main>


  <nav aria-label="Navegación principal">

    <a
      class="nav-item activo"
      href="bufet.html">

      <img
        src="assets/iconos/menu.png"
        alt="">

      <span>BUFET</span>

    </a>

    <a
      class="nav-item"
      href="horarios.html">

      <img
        src="assets/iconos/horario.png"
        alt="">

      <span>HORARIOS</span>

    </a>

    <a
      class="nav-item"
      href="llaves.html">

      <img
        src="assets/iconos/llaves.png"
        alt="">

      <span>LLAVES</span>

    </a>

    <a
      class="nav-item"
      href="https://www.youtube.com/@flumediaTV"
      target="_blank"
      rel="noopener">

      <img
        src="assets/iconos/streaming.png"
        alt="">

      <span>STREAMING</span>

    </a>

    <a
      class="nav-item"
      href="alojamiento.html">

      <img
        src="assets/iconos/hotel.png"
        alt="">

      <span>ALOJAMIENTO</span>

    </a>

  </nav>

</div>


<script>

const hero = document.getElementById("menuSlider");
const heroTrack = document.getElementById("menuTrack");

const slides = Array.from(
  document.querySelectorAll(".menu-slide")
);

const puntos = Array.from(
  document.querySelectorAll(".punto")
);

let slideActual = 0;
let temporizadorSlider;

function mostrarSlide(indice){

  const total = slides.length;

  slideActual =
    (indice + total) % total;

  heroTrack.style.transform =
    `translateX(-${slideActual * 100}%)`;

  puntos.forEach((punto, indicePunto) => {
    punto.classList.toggle(
      "activo",
      indicePunto === slideActual
    );
  });
}

function siguienteSlide(){
  mostrarSlide(slideActual + 1);
}

function iniciarAutomatico(){
  clearInterval(temporizadorSlider);

  temporizadorSlider =
    setInterval(siguienteSlide,10000);
}

puntos.forEach(punto => {

  punto.addEventListener("click",() => {

    mostrarSlide(
      Number(punto.dataset.slide)
    );

    iniciarAutomatico();
  });

});

hero.addEventListener(
  "touchstart",
  evento => {

    // No cambiar si se toca un botón o enlace
    if (evento.target.closest("a, button")) return;

    const rect = hero.getBoundingClientRect();
    const x = evento.touches[0].clientX - rect.left;

    if (x < rect.width / 2) {
      mostrarSlide(slideActual - 1);
    } else {
      mostrarSlide(slideActual + 1);
    }

    iniciarAutomatico();

  },
  { passive: true }
);

window.addEventListener("load",() => {
  iniciarAutomatico();
});

</script>

</body>
</html>
