<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Partidos de hoy</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Oswald:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --amarillo:#f3df00;
  --verde-linea:rgba(183,255,78,.50);
  --panel-cancha:rgba(73,118,0,.90);
  --blanco:#fff;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html,
body{
  width:100%;
  min-height:100%;
  margin:0;
}

body{
  min-height:100vh;
  overflow-x:hidden;
}

body{
  position:relative;
  color:var(--blanco);
  font-family:'Oswald',Arial,sans-serif;

background-image:
  linear-gradient(
    90deg,
    rgba(0,0,0,.70) 0%,
    rgba(0,0,0,.48) 34%,
    rgba(0,0,0,.16) 70%,
    rgba(0,0,0,.06) 100%
  ),
  url(assets/imagenes/wallpaper.jpg);


  background-size:cover;
  background-position:center center;
  background-repeat:no-repeat;
  background-attachment:fixed;
}

body::after{
  content:"";
  position:absolute;
  inset:0;
  pointer-events:none;
  background:
    radial-gradient(circle at 83% 48%,rgba(185,255,0,.10),transparent 35%),
    linear-gradient(180deg,rgba(0,0,0,.03),rgba(0,0,0,.18));
  z-index:0;
}

.pantalla{
  position:relative;
  z-index:1;
  width:100%;
  height:100%;
  padding:48px 84px 54px;
  display:flex;
  flex-direction:column;
}

.encabezado{
  height:205px;
  display:grid;
  grid-template-columns:560px 1fr;
  align-items:center;
}

.bloque-titulo{
  min-width:0;
  display:flex;
  flex-direction:column;
  align-items:flex-start;
  justify-content:center;
}

.titulo-linea{
  width:100%;
  display:flex;
  align-items:flex-end;
  justify-content:flex-start;
  gap:28px;
}

.titulo{
  margin:0;
  flex:none;
}

.dia-partidos{
  margin:0;
  font-family:'Oswald',Arial,sans-serif;
  font-size:42px;
  line-height:1;
  font-weight:300;
  letter-spacing:1px;
  color:var(--amarillo);
  white-space:nowrap;
}

.marca{
  display:flex;
  align-items:center;
  min-width:0;
}

.logo-torneo{
  width:400px;
  max-height:145px;
  object-fit:contain;
  object-position:left center;
  filter:drop-shadow(0 4px 12px rgba(0,0,0,.55));
}

.titulo{
  font-family:'Oswald',Arial,sans-serif;
  font-size:92px;
  line-height:.96;
  font-weight:600;
  letter-spacing:1px;
  text-align:left;
  color:#fff;
  text-transform:uppercase;
  text-shadow:0 5px 18px rgba(0,0,0,.62);
}

.contenido{
  flex:1;
  min-height:0;
  display:grid;
  grid-template-columns:1fr 305px;
  padding-top:66px;
}

.lista-partidos{
  padding-left:38px;
  min-height:0;
}

.cabecera-sets{
  display:grid;
  grid-template-columns:
    125px
    minmax(0,1fr)
    42px
    42px
    42px
    minmax(0,1fr)
    42px
    42px
    42px;
  align-items:end;
  height:28px;
}

.cabecera-sets > div{
  display:flex;
  align-items:flex-end;
  justify-content:center;
  height:100%;
  font-size:22px;
  line-height:1;
  font-weight:500;
  color:#ff4747;
}

.cabecera-sets .titulo-tb{
  padding-bottom:5px;
}

.filas{
  height:calc(100% - 28px);
  display:grid;
  align-content:stretch;
}

.fila{
  display:grid;
grid-template-columns:
125px
1fr
42px
42px
42px
1fr
42px
42px
42px;
 align-items:center;
  min-height:58px;     /* antes 0 */
  padding:6px 0;        /* espacio vertical */
  border-bottom:1px solid var(--verde-linea);
}

.marcador{
  display:flex;
  align-items:center;
  justify-content:center;
  min-width:0;
  font-size:27px;
  line-height:1;
  font-weight:400;
  color:rgba(255,255,255,.92);
}

.marcador.ganado{
  color:var(--amarillo);
  font-weight:500;
}

.marcador.tb{
  position:relative;
  background:rgba(0, 61, 3, 0.652);
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
}

.fila:last-child{
  border-bottom:none;
}

.hora{
  height:100%;
  display:flex;
  align-items:center;
  padding-right:28px;
  border-right:1px solid rgba(190,255,80,.55);
  font-size:30px;
  font-weight:400;
  color:#fff;
  white-space:nowrap;
}

.equipo{
  min-width:0;
  padding:0 24px;
  font-size:35px;
  line-height:1;
  font-weight:300;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.equipo.ganador{
  color:var(--amarillo);
  font-weight:400;
  text-shadow:0 0 12px rgba(243,223,0,.22);
}


.panel-canchas{
  position:relative;
  overflow:hidden;
  background:var(--panel-cancha);
  border-left:1px solid rgba(220,255,140,.30);
}

.panel-canchas::before{
  content:"CANCHAS";
  position:absolute;
  right:-90px;
  top:calc(50% + 14px);
  transform:translateY(-50%) rotate(-90deg);
  font-family:'Bebas Neue',Impact,sans-serif;
  font-size:250px;
  letter-spacing:6px;
  color:rgba(255,255,255,.07);
  pointer-events:none;
}

.cabecera-cancha{
  position:relative;
  z-index:2;
  height:28px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:var(--panel-cancha);
  border-bottom:1px solid rgba(255,255,255,.22);
  font-size:22px;
  line-height:1;
  font-weight:500;
  color:#fff;
  text-transform:uppercase;
}

.canchas{
  position:relative;
  z-index:1;
  height:calc(100% - 28px);
  display:grid;
}

.cancha{
  display:flex;
  align-items:center;
  justify-content:center;
  border-bottom:1px solid rgba(255,255,255,.22);
  font-size:30px;
  font-weight:500;
}

.cancha:last-child{
  border-bottom:none;
}

.sin-datos{
  display:flex;
  align-items:center;
  justify-content:center;
  height:100%;
  font-size:34px;
  font-weight:500;
  color:#fff;
}

.estado-carga{
  margin-top:16px;

  display:flex;
  align-items:center;
  justify-content:flex-start;
  gap:8px;

  width:100%;
  font-size:25px;
  line-height:1;
  font-weight:300;
  color:rgba(249,228,228,.82);
  white-space:nowrap;
}

.en-vivo{
  display:inline-flex;
  align-items:center;
  gap:8px;
  color:#ff3030;
  font-weight:500;
}

.en-vivo::before{
  content:"";
  width:10px;
  height:10px;
  border-radius:50%;
  background:#ff3030;
  flex:none;
  animation:live 1.2s infinite;
}

@keyframes live{
  0%{
    opacity:1;
    transform:scale(1);
  }

  50%{
    opacity:.35;
    transform:scale(.8);
  }

  100%{
    opacity:1;
    transform:scale(1);
  }
}

/* CELULAR */
@media (max-width:767px){

  body{
    min-height:100svh;

    background-size:cover;

    /*
    Mueve el encuadre para mostrar mejor
    la parte derecha de la imagen.
    */
    background-position:72% center;

    /*
    En celulares suele funcionar mejor
    sin background-attachment fixed.
    */
    background-attachment:scroll;
  }

  .pantalla{
    width:100%;
    min-height:100svh;
    height:auto;
    padding:20px 16px 30px;
  }
}


/* ========================================
   CELULAR
======================================== */

@media (max-width:767px){

  html,
  body{
    width:100%;
    min-height:100%;
    height:auto;
    overflow-x:hidden;
  }

  body{
    min-height:100svh;
    background-size:cover;
    background-position:center top;
    background-attachment:scroll;
  }

  .pantalla{
    width:100%;
    min-height:100svh;
    height:auto;
    padding:14px 12px 24px;
  }

  /* ENCABEZADO */

  .encabezado{
    height:auto;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:10px;
    padding-bottom:14px;
  }

  .marca{
    width:100%;
    justify-content:center;
  }

  .logo-torneo{
    width:min(100%,200px);
    max-height:none;
    object-position:center;
  }

  .bloque-titulo{
    width:100%;
    align-items:center;
  }

.titulo{
    width:auto;
    flex:none;
    margin:0;
    font-size:30px;
    text-align:center;
    line-height:1;
}

  .estado-carga{
    margin-top:7px;
    justify-content:center;
    font-size:16px;
  }

  .en-vivo::before{
    width:7px;
    height:7px;
  }

  /* PARTIDOS + CANCHAS AL COSTADO */

  .contenido{
    display:grid;
    grid-template-columns:minmax(0,1fr) 46px;
    gap:0;
    padding-top:14px;
  }

  .lista-partidos{
    min-width:0;
    padding-left:0;
  }

  .filas{
    height:auto;
    display:grid;
  }

  .cabecera-sets{
    grid-template-columns:
      58px
      minmax(0,1fr)
      20px
      20px
      20px
      minmax(0,1fr)
      20px
      20px
      20px;
    height:20px;
  }

  .cabecera-sets > div{
    font-size:11px;
  }

  .cabecera-sets .titulo-tb{
    padding-bottom:3px;
  }

  .filas{
    height:auto;
  }

  .fila{
    display:grid;
    grid-template-columns:
      58px
      minmax(0,1fr)
      20px
      20px
      20px
      minmax(0,1fr)
      20px
      20px
      20px;
    min-height:68px;
    align-items:center;
  }

  .marcador{
    font-size:16px;
  }

  .hora{
    padding-right:8px;
    font-size:18px;
    justify-content:flex-start;
  }

  .equipo{
    min-width:0;
    padding:0 7px;
    font-size:16px;
    line-height:1.05;
    white-space:normal;
    overflow:hidden;
    text-overflow:ellipsis;
  }


  /* COLUMNA CANCHA */

  .panel-canchas{
    width:42px;
    height:auto;
    margin:0;
    clip-path:none;
    border-left:1px solid rgba(220,255,140,.35);
    background:rgba(73,118,0,.88);
  }

  .panel-canchas::before{
    display:none;
  }

  .cabecera-cancha{
    height:20px;
    font-size:9px;
    letter-spacing:.2px;
  }

  .canchas{
    height:auto;
    display:grid;
  }

.cancha{
    min-height:68px;   
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:20px;
    font-weight:400;
    border-bottom:1px solid rgba(255,255,255,.22);
}

.titulo-linea{
    width:100%;
    display:flex;
    justify-content:center;
    align-items:flex-end;
    gap:10px;
}

.dia-partidos{
    margin:0;
    flex:none;

    font-family:'Oswald',sans-serif;
    font-size:18px;
    line-height:1;
    font-weight:400;
    letter-spacing:.5px;

    color:var(--amarillo);
    white-space:nowrap;
}



}




</style>
</head>

<body>

<div class="pantalla">

  <header class="encabezado">
    <div class="marca">
      <img
        class="logo-torneo"
        src="assets/logos/logo_color2.png"
        alt="VI Torneo Nacional de Newcom">
    </div>

    <div class="bloque-titulo">

 <div class="titulo-linea">

  <h1 id="tituloPantalla" class="titulo">
    PARTIDOS DE HOY
  </h1>

  <div id="diaPartidos" class="dia-partidos">
    FECHA
  </div>

</div>

<div id="estadoCarga" class="estado-carga">
  ACTUALIZACIÓN: <span class="en-vivo">EN VIVO</span>
</div>
    
  </header>

  <main class="contenido">

    <section class="lista-partidos">

      <div class="cabecera-sets" aria-hidden="true">
        <div></div>
        <div></div>
        <div></div>
        <div></div>
        <div class="titulo-tb">TB</div>

        <div></div>
        <div></div>
        <div></div>
        <div class="titulo-tb">TB</div>
      </div>

      <div id="filas" class="filas"></div>
    </section>

    <aside class="panel-canchas">
      <div class="cabecera-cancha">CANCHA</div>
      <div id="canchas" class="canchas"></div>
    </aside>

  </main>

</div>

<script>
/*
HOJA: PARTIDOS_HOY

Columnas:
hora | cancha | equipo_local | S1 | S2 | TB |
equipo_visitante | S1 | S2 | TB
*/

const URL_JSON =
"https://script.google.com/macros/s/AKfycbxhM6bJYG2h38P5d8-JPy4gzr2xaBqyJo5sdOGwmNqZCiv9qXEmT3xHi3LAroUh2ca8/exec";

const ACTUALIZAR_CADA_MS = 5000;
const MAX_PARTIDOS = 12;

function limpiar(valor){
  return String(valor ?? "").trim();
}



function numero(valor){
  const limpio = limpiar(valor);
  if(limpio === "") return null;

  const n = Number(limpio.replace(",","."));
  return Number.isFinite(n) ? n : null;
}

function datosResultado(p){
  const sets = [
    {
      local:numero(p.s1_local),
      visitante:numero(p.s1_visitante),
      tipo:"s1"
    },
    {
      local:numero(p.s2_local),
      visitante:numero(p.s2_visitante),
      tipo:"s2"
    },
    {
      local:numero(p.tb_local),
      visitante:numero(p.tb_visitante),
      tipo:"tb"
    }
  ];

  let ganadosLocal = 0;
  let ganadosVisitante = 0;

  sets.forEach(set => {
    if(set.local === null || set.visitante === null) return;

    if(set.local > set.visitante) ganadosLocal++;
    if(set.visitante > set.local) ganadosVisitante++;
  });

  let ganador = "";

  if(ganadosLocal >= 2 && ganadosLocal > ganadosVisitante){
    ganador = "local";
  }

  if(ganadosVisitante >= 2 && ganadosVisitante > ganadosLocal){
    ganador = "visitante";
  }

  return {sets,ganador};
}

function claseMarcador(set,lado){
  const rival = lado === "local" ? "visitante" : "local";
  const clases = ["marcador"];

  if(
    set[lado] !== null &&
    set[rival] !== null &&
    set[lado] > set[rival]
  ){
    clases.push("ganado");
  }

  if(set.tipo === "tb"){
    clases.push("tb");
  }

  return clases.join(" ");
}

function valorMarcador(set,lado){
  return set[lado] === null ? "" : set[lado];
}

function renderizar(partidos){
  const filas = document.getElementById("filas");
  const canchas = document.getElementById("canchas");

const visibles = partidos.slice(0,MAX_PARTIDOS);

  if(!visibles.length){
    filas.innerHTML = '<div class="sin-datos">NO HAY PARTIDOS CARGADOS</div>';
    canchas.innerHTML = "";
    return;
  }

  filas.style.gridTemplateRows = `repeat(${visibles.length},1fr)`;
  canchas.style.gridTemplateRows = `repeat(${visibles.length},1fr)`;

  filas.innerHTML = visibles.map(p => {
    const resultado = datosResultado(p);
    const [s1,s2,tb] = resultado.sets;

    return `
      <article class="fila">

        <div class="hora">${limpiar(p.hora)}</div>

        <div class="equipo ${resultado.ganador === "local" ? "ganador" : ""}">
          ${limpiar(p.equipo_local)}
        </div>

        <div class="${claseMarcador(s1,"local")}">${valorMarcador(s1,"local")}</div>
        <div class="${claseMarcador(s2,"local")}">${valorMarcador(s2,"local")}</div>
        <div class="${claseMarcador(tb,"local")}">${valorMarcador(tb,"local")}</div>

      

        <div class="equipo ${resultado.ganador === "visitante" ? "ganador" : ""}">
          ${limpiar(p.equipo_visitante)}
        </div>

        <div class="${claseMarcador(s1,"visitante")}">${valorMarcador(s1,"visitante")}</div>
        <div class="${claseMarcador(s2,"visitante")}">${valorMarcador(s2,"visitante")}</div>
        <div class="${claseMarcador(tb,"visitante")}">${valorMarcador(tb,"visitante")}</div>

      </article>
    `;
  }).join("");

  canchas.innerHTML = visibles.map(p => `
    <div class="cancha">${limpiar(p.cancha)}</div>
  `).join("");
}

async function cargar(){
  const estadoCarga = document.getElementById("estadoCarga");

  try{
    const separador = URL_JSON.includes("?") ? "&" : "?";
    const respuesta = await fetch(
      URL_JSON + separador + "nocache=" + Date.now(),
      {cache:"no-store"}
    );

    if(!respuesta.ok){
      throw new Error("HTTP " + respuesta.status);
    }

    const data = await respuesta.json();

    if(data.config?.titulo_partidos){
      document.getElementById("tituloPantalla").textContent =
        limpiar(data.config.titulo_partidos).toUpperCase();
    }

if (data.config?.dia_hoy) {

    const fecha = new Date(data.config.dia_hoy);

    const dias = [
        "DOMINGO",
        "LUNES",
        "MARTES",
        "MIÉRCOLES",
        "JUEVES",
        "VIERNES",
        "SÁBADO"
    ];

    const texto =
        dias[fecha.getDay()] + " " +
        String(fecha.getDate()).padStart(2,"0");

    document.getElementById("diaPartidos").textContent = texto;
}

    const partidos =
      Array.isArray(data.partidos_hoy) ? data.partidos_hoy :
      Array.isArray(data.partidosHoy) ? data.partidosHoy :
      Array.isArray(data.partidos) ? data.partidos :
      [];

    renderizar(partidos);


  }catch(error){
    console.error("Error al cargar los partidos:",error);

    document.getElementById("filas").innerHTML =
      '<div class="sin-datos">ERROR AL CARGAR LOS DATOS</div>';

    document.getElementById("canchas").innerHTML = "";

    estadoCarga.textContent =
      "Revisar URL de Apps Script";
  }
}

cargar();
setInterval(cargar,ACTUALIZAR_CADA_MS);
</script>

</body>
</html>
