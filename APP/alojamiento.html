<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta
  name="theme-color"
  content="#086518">

<title>Alojamiento | Club Boulevard</title>

<style>

:root{
  --verde:#007d35;
  --verde2:#005a27;
  --negro:#111;
  --gris:#f2f2f2;
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  min-height:100dvh;
  font-family:Arial,Helvetica,sans-serif;
  background:#fff;
  color:#171717;
}

a{
  -webkit-tap-highlight-color:transparent;
}

.app{
  width:100%;
  max-width:760px;
  min-height:100dvh;
  margin:auto;
  padding-bottom:116px;
}


/* HEADER */

header{
  position:sticky;
  top:0;
  z-index:20;

  display:grid;
  grid-template-columns:48px 1fr 48px;
  align-items:center;
  gap:12px;

  min-height:92px;

  padding:
    calc(14px + env(safe-area-inset-top))
    18px
    14px;

  background:rgba(255,255,255,.95);
  border-bottom:1px solid rgba(0,0,0,.06);

  backdrop-filter:blur(14px);
}

.icon-btn{
  width:46px;
  height:46px;

  display:flex;
  align-items:center;
  justify-content:center;

  border-radius:15px;

  color:#111;
  text-decoration:none;
}

.icon-btn svg{
  width:30px;
  height:30px;
}

.marca{
  display:flex;
  align-items:center;
  justify-content:center;
  min-width:0;
}

.marca img{
  width:min(100%,305px);
  max-height:65px;
  object-fit:contain;
}


/* CONTENIDO */

main{
  padding:22px 16px 28px;
}

.encabezado-pagina{
  margin-bottom:22px;
  text-align:center;
}

.encabezado-pagina h1{
  font-size:clamp(28px,7vw,40px);
  line-height:1;
  text-transform:uppercase;
}

.encabezado-pagina p{
  max-width:590px;
  margin:12px auto 0;

  color:#555;

  font-size:15px;
  line-height:1.5;
}


/* ALOJAMIENTOS */

.lista-alojamientos{
  display:grid;
  gap:20px;
}

.alojamiento-card{
  overflow:hidden;

  border:1px solid rgba(0,0,0,.07);
  border-radius:24px;

  background:#fff;

  box-shadow:0 10px 28px rgba(0,0,0,.09);
}

.alojamiento-imagen{
  width:100%;
  aspect-ratio:16/10;

  overflow:hidden;

  background:#e7e7e7;
}

.alojamiento-imagen img{
  width:100%;
  height:100%;

  display:block;

  object-fit:cover;
}

.sin-imagen{
  width:100%;
  height:100%;

  display:flex;
  align-items:center;
  justify-content:center;

  color:#666;

  background:
    linear-gradient(
      145deg,
      #ececec,
      #d8d8d8
    );
}

.sin-imagen svg{
  width:64px;
  height:64px;
}

.alojamiento-contenido{
  padding:22px;
}

.alojamiento-card h2{
  font-size:25px;
  line-height:1.15;
}

.alojamiento-descripcion{
  margin-top:11px;

  color:#3b3b3b;

  font-size:16px;
  line-height:1.55;
}

.alojamiento-datos{
  display:grid;
  gap:10px;

  margin-top:18px;
}

.alojamiento-dato{
  display:flex;
  align-items:flex-start;
  gap:10px;

  color:#333;

  font-size:15px;
  line-height:1.4;
}

.alojamiento-dato svg{
  width:21px;
  height:21px;

  flex:none;

  margin-top:1px;

  color:var(--verde);
}


/* BOTONES */

.alojamiento-acciones{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;

  margin-top:20px;
}

.alojamiento-accion{
  min-height:48px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  padding:10px 8px;
  border-radius:12px;
  color:#fff;
  background:#60a46a;
  font-size:16px;
  font-weight:700;
  text-decoration:none;
  text-align:center;
}

.alojamiento-accion:hover,
.alojamiento-accion:focus{
  background:#518e5b;
  outline:none;
}

.alojamiento-accion svg{
  width:22px;
  height:22px;
  flex:none;
}

.alojamiento-accion.secundaria{
  color:#fff;
  background:#3b3b3b;
}

.alojamiento-accion.secundaria:hover,
.alojamiento-accion.secundaria:focus{
  background:#333;
}

.nav-item{
    transition:.25s;
}

.nav-item img{
    filter:brightness(0) invert(1);
}

.nav-item span{
    color:#fff;
}

/* BOTÓN ACTIVO */

.nav-item.activo img{
    filter:brightness(0) saturate(100%)
           invert(83%) sepia(91%) saturate(1128%)
           hue-rotate(8deg) brightness(104%) contrast(102%);
}

.nav-item.activo span{
    color:#F3DF00;
}



/* ESTADO DE CARGA */

.estado{
  padding:40px 22px;

  border:1px solid rgba(0,0,0,.07);
  border-radius:22px;

  color:#555;
  background:#f7f7f7;

  text-align:center;
  line-height:1.5;
}


/* NAVEGACIÓN INFERIOR */

nav{
  position:fixed;
  left:50%;
  bottom:0;

  transform:translateX(-50%);

  z-index:30;

  width:min(100%,760px);

  display:grid;
  grid-template-columns:repeat(5,1fr);

  padding:
    10px 0
    calc(8px + env(safe-area-inset-bottom));

  background:#086518;
}

.nav-item{
  min-width:0;
  min-height:68px;

  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;

  gap:8px;

  padding:4px 2px;

  color:#fff;

  text-decoration:none;
  text-align:center;
  text-transform:uppercase;

  font-size:13px;
  font-weight:700;
}

.nav-item img{
  width:40px;
  height:40px;

  object-fit:contain;
  filter:brightness(0) invert(1);
}

.nav-item span{
  width:100%;

  color:#fff;

  white-space:nowrap;

  font-size:9px;
}


/* CELULAR */

@media(max-width:430px){

  header{
    grid-template-columns:43px 1fr 43px;

    padding-left:12px;
    padding-right:12px;
  }

  .alojamiento-contenido{
    padding:19px;
  }

  .alojamiento-card h2{
    font-size:23px;
  }

  .alojamiento-acciones{
    grid-template-columns:repeat(2,1fr);
  }

  .alojamiento-accion{
    min-height:46px;

    padding:9px 5px;

    font-size:14px;
  }

  .alojamiento-accion svg{
    width:20px;
    height:20px;
  }

  .nav-item img{
    width:36px;
    height:36px;
  }

}

</style>

</head>

<body>

<div class="app">

  <header>

    <a
      class="icon-btn"
      href="index.html"
      aria-label="Volver al inicio">

      <svg
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2.2"
        stroke-linecap="round"
        stroke-linejoin="round">

        <path d="M19 12H5"/>
        <path d="M12 19l-7-7 7-7"/>

      </svg>

    </a>

 <div class="marca">
    <a href="index.html" aria-label="Ir al inicio">
        <img
            src="assets/logos/logo-torneo.png"
            alt="VI Torneo Nacional de Newcom 2026">
    </a>
</div>

    <div aria-hidden="true"></div>

  </header>


  <main>

    <section class="encabezado-pagina">

      <p>
        Las reservas deben gestionarse directamente con cada
        establecimiento.
      </p>

    </section>


    <section
      id="listaAlojamientos"
      class="lista-alojamientos">

      <div class="estado">
        Cargando alojamientos…
      </div>

    </section>

  </main>


  <nav aria-label="Navegación principal">

    <a
      class="nav-item"
      href="bufet.html">

      <img
        src="assets/iconos/menu.png"
        alt="">

      <span>BUFET</span>

    </a>


    <a
      class="nav-item"
      href="horarios.html">

      <img
        src="assets/iconos/horario.png"
        alt="">

      <span>HORARIOS</span>

    </a>


    <a
      class="nav-item"
      href="llaves.html">

      <img
        src="assets/iconos/llaves.png"
        alt="">

      <span>LLAVES</span>

    </a>


    <a
      class="nav-item"
      href="llave60.html">

      <img
        src="assets/iconos/streaming.png"
        alt="">

      <span>STREAMING</span>

    </a>


 <a class="nav-item activo" href="alojamiento.html">
    <img src="assets/iconos/hotel.png" alt="">
    <span>ALOJAMIENTO</span>
</a>

  </nav>

</div>


<script>

const URL_DATOS =
  "https://script.google.com/macros/s/AKfycbydaB86Z3ByT8aSrmiznBOYx9FtFOF7yjplD3zzEK7jIvHAIHbjx1YZl1v4O3YcudUK/exec";


const listaAlojamientos =
  document.getElementById("listaAlojamientos");


function escaparHTML(valor = ""){

  return String(valor)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


function limpiarTelefono(valor = ""){

  return String(valor)
    .replace(/[^\d+]/g,"");

}


function plantillaSinImagen(){

  return `
    <div
      class="sin-imagen"
      aria-hidden="true">

      <svg
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.7"
        stroke-linecap="round"
        stroke-linejoin="round">

        <path d="M3 21h18"/>
        <path d="M5 21V9l7-5 7 5v12"/>
        <path d="M9 21v-6h6v6"/>

      </svg>

    </div>
  `;

}


function renderizarAlojamientos(datos){

  const alojamientos =
    Array.isArray(datos)
      ? datos
      : Array.isArray(datos.alojamientos)
        ? datos.alojamientos
        : [];


  if(alojamientos.length === 0){

    listaAlojamientos.innerHTML = `
      <div class="estado">
        No hay alojamientos cargados por el momento.
      </div>
    `;

    return;

  }


  listaAlojamientos.innerHTML =
    alojamientos.map(a => {

      const nombre =
        a.nombre || "Alojamiento";


      const imagen =
        a.imagen
          ? `
            <img
              src="${escaparHTML(a.imagen)}"
              alt="${escaparHTML(nombre)}"
              loading="lazy"
              onerror="this.parentElement.innerHTML=plantillaSinImagen()">
          `
          : plantillaSinImagen();


      const descripcion =
        a.descripcion
          ? `
            <p class="alojamiento-descripcion">
              ${escaparHTML(a.descripcion)}
            </p>
          `
          : "";


      const direccion =
        a.direccion
          ? `
            <div class="alojamiento-dato">

              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round">

                <path
                  d="M20 10c0 5-8 11-8 11S4 15 4 10a8 8 0 1 1 16 0z"/>

                <circle
                  cx="12"
                  cy="10"
                  r="2.5"/>

              </svg>

              <span>
                ${escaparHTML(a.direccion)}
              </span>

            </div>
          `
          : "";


      const distancia =
        a.distancia
          ? `
            <div class="alojamiento-dato">

              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round">

                <path d="M4 17l5-5 4 4 7-7"/>
                <path d="M14 9h6v6"/>

              </svg>

              <span>
                ${escaparHTML(a.distancia)} del Club Boulevard
              </span>

            </div>
          `
          : "";


      const telefono =
        limpiarTelefono(a.telefono);


      const botonLlamar =
        telefono
          ? `
            <a
              class="alojamiento-accion"
              href="tel:${escaparHTML(telefono)}">

              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true">

                <path
                  d="M22 16.92v3
                     a2 2 0 0 1-2.18 2
                     19.79 19.79 0 0 1-8.63-3.07
                     19.5 19.5 0 0 1-6-6
                     19.79 19.79 0 0 1-3.07-8.67
                     A2 2 0 0 1 3.89 2h3
                     a2 2 0 0 1 2 1.72
                     c.12.9.33 1.78.62 2.63
                     a2 2 0 0 1-.45 2.11
                     L7.91 9.91
                     a16 16 0 0 0 6 6
                     l1.45-1.15
                     a2 2 0 0 1 2.11-.45
                     c.85.29 1.73.5 2.63.62
                     A2 2 0 0 1 22 16.92z"/>

              </svg>

              <span>Llamar</span>

            </a>
          `
          : "";


      const botonMapa =
  a.mapa
    ? `
      <a
        class="alojamiento-accion secundaria"
        href="${escaparHTML(a.mapa)}"
        target="_blank"
        rel="noopener">

        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true">

          <path
            d="M20 10c0 5-8 11-8 11S4 15 4 10a8 8 0 1 1 16 0z"/>

          <circle
            cx="12"
            cy="10"
            r="3"/>

        </svg>

        <span>Cómo llegar</span>

      </a>
    `
    : "";


      return `
        <article class="alojamiento-card">

          <div class="alojamiento-imagen">
            ${imagen}
          </div>

          <div class="alojamiento-contenido">

            <h2>
              ${escaparHTML(nombre)}
            </h2>

            ${descripcion}

            <div class="alojamiento-datos">
              ${direccion}
              ${distancia}
            </div>

            <div class="alojamiento-acciones">
              ${botonLlamar}
              ${botonMapa}
            </div>

          </div>

        </article>
      `;

    }).join("");

}


async function cargarAlojamientos(){

  try{

    const respuesta =
      await fetch(
        `${URL_DATOS}?t=${Date.now()}`,
        {
          cache:"no-store"
        }
      );


    if(!respuesta.ok){

      throw new Error(
        `HTTP ${respuesta.status}`
      );

    }


    const datos =
      await respuesta.json();


    renderizarAlojamientos(datos);


  }catch(error){

    console.error(error);


    listaAlojamientos.innerHTML = `
      <div class="estado">
        No se pudieron cargar los alojamientos.
      </div>
    `;

  }

}


cargarAlojamientos();

</script>

</body>

</html>
