<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta
  name="theme-color"
  content="#086518">

<title>Alojamiento | Club Boulevard</title>

<style>

:root{
  --verde:#007d35;
  --verde2:#005a27;
  --negro:#111;
  --gris:#f2f2f2;
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  min-height:100dvh;
  font-family:Arial,Helvetica,sans-serif;
  background:#fff;
  color:#171717;
}

a{
  -webkit-tap-highlight-color:transparent;
}

.app{
  width:100%;
  max-width:760px;
  min-height:100dvh;
  margin:auto;
  padding-bottom:116px;
}


/* HEADER */

header{
  position:sticky;
  top:0;
  z-index:20;

  display:grid;
  grid-template-columns:48px 1fr 48px;
  align-items:center;
  gap:12px;

  min-height:92px;

  padding:
    calc(14px + env(safe-area-inset-top))
    18px
    14px;

  background:rgba(255,255,255,.95);
  border-bottom:1px solid rgba(0,0,0,.06);

  backdrop-filter:blur(14px);
}

.icon-btn{
  width:46px;
  height:46px;

  display:flex;
  align-items:center;
  justify-content:center;

  border-radius:15px;

  color:#111;
  text-decoration:none;
}

.icon-btn svg{
  width:30px;
  height:30px;
}

.marca{
  display:flex;
  align-items:center;
  justify-content:center;
  min-width:0;
}

.marca img{
  width:min(100%,305px);
  max-height:65px;
  object-fit:contain;
}


/* CONTENIDO */

main{
  padding:22px 16px 28px;
}

.encabezado-pagina{
  margin-bottom:22px;
  text-align:center;
}

.encabezado-pagina h1{
  font-size:clamp(28px,7vw,40px);
  line-height:1;
  text-transform:uppercase;
}

.encabezado-pagina p{
  max-width:590px;
  margin:12px auto 0;

  color:#555;

  font-size:15px;
  line-height:1.5;
}


/* ALOJAMIENTOS */

.lista-alojamientos{
  display:grid;
  gap:20px;
}

.alojamiento-card{
  overflow:hidden;

  border:1px solid rgba(0,0,0,.07);
  border-radius:24px;

  background:#fff;

  box-shadow:0 10px 28px rgba(0,0,0,.09);
}

.alojamiento-imagen{
  width:100%;
  aspect-ratio:16/10;

  overflow:hidden;

  background:#e7e7e7;
}

.alojamiento-imagen img{
  width:100%;
  height:100%;

  display:block;

  object-fit:cover;
}

.sin-imagen{
  width:100%;
  height:100%;

  display:flex;
  align-items:center;
  justify-content:center;

  color:#666;

  background:
    linear-gradient(
      145deg,
      #ececec,
      #d8d8d8
    );
}

.sin-imagen svg{
  width:64px;
  height:64px;
}

.alojamiento-contenido{
  padding:22px;
}

.alojamiento-card h2{
  font-size:25px;
  line-height:1.15;
}

.alojamiento-descripcion{
  margin-top:11px;

  color:#3b3b3b;

  font-size:16px;
  line-height:1.55;
}

.alojamiento-datos{
  display:grid;
  gap:10px;

  margin-top:18px;
}

.alojamiento-dato{
  display:flex;
  align-items:flex-start;
  gap:10px;

  color:#333;

  font-size:15px;
  line-height:1.4;
}

.alojamiento-dato svg{
  width:21px;
  height:21px;

  flex:none;

  margin-top:1px;

  color:var(--verde);
}


/* BOTONES */

.alojamiento-acciones{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;

  margin-top:20px;
}

.alojamiento-accion{
  min-height:48px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  padding:10px 8px;
  border-radius:12px;
  color:#fff;
  background:#60a46a;
  font-size:16px;
  font-weight:700;
  text-decoration:none;
  text-align:center;
}

.alojamiento-accion:hover,
.alojamiento-accion:focus{
  background:#518e5b;
  outline:none;
}

.alojamiento-accion svg{
  width:22px;
  height:22px;
  flex:none;
}

.alojamiento-accion.secundaria{
  color:#fff;
  background:#3b3b3b;
}

.alojamiento-accion.secundaria:hover,
.alojamiento-accion.secundaria:focus{
  background:#333;
}

.nav-item{
    transition:.25s;
}

.nav-item img{
    filter:brightness(0) invert(1);
}

.nav-item span{
    color:#fff;
}

/* BOTÓN ACTIVO */

.nav-item.activo img{
    filter:brightness(0) saturate(100%)
           invert(83%) sepia(91%) saturate(1128%)
           hue-rotate(8deg) brightness(104%) contrast(102%);
}

.nav-item.activo span{
    color:#F3DF00;
}



/* ESTADO DE CARGA */

.estado{
  padding:40px 22px;

  border:1px solid rgba(0,0,0,.07);
  border-radius:22px;

  color:#555;
  background:#f7f7f7;

  text-align:center;
  line-height:1.5;
}


/* NAVEGACIÓN INFERIOR */

nav{
  position:fixed;
  left:50%;
  bottom:0;

  transform:translateX(-50%);

  z-index:30;

  width:min(100%,760px);

  display:grid;
  grid-template-columns:repeat(6,minmax(0,1fr));

  padding:
    10px 0
    calc(8px + env(safe-area-inset-bottom));

  background:#086518;
}

.nav-item{
  min-width:0;
  min-height:68px;

  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;

  gap:8px;

  padding:4px 2px;

  color:#fff;

  text-decoration:none;
  text-align:center;
  text-transform:uppercase;

  font-size:13px;
  font-weight:700;
}

.nav-item img{
  width:40px;
  height:40px;

  object-fit:contain;
  filter:brightness(0) invert(1);
}

.nav-item span{
  width:100%;

  color:#fff;

  white-space:nowrap;

  font-size:9px;
}


/* CELULAR */

@media(max-width:430px){

  header{
    grid-template-columns:43px 1fr 43px;

    padding-left:12px;
    padding-right:12px;
  }

  .alojamiento-contenido{
    padding:19px;
  }

  .alojamiento-card h2{
    font-size:23px;
  }

  .alojamiento-acciones{
    grid-template-columns:repeat(2,1fr);
  }

  .alojamiento-accion{
    min-height:46px;

    padding:9px 5px;

    font-size:14px;
  }

  .alojamiento-accion svg{
    width:20px;
    height:20px;
  }

  .nav-item img{
    width:30px;
    height:30px;
  }

}



/* NOTIFICACIONES */
.notificaciones-btn{position:relative}
.contador-notificaciones{
  position:absolute;
  top:3px;
  right:1px;
  min-width:20px;
  height:20px;
  padding:0 5px;
  display:flex;
  align-items:center;
  justify-content:center;
  border:2px solid #fff;
  border-radius:999px;
  color:#fff;
  background:#d71920;
  font-family:Arial,Helvetica,sans-serif;
  font-size:11px;
  line-height:1;
  font-weight:600;
}
.contador-notificaciones.oculto{display:none}

.panel-notificaciones{
  position:fixed;
  inset:0;
  z-index:120;
  visibility:hidden;
  opacity:0;
  background:rgba(0,0,0,.46);
  transition:.25s ease;
  font-family:Arial,Helvetica,sans-serif;
}
.panel-notificaciones.abierto{
  visibility:visible;
  opacity:1;
}
.notificaciones-contenido{
  position:absolute;
  top:0;
  right:0;
  width:min(92vw,420px);
  height:100%;
  display:flex;
  flex-direction:column;
  color:#171717;
  background:#f2f2f2;
  box-shadow:-12px 0 32px rgba(0,0,0,.22);
  transform:translateX(100%);
  transition:transform .3s ease;
}
.panel-notificaciones.abierto .notificaciones-contenido{
  transform:translateX(0);
}
.notificaciones-cabecera{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:16px;
  padding:calc(18px + env(safe-area-inset-top)) 18px 16px;
  color:#fff;
  background:#007d35;
}
.notificaciones-cabecera h2{
  margin:0;
  color:#fff;
  font-family:Arial,Helvetica,sans-serif;
  font-size:22px;
  line-height:1.2;
  font-weight:700;
  text-transform:none;
}
.cerrar-notificaciones{
  width:42px;
  height:42px;
  border:0;
  border-radius:14px;
  color:#fff;
  background:rgba(255,255,255,.14);
  font-size:30px;
  line-height:1;
  cursor:pointer;
}
.lista-notificaciones{
  flex:1;
  overflow-y:auto;
  padding:16px;
}
.notificacion{
  margin-bottom:12px;
  padding:18px;
  border:1px solid rgba(0,0,0,.07);
  border-radius:18px;
  color:#171717;
  background:#fff;
  box-shadow:0 6px 18px rgba(0,0,0,.06);
}
.notificacion h3{
  margin:0 0 7px;
  color:#111;
  font-family:Arial,Helvetica,sans-serif;
  font-size:20px;
  line-height:1.25;
  font-weight:700;
  text-transform:none;
}
.notificacion p{
  margin:0;
  color:#333;
  font-family:Arial,Helvetica,sans-serif;
  font-size:15px;
  line-height:1.5;
}
.notificacion-fecha{
  display:block;
  margin-top:10px;
  color:#777;
  font-size:12px;
  font-weight:700;
  text-transform:uppercase;
}
.notificacion-enlace{
  display:inline-flex;
  margin-top:13px;
  padding:10px 14px;
  border-radius:10px;
  color:#fff;
  background:#007d35;
  font-size:13px;
  font-weight:700;
  text-decoration:none;
  text-transform:uppercase;
}
.estado-notificaciones{
  padding:28px 18px;
  color:#555;
  text-align:center;
  line-height:1.5;
}


/* ===== CABECERA UNIFICADA — MISMO MODELO QUE INDEX ===== */
header:not(.encabezado),
.app-header{

header:not(.encabezado) .icon-btn,

}

#abrirNotificaciones svg{
  width:30px !important;

  display:block !important;
}

header:not(.encabezado) .marca,
.app-header .marca{
  width:100% !important;

header:not(.encabezado) .marca a,

header:not(.encabezado) .marca img,
.app-header .marca img,
.app-header .logo-app{

@media(max-width:430px){

  header:not(.encabezado) .icon-btn,
  .app-header .icon-btn,
  #abrirNotificaciones{
    width:43px !important;
    height:46px !important;
    min-width:43px !important;
  }
}


/* EQUIPOS EN MENÚ INFERIOR */
.nav-item .nav-svg{
  width:40px;
  height:40px;
  display:block;
  flex:none;
  color:#fff;
}
.nav-item.activo .nav-svg{
  color:#F3DF00;
}
@media(max-width:430px){
  .nav-item .nav-svg{
    width:30px;
    height:30px;
  }
}


/* Pelota de Newcom: mismo peso visual que los demás iconos */
.nav-svg{
  width:40px;
  height:40px;
  display:block;
  flex:none;
  color:#fff;
  fill:none;
}
.nav-item.activo .nav-svg{color:#F3DF00;}
@media(max-width:430px){.nav-item .nav-svg{width:36px;height:36px;}}
</style>

</head>

 <div class="marca">

</div>



<div id="panelNotificaciones" class="panel-notificaciones">

<script>

const URL_DATOS =
  "https://script.google.com/macros/s/AKfycbydaB86Z3ByT8aSrmiznBOYx9FtFOF7yjplD3zzEK7jIvHAIHbjx1YZl1v4O3YcudUK/exec";


const listaAlojamientos =
  document.getElementById("listaAlojamientos");


function escaparHTML(valor = ""){

  return String(valor)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


function limpiarTelefono(valor = ""){

  return String(valor)
    .replace(/[^\d+]/g,"");

}


function plantillaSinImagen(){

  return `
    <div
      class="sin-imagen"
      aria-hidden="true">

      <svg
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.7"
        stroke-linecap="round"
        stroke-linejoin="round">

        <path d="M3 21h18"/>
        <path d="M5 21V9l7-5 7 5v12"/>
        <path d="M9 21v-6h6v6"/>

      </svg>

    </div>
  `;

}


function renderizarAlojamientos(datos){

  const alojamientos =
    Array.isArray(datos)
      ? datos
      : Array.isArray(datos.alojamientos)
        ? datos.alojamientos
        : [];


  if(alojamientos.length === 0){

    listaAlojamientos.innerHTML = `
      <div class="estado">
        No hay alojamientos cargados por el momento.
      </div>
    `;

    return;

  }


  listaAlojamientos.innerHTML =
    alojamientos.map(a => {

      const nombre =
        a.nombre || "Alojamiento";


      const imagen =
        a.imagen
          ? `
            <div class="alojamiento-imagen">
              <img
                src="${escaparHTML(a.imagen)}"
                alt="${escaparHTML(nombre)}"
                loading="lazy"
                onerror="this.closest('.alojamiento-imagen').remove()">
            </div>
          `
          : "";


      const descripcion =
        a.descripcion
          ? `
            <p class="alojamiento-descripcion">
              ${escaparHTML(a.descripcion)}
            </p>
          `
          : "";


      const direccion =
        a.direccion
          ? `
            <div class="alojamiento-dato">

              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round">

                <path
                  d="M20 10c0 5-8 11-8 11S4 15 4 10a8 8 0 1 1 16 0z"/>

                <circle
                  cx="12"
                  cy="10"
                  r="2.5"/>

              </svg>

              <span>
                ${escaparHTML(a.direccion)}
              </span>

            </div>
          `
          : "";


      const distancia =
        a.distancia
          ? `
            <div class="alojamiento-dato">

              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round">

                <path d="M4 17l5-5 4 4 7-7"/>
                <path d="M14 9h6v6"/>

              </svg>

              <span>
                ${escaparHTML(a.distancia)} del Polideportivo.
              </span>

            </div>
          `
          : "";


      const telefono =
        limpiarTelefono(a.telefono);


      const botonLlamar =
        telefono
          ? `
            <a
              class="alojamiento-accion"
              href="tel:${escaparHTML(telefono)}">

              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true">

                <path
                  d="M22 16.92v3
                     a2 2 0 0 1-2.18 2
                     19.79 19.79 0 0 1-8.63-3.07
                     19.5 19.5 0 0 1-6-6
                     19.79 19.79 0 0 1-3.07-8.67
                     A2 2 0 0 1 3.89 2h3
                     a2 2 0 0 1 2 1.72
                     c.12.9.33 1.78.62 2.63
                     a2 2 0 0 1-.45 2.11
                     L7.91 9.91
                     a16 16 0 0 0 6 6
                     l1.45-1.15
                     a2 2 0 0 1 2.11-.45
                     c.85.29 1.73.5 2.63.62
                     A2 2 0 0 1 22 16.92z"/>

              </svg>

              <span>Llamar</span>

            </a>
          `
          : "";


      const botonMapa =
  a.mapa
    ? `
      <a
        class="alojamiento-accion secundaria"
        href="${escaparHTML(a.mapa)}"
        target="_blank"
        rel="noopener">

        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true">

          <path
            d="M20 10c0 5-8 11-8 11S4 15 4 10a8 8 0 1 1 16 0z"/>

          <circle
            cx="12"
            cy="10"
            r="3"/>

        </svg>

        <span>Cómo llegar</span>

      </a>
    `
    : "";


      return `
        <article class="alojamiento-card">

          ${imagen}

          <div class="alojamiento-contenido">

}

  try{

    const respuesta =
      await fetch(
        `${URL_DATOS}?t=${Date.now()}`,
        {
          cache:"no-store"
        }
      );


    if(!respuesta.ok){

      throw new Error(
        `HTTP ${respuesta.status}`
      );

    }


    const datos =
      await respuesta.json();


    renderizarAlojamientos(datos);


  }catch(error){

      <div class="estado">
        No se pudieron cargar los alojamientos.
      </div>

cargarAlojamientos();

</script>


<script>
(() => {
  const URL_NOTIFICACIONES =
    "https://script.google.com/macros/s/AKfycbwAZygEDd7if7oeF6jCFZOJeMsyEquTRW4xamKNyIhirIB18VUx034PQ7IJZeAjJWL8/exec";

  const CLAVE_NOTIFICACIONES_LEIDAS =
    "boulevard_notificaciones_leidas_v2";

  const abrir = document.getElementById("abrirNotificaciones");
  const cerrar = document.getElementById("cerrarNotificaciones");
  const panel = document.getElementById("panelNotificaciones");
  const lista = document.getElementById("listaNotificaciones");
  const contador = document.getElementById("contadorNotificaciones");

  if(!abrir || !cerrar || !panel || !lista || !contador) return;

  let notificacionesActuales = [];

  function notifEscaparHTML(valor=""){
    return String(valor)
      .replaceAll("&","&amp;")
      .replaceAll("<","&lt;")
      .replaceAll(">","&gt;")
      .replaceAll('"',"&quot;")
      .replaceAll("'","&#039;");
  }

  function crearIdNotificacion(item){
    if(
      item.idNotificacion !== undefined &&
      item.idNotificacion !== null &&
      String(item.idNotificacion).trim() !== ""
    ){
      return String(item.idNotificacion).trim();
    }

    if(
      item.id !== undefined &&
      item.id !== null &&
      String(item.id).trim() !== ""
    ){
      return String(item.id).trim();
    }

    return [
      item.titulo ?? item.Titulo ?? "",
      item.mensaje ?? item.Mensaje ?? item.descripcion ?? "",
      item.fecha ?? item.Fecha ?? "",
      item.enlace ?? item.Enlace ?? item.url ?? ""
    ].join("|").trim();
  }

  function obtenerIdsLeidos(){
    try{
      const guardados =
        JSON.parse(localStorage.getItem(CLAVE_NOTIFICACIONES_LEIDAS) || "[]");

      return new Set(
        Array.isArray(guardados)
          ? guardados.map(String)
          : []
      );
    }catch(error){
      console.warn("No se pudieron recuperar las notificaciones leídas:",error);
      return new Set();
    }
  }

  function guardarIdsLeidos(ids){
    try{
      localStorage.setItem(
        CLAVE_NOTIFICACIONES_LEIDAS,
        JSON.stringify(Array.from(ids))
      );
    }catch(error){
      console.warn("No se pudieron guardar las notificaciones leídas:",error);
    }
  }

  function actualizarContadorNoLeidas(){
    const idsLeidos = obtenerIdsLeidos();

    const cantidadNoLeidas =
      notificacionesActuales.filter(
        item => !idsLeidos.has(item.idNotificacion)
      ).length;

    contador.textContent = String(cantidadNoLeidas);
    contador.setAttribute(
      "aria-label",
      `${cantidadNoLeidas} notificaciones no leídas`
    );
    contador.classList.toggle("oculto",cantidadNoLeidas === 0);
  }

  function marcarNotificacionesComoLeidas(){
    if(notificacionesActuales.length === 0) return;

    const idsLeidos = obtenerIdsLeidos();

    notificacionesActuales.forEach(item => {
      idsLeidos.add(item.idNotificacion);
    });

    guardarIdsLeidos(idsLeidos);
    actualizarContadorNoLeidas();
  }

  function renderizarNotificaciones(datos){
    const base =
      Array.isArray(datos)
        ? datos
        : Array.isArray(datos.notificaciones)
          ? datos.notificaciones
          : [];

    notificacionesActuales = base
      .map(item => ({
        idNotificacion: crearIdNotificacion(item),
        titulo: item.titulo ?? item.Titulo ?? "Aviso",
        mensaje:
          item.mensaje ??
          item.Mensaje ??
          item.descripcion ??
          "",
        fecha: item.fecha ?? item.Fecha ?? "",
        enlace:
          item.enlace ??
          item.Enlace ??
          item.url ??
          "",
        activa:
          item.activa ??
          item.Activa ??
          item.publicar ??
          true
      }))
      .filter(item => {
        const activa = String(item.activa).trim().toLowerCase();
        return !["no","false","0","inactiva","inactivo"].includes(activa);
      });

    actualizarContadorNoLeidas();

    if(notificacionesActuales.length === 0){
      lista.innerHTML =
        '<p class="estado-notificaciones">No hay notificaciones nuevas.</p>';
      return;
    }

    lista.innerHTML =
      notificacionesActuales.map(item => {
        const enlace = item.enlace
          ? `
            <a class="notificacion-enlace"
              href="${notifEscaparHTML(item.enlace)}"
              target="_blank"
              rel="noopener">Ver más</a>
          `
          : "";

        const fecha = item.fecha
          ? `<span class="notificacion-fecha">${notifEscaparHTML(item.fecha)}</span>`
          : "";

        return `
          <article class="notificacion">
            <h3>${notifEscaparHTML(item.titulo)}</h3>
            <p>${notifEscaparHTML(item.mensaje)}</p>
            ${fecha}
            ${enlace}
          </article>
        `;
      }).join("");
  }

  async function cargarNotificaciones(){
    try{
      const respuesta =
        await fetch(`${URL_NOTIFICACIONES}?t=${Date.now()}`,{cache:"no-store"});

      if(!respuesta.ok){
        throw new Error(`HTTP ${respuesta.status}`);
      }

      renderizarNotificaciones(await respuesta.json());
      return true;

    }catch(error){
      console.error(error);
      lista.innerHTML =
        '<p class="estado-notificaciones">No se pudieron cargar las notificaciones.</p>';
      return false;
    }
  }

  async function abrirPanel(){
    panel.classList.add("abierto");
    abrir.setAttribute("aria-expanded","true");

    const cargaCorrecta = await cargarNotificaciones();

    if(cargaCorrecta){
      marcarNotificacionesComoLeidas();
    }
  }

  function cerrarPanel(){
    marcarNotificacionesComoLeidas();
    panel.classList.remove("abierto");
    abrir.setAttribute("aria-expanded","false");
  }

  abrir.addEventListener("click",abrirPanel);
  cerrar.addEventListener("click",cerrarPanel);

  panel.addEventListener("click",evento => {
    if(evento.target === panel){
      cerrarPanel();
    }
  });

  document.addEventListener("keydown",evento => {
    if(evento.key === "Escape" && panel.classList.contains("abierto")){
      cerrarPanel();
    }
  });

  cargarNotificaciones();
  setInterval(cargarNotificaciones,60000);
})();
</script>
