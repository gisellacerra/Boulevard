<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Asistente de Torneos</title><style>
:root{font-family:Inter,Arial,sans-serif;color:#18362e;background:#f3f6f3}*{box-sizing:border-box}body{margin:0}.app{display:flex;min-height:100vh}aside{display:flex;flex-direction:column;width:255px;background:#123e32;color:white;padding:24px 15px;flex-shrink:0}.brand{font-weight:800;font-size:18px;line-height:1.3;padding:8px 12px 25px}.brand small{display:block;font-size:11px;font-weight:400;color:#b8d6c8;margin-top:7px}nav{display:grid;gap:5px}.credit{margin-top:auto;padding:22px 12px 5px;border-top:1px solid #3c6656;font-size:12px;line-height:1.65;color:#c4dacf}.credit strong{display:block;color:#fff;font-size:12px;margin-bottom:5px}.credit a{color:inherit;text-decoration:none}.credit a:hover{text-decoration:underline}nav button{border:0;background:transparent;color:#d7e9de;padding:12px 14px;text-align:left;border-radius:9px;cursor:pointer;font-size:14px}nav button.active,nav button:hover{background:#2b6953;color:white}main{flex:1;min-width:0;padding:34px;max-width:1450px}.top{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:28px}.eyebrow{font-size:12px;color:#4d7966;letter-spacing:1px;font-weight:700}.top h1{font-size:28px;margin:7px 0}.pill{background:#e5efe9;border-radius:30px;padding:9px 14px;font-size:12px;color:#326a4f}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:15px}.card,.panel{background:white;border:1px solid #e1e9e3;border-radius:14px;padding:21px}.card b{font-size:31px;display:block;margin:8px 0}.muted{color:#71867a;font-size:13px}.section{margin-top:24px}.panel h2{margin:0 0 12px;font-size:19px}.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.action{background:#f6f9f7;border:1px solid #e3ebe5;border-radius:10px;padding:17px;text-align:left;cursor:pointer;font-size:14px;color:#174b36}.action:hover{border-color:#39976b}.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.field{display:grid;gap:6px;font-size:13px;font-weight:600}.field.full{grid-column:1/-1}input,select,textarea{width:100%;padding:11px;border:1px solid #cad8cf;border-radius:8px;font:inherit;background:white}button.primary{border:0;background:#177a51;color:white;padding:12px 18px;border-radius:8px;cursor:pointer;font-weight:700}button.secondary{border:1px solid #b8cfc1;background:white;color:#20583c;padding:10px 14px;border-radius:8px;cursor:pointer}.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}.toolbar select{max-width:180px}.tablewrap{overflow:auto}table{border-collapse:collapse;width:100%;font-size:13px}td,th{padding:13px 10px;text-align:left;border-bottom:1px solid #edf0ed}th{background:#f5f8f5}.empty{padding:28px;text-align:center;color:#7c8c82;background:#f8faf8;border-radius:10px}.notice{border-left:4px solid #e4ad34;background:#fff9e8;padding:12px;margin:12px 0;font-size:13px}.status{font-size:12px;color:#46735c}.hidden{display:none!important}@media(max-width:900px){.cards{grid-template-columns:repeat(2,1fr)}.actions{grid-template-columns:repeat(2,1fr)}aside{width:205px}main{padding:22px}}@media(max-width:650px){.app{display:block}aside{display:block}.credit{margin-top:14px;padding:12px 8px 2px}aside{width:100%;padding:12px}.brand{padding:6px 8px 12px}nav{display:flex;overflow-x:auto;gap:5px}nav button{white-space:nowrap;padding:9px 12px}main{padding:18px}.top h1{font-size:23px}.cards{grid-template-columns:repeat(2,1fr)}.actions,.form{grid-template-columns:1fr}.top{align-items:flex-start}.pill{white-space:nowrap}}
</style></head><body><div class="app"><aside><div class="brand">◉ ASISTENTE<br>DE TORNEOS<small>Administración privada · <span class="year"></span></small></div><nav id="nav"></nav><div class="credit"><strong>Desarrollo</strong>Gisella Cerra<br>Diseñadora en Comunicación Visual<br>Tel.: <a href="tel:2920411544">2920411544</a></div></aside><main><header class="top"><div><div class="eyebrow">PANEL DE ADMINISTRACIÓN</div><h1 id="heading">Inicio</h1><div class="muted">Torneo Nacional de Newcom · <span class="year"></span></div></div><span class="pill">● Modo demostración</span></header><div id="view"></div></main></div><script>
const modules=[['inicio','⌂','Inicio'],['equipos','♟','Equipos'],['zonas','◈','Sorteo de zonas'],['fixture','▦','Fixture y canchas'],['resultados','✓','Resultados'],['posiciones','▥','Posiciones y cruces'],['avisos','♧','Notificaciones'],['bufet','☕','Bufet'],['alojamiento','⌂','Alojamiento'],['config','⚙','Configuración']];let active='inicio';let teams=[];let notices=[];let services=[];let settings={nombre:'Torneo Nacional de Newcom',edicion:'VI',canchas:4,duracion:50,intervalo:5};const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const field=(label,name,type='text',value='',extra='')=>`<label class="field">${label}<input name="${name}" type="${type}" value="${esc(value)}" ${extra}></label>`;const panel=(title,content)=>`<section class="panel section"><h2>${title}</h2>${content}</section>`;const msg='<div class="notice">Este módulo es una maqueta visual. Todavía no está conectado con Google Sheets ni Apps Script.</div>';
function navigate(id){active=id;render()};function render(){document.querySelectorAll('.year').forEach(x=>x.textContent=new Date().getFullYear());$('#nav').innerHTML=modules.map(([id,icon,title])=>`<button class="${id===active?'active':''}" data-go="${id}">${icon} &nbsp; ${title}</button>`).join('');$('#heading').textContent=modules.find(m=>m[0]===active)[2];const view=$('#view');if(active==='inicio'){view.innerHTML=`<div class="cards"><div class="card"><span class="muted">Equipos inscriptos</span><b>${teams.length}</b><span class="status">Registro de prueba</span></div><div class="card"><span class="muted">Categorías</span><b>3</b><span class="status">+50 · +60 · +68</span></div><div class="card"><span class="muted">Canchas</span><b>${settings.canchas}</b><span class="status">Configurables</span></div><div class="card"><span class="muted">Avisos</span><b>${notices.length}</b><span class="status">Sin publicar</span></div></div>${panel('Accesos rápidos',`<div class="actions">${modules.slice(1,7).map(([id,icon,title])=>`<button class="action" data-go="${id}">${icon} &nbsp; ${title} →</button>`).join('')}</div>`)}${panel('Estado del sistema',msg+'<p class="muted">Primera versión integrada del panel. Los registros de prueba permanecen únicamente mientras esta página esté abierta.</p>')}`}
else if(active==='equipos'){view.innerHTML=panel('Inscribir equipo',`<form id="teamForm" class="form">${field('Nombre del equipo *','nombre','text','','required')}<label class="field">Categoría<select name="categoria"><option>+50</option><option>+60</option><option>+68</option></select></label>${field('Localidad','localidad')}${field('Nombre del DT *','dt','text','','required')}${field('Teléfono de contacto *','telefono','tel','','required')}${field('Hombres','hombres','number','0','min="0" required')}${field('Mujeres','mujeres','number','0','min="0" required')}<div class="field full"><button class="primary" type="submit">Guardar equipo</button></div></form>`)+panel('Equipos registrados',teams.length?`<div class="tablewrap"><table><thead><tr><th>Equipo</th><th>Categoría</th><th>Localidad</th><th>DT</th><th>Hombres</th><th>Mujeres</th><th>Total</th><th></th></tr></thead><tbody>${teams.map((t,i)=>`<tr><td>${esc(t.nombre)}</td><td>${esc(t.categoria)}</td><td>${esc(t.localidad)}</td><td>${esc(t.dt)}</td><td>${t.hombres}</td><td>${t.mujeres}</td><td>${t.hombres+t.mujeres}</td><td><button class="secondary" data-remove-team="${i}">Eliminar</button></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Todavía no hay equipos registrados.</div>')}
else if(active==='config'){view.innerHTML=panel('Parámetros generales',`<form id="settingsForm" class="form">${field('Nombre del torneo','nombre','text',settings.nombre,'required')}${field('Edición','edicion','text',settings.edicion,'required')}${field('Canchas','canchas','number',settings.canchas,'min="1" required')}${field('Duración del juego (min)','duracion','number',settings.duracion,'min="1" required')}${field('Intervalo (min)','intervalo','number',settings.intervalo,'min="0" required')}<label class="field">Año automático<input disabled value="${new Date().getFullYear()}"></label><div class="field full"><button class="primary" type="submit">Guardar configuración de prueba</button></div></form>`)+panel('Próxima integración',msg+'<p class="muted">Las fechas, jornadas, criterios de desempate y reglas de clasificación se incorporarán al conectar el backend.</p>')}
else if(active==='avisos'){view.innerHTML=panel('Redactar aviso',`<form id="noticeForm" class="form"><label class="field full">Mensaje<textarea name="texto" rows="4" required placeholder="Escribí el aviso para los jugadores..."></textarea></label><label class="field">Prioridad<select name="prioridad"><option>Normal</option><option>Importante</option><option>Urgente</option></select></label><div class="field full"><button class="primary">Guardar borrador</button></div></form>`)+panel('Avisos de prueba',notices.length?notices.map(n=>`<div class="notice"><b>${esc(n.prioridad)}</b><p>${esc(n.texto)}</p><span class="status">Borrador · No publicado</span></div>`).join(''):'<div class="empty">No hay avisos.</div>')}
else if(active==='bufet'||active==='alojamiento'){const alojamiento=active==='alojamiento';view.innerHTML=panel(alojamiento?'Agregar alojamiento':'Agregar producto de bufet',`<form id="serviceForm" class="form">${field(alojamiento?'Nombre del alojamiento':'Producto','nombre','text','','required')}${field(alojamiento?'Tarifa orientativa':'Precio','precio')}${alojamiento?field('Dirección','direccion')+field('Teléfono / WhatsApp','contacto','tel'):''}<label class="field full">Descripción<textarea name="descripcion" rows="3"></textarea></label><div class="field full"><button class="primary">Guardar borrador</button></div></form>`)+panel('Registros',services.filter(s=>s.tipo===active).length?services.filter(s=>s.tipo===active).map(s=>`<div class="notice"><b>${esc(s.nombre)}</b> · ${esc(s.precio)}<p>${esc(s.descripcion)}</p><span class="status">Borrador</span></div>`).join(''):'<div class="empty">No hay registros.</div>')}
else{const descriptions={zonas:'Sorteo manualmente configurable por categoría. Se mostrarán equipos inscriptos, zonas sorteadas y confirmación.',fixture:'Grilla por día, hora y cancha. Permitirá arrastrar y soltar, edición manual, validación, borradores y publicación controlada.',resultados:'Carga de Set 1, Set 2 y Tie Break cuando corresponda, con validación de marcadores.',posiciones:'Tablas por zona, criterios oficiales de desempate, clasificación, semifinales, tercer puesto y final.'};view.innerHTML=panel('Diseño del módulo',`<p>${descriptions[active]}</p>${msg}`)+panel('Próximo paso','<p class="muted">Este módulo se conectará a las pestañas y operaciones correspondientes de Google Sheets y Apps Script.</p>')};document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>navigate(b.dataset.go));document.querySelectorAll('[data-remove-team]').forEach(b=>b.onclick=()=>{teams.splice(Number(b.dataset.removeTeam),1);render()});const tf=$('#teamForm');if(tf)tf.onsubmit=e=>{e.preventDefault();const d=Object.fromEntries(new FormData(tf));d.hombres=Number(d.hombres);d.mujeres=Number(d.mujeres);if(d.hombres+d.mujeres<=0){alert('Ingresá al menos un jugador.');return}if(teams.some(t=>t.nombre.toLowerCase()===d.nombre.trim().toLowerCase()&&t.categoria===d.categoria)){alert('Ese equipo ya existe en la categoría.');return}teams.push(d);render()};const sf=$('#settingsForm');if(sf)sf.onsubmit=e=>{e.preventDefault();const d=Object.fromEntries(new FormData(sf));settings={...d,canchas:Number(d.canchas),duracion:Number(d.duracion),intervalo:Number(d.intervalo)};render();alert('Configuración actualizada en la demostración.')};const nf=$('#noticeForm');if(nf)nf.onsubmit=e=>{e.preventDefault();notices.unshift(Object.fromEntries(new FormData(nf)));render()};const serv=$('#serviceForm');if(serv)serv.onsubmit=e=>{e.preventDefault();services.unshift({...Object.fromEntries(new FormData(serv)),tipo:active});render()}}render();
</script></body></html>
