000}#nc-demo .portrait{height:100px;width:100px;background:#ffe000;color:#101810;display:flex;align-items:center;justify-content:center;border-radius:50%;margin-bottom:24px}#nc-demo .portrait svg{width:50px;height:50px}#nc-demo .sub{font-size:12px;color:#a9b5ad;padding:0 24px 18px}#nc-demo .choices{display:flex;gap:10px;margin-top:auto}#nc-demo .choices button{margin:0}#nc-demo .secondary{background:#2c3130;color:white;border:1px solid #69736c} @keyframes nc-in{from{transform:translateX(55px);opacity:.4}to{transform:translateX(0);opacity:1}}@media(prefers-reduced-motion:reduce){#nc-demo .slide{animation:none}}

wport"><div class="slide" aria-live="polite"></div></div><div class="bottom"></div><div class="sub"><span id="mode"></span></div></div>
<script>
(()=>{const root=document.getElementById('nc-demo'),area=root.querySelector('.slide'),dots=root.querySelector('.bottom');let step=0,name='',score=0,answers=[];const API_URL=window.NEWCOM_API_URL||'';const connected=!!API_URL;root.querySelector('#mode').textContent=connected?'Desafío de hoy · 4 preguntas':'Modo prueba · no envía datos';const qs=[{"q": "¿Cuál es la altura de la red según las reglas oficiales de Newcom?", "a": ["La altura de la red es de 2.00 metros para todos los géneros.", "La altura de la red es de 2.50 metros para hombres y 2.30 metros para mujeres.", "La altura de la red es de 2.43 metros para hombres y 2.24 metros para mujeres.", "La altura de la red es de 2.10 metros para hombres y 2.00 metros para mujeres."], "c": 2, "why": "La altura de la red es de 2.43 metros para hombres y 2.24 metros para mujeres."}, {"q": "¿Qué se requiere para ganar un set en Newcom?", "a": ["Se debe ganar al menos 20 puntos con una ventaja de 1 punto.", "Se debe ganar al menos 30 puntos sin necesidad de ventaja.", "Se debe ganar al menos 25 puntos con una ventaja de 2 puntos.", "Se debe ganar al menos 15 puntos con una ventaja de 3 puntos."], "c": 2, "why": "Se debe ganar al menos 25 puntos con una ventaja de 2 puntos."}, {"q": "¿Qué objetos están prohibidos en el reglamento de Newcom?", "a": ["Ropa de colores brillantes que no sea uniforme.", "Objetos que puedan causar lesiones o interferir con el juego.", "Cualquier tipo de calzado deportivo.", "Cualquier tipo de bebida energética."], "c": 1, "why": "Objetos que puedan causar lesiones o interferir con el juego."}, {"q": "¿Cuál es la función del capitán en un equipo de Newcom?", "a": ["El capitán es responsable de entrenar al equipo.", "El capitán no tiene ninguna función específica durante el juego.", "El capitán solo se encarga de la indumentaria del equipo.", "El capitán coordina las jugadas y representa al equipo ante los árbitros."], "c": 3, "why": "El capitán coordina las jugadas y representa al equipo ante los árbitros."}];function button(t,fn,cls='action'){const b=document.createElement('button');b.type='button';b.className=cls+' cursor-interaction';b.textContent=t;b.onclick=fn;return b}function show(){area.innerHTML='';area.style.animation='none';void area.offsetWidth;area.style.animation='';dots.innerHTML=Array.from({length:7},(_,i)=>'<span class="dot '+(i<=step?'on':'')+'"></span>').join('');if(step===0){area.innerHTML='<div class="eyebrow">EL DESAFÍO DE HOY</div><h2>El entrenamiento<br>empieza <em>acá.</em></h2><p>Cuatro preguntas para entrar en juego.<br>Después, nos vemos en la cancha.</p><label for="nc-name">Tu nombre</label><input id="nc-name" placeholder="Escribí tu nombre" maxlength="30" autocomplete="given-name">';area.append(button('Quiero jugar →',()=>{const input=root.querySelector('input');if(!input.value.trim()){input.focus();return}name=input.value.trim();step++;show()}));}else if(step<=4){const q=qs[step-1];area.innerHTML='<div class="eyebrow">PREGUNTA '+step+' DE 4</div><h2>'+q.q+'</h2>';let locked=false;q.a.forEach((a,i)=>area.append(button(a,()=>{if(locked)return;locked=true;answers.push(i);if(i===q.c)score++;const bs=area.querySelectorAll('.answer');bs[q.c].classList.add('correct');if(i!==q.c)bs[i].classList.add('wrong');const f=document.createElement('div');f.className='feedback';f.textContent=(i===q.c?'¡Bien! ':'Para la próxima: ')+q.why;area.append(f,button(step===4?'Ver mi puntaje →':'Siguiente →',()=>{step++;show()}))},'answer')));}else if(step===5){area.innerHTML='<div class="eyebrow">ASÍ VIENE EL EQUIPO</div><h2>¡Bien jugado!</h2><div class="score">'+score+' / 4</div><p>Tu puntaje de hoy</p><div id="nc-player"></div>';root.querySelector('#nc-player').textContent=name;area.append(button('Ahora, a la cancha →',()=>{step++;show()}));}else{area.innerHTML='<div class="coach-photo"><img src="entrenador-final.png" alt="El entrenador de Boulevard señala hacia vos: hoy entrenamiento, no faltes"></div><h2>Te espero hoy.<br><em>¡No faltes!</em> <span role="img" aria-label="Mano con el dedo índice señalándote">🫵</span></h2><p>¿Venís a entrenar?</p><div class="choices"></div>';const choices=area.querySelector('.choices');['Sí, ahí estaré','Hoy no puedo'].forEach((t,i)=>choices.append(button(t,()=>{finish(i===0?'Sí':'No')},'action '+(i?'secondary':''))));if(window.lucide)lucide.createIcons();}}function finish(asistencia){area.innerHTML='<h2>Guardando…</h2>';const render=(res)=>{area.innerHTML='<div class="eyebrow">'+(connected?'RESPUESTA GUARDADA':'MODO PRUEBA · SIN ENVÍO')+'</div><h2>'+(asistencia==='Sí'?'¡Te esperamos<br>en la <em>cancha!</em>':'Gracias por<br><em>avisar.</em>')+'</h2><p>Tu puntaje: '+res.puntos+' de 4</p>';if(res.repetido){const p=document.createElement('p');p.textContent='Conservamos tu primer puntaje del día y actualizamos tu asistencia.';area.append(p);}const title=document.createElement('p');title.textContent=connected?'Puntajes del equipo · hoy':'Tu resultado de prueba';area.append(title);res.ranking.forEach(r=>{const row=document.createElement('div');row.className='row';const n=document.createElement('span'),v=document.createElement('span');n.textContent=r.nombre;v.textContent=r.puntos+' / 4';row.append(n,v);area.append(row)});area.append(button('Volver al inicio',()=>{step=0;score=0;answers=[];show()}));};if(!connected){render({puntos:score,ranking:[{nombre:name,puntos:score}]});return;}const controller=new AbortController();const timeout=setTimeout(()=>controller.abort(),20000);fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({nombre:name,respuestas:answers,asistencia}),signal:controller.signal}).then(r=>{if(!r.ok)throw Error('HTTP');return r.json()}).then(res=>{if(!res.ok)throw Error(res.error||'Error');render(res.resultado)}).catch(()=>{area.innerHTML='<h2>No se pudo guardar</h2><p>Revisá la conexión e intentá nuevamente.</p>';area.append(button('Reintentar',()=>finish(asistencia)));}).finally(()=>clearTimeout(timeout));}show();})();
</script>
